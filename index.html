<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phatshanant Thanakitpunsakul | Executive Project Portfolio</title>

<style>
:root{
  --navy:#0B1D3A;
  --blue:#173C68;
  --soft:#F7F9FC;
  --cream:#F8F5EF;
  --gold:#C9A96E;
  --ink:#111827;
  --muted:#64748B;
  --white:#FFFFFF;
  --line:#E5EAF2;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--soft);
  color:var(--ink);
  line-height:1.7;
}
a{text-decoration:none;color:inherit}

nav{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:16px 7vw;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  color:var(--navy);
  font-weight:800;
  letter-spacing:.3px;
}
.navlinks{
  display:flex;
  gap:22px;
  font-size:13px;
  color:var(--muted);
}
.navlinks a:hover{color:var(--gold)}

.hero{
  min-height:92vh;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  background:linear-gradient(135deg,#fff 0%,#f4f7fb 55%,#dfe8f5 100%);
}
.heroText{
  padding:76px 7vw;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.eyebrow{
  display:inline-block;
  width:max-content;
  padding:8px 16px;
  border:1px solid rgba(11,29,58,.28);
  border-radius:999px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.8px;
  color:var(--navy);
  background:rgba(255,255,255,.75);
  margin-bottom:26px;
}
h1{
  font-size:clamp(50px,7vw,92px);
  line-height:.96;
  font-weight:300;
  letter-spacing:-3px;
  color:var(--blue);
}
.hero h2{
  max-width:760px;
  margin:28px 0;
  font-size:clamp(24px,3vw,40px);
  line-height:1.16;
  font-weight:300;
  color:var(--navy);
}
.lead{
  max-width:720px;
  color:#475569;
  font-size:18px;
}
.chips{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:26px 0;
}
.chip{
  background:rgba(23,60,104,.08);
  color:var(--blue);
  padding:7px 13px;
  border:1px solid rgba(23,60,104,.1);
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
}
.btns{
  margin-top:28px;
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}
.btn{
  padding:14px 23px;
  border-radius:9px;
  font-weight:800;
  border:1px solid var(--navy);
}
.primary{background:var(--navy);color:white}
.secondary{background:white;color:var(--navy)}
.btn:hover{transform:translateY(-2px)}

.heroImage{
  background:linear-gradient(180deg,#253956,#0B1D3A);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:45px;
  position:relative;
}
.heroImage:before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);
  border-radius:50%;
  filter:blur(20px);
}
.portrait{
  position:relative;
  width:min(500px,100%);
  padding:18px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);
  border-radius:34px;
  box-shadow:0 35px 90px rgba(0,0,0,.35);
}
.portrait img{
  width:100%;
  height:720px;
  object-fit:cover;
  object-position:center top;
  border-radius:28px;
  display:block;
}
.caption{
  color:white;
  text-align:center;
  padding:20px 10px 4px;
}
.caption h3{color:var(--gold);font-size:18px}
.caption p{color:#dbeafe;font-size:14px}

section{padding:86px 7vw}
.sectionTitle{
  max-width:1120px;
  margin:0 auto 46px;
}

  line-height:1.08;
