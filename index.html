<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phatshanant Thanakitpunsakul | Executive Healthcare Brand</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;background:#f7f9fc;color:#111827;line-height:1.7}
a{text-decoration:none;color:inherit}
nav{position:sticky;top:0;z-index:99;background:white;border-bottom:1px solid #e5eaf2;padding:16px 6vw;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;color:#0b1d3a}
.navlinks{display:flex;gap:18px;font-size:13px;color:#64748b}
.navlinks a:hover{color:#c9a96e}
section{padding:82px 6vw}
.label{display:inline-block;border:1px solid #b8c5d6;border-radius:999px;padding:8px 14px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#173c68;background:white;margin-bottom:22px}
.hero{min-height:92vh;display:grid;grid-template-columns:1.1fr .9fr;background:linear-gradient(135deg,#fff,#edf4fb)}
.heroText{padding:70px 6vw;display:flex;flex-direction:column;justify-content:center}
h1{font-size:clamp(44px,7vw,82px);line-height:1;color:#173c68;font-weight:300;letter-spacing:-2px}
.hero h2,.title h2{font-size:clamp(28px,4vw,52px);line-height:1.15;font-weight:300;color:#0b1d3a;margin:16px 0}
p{color:#475569}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}
.chip{font-size:11px;text-transform:uppercase;letter-spacing:.8px;background:#e8eef6;color:#173c68;padding:7px 12px;border-radius:999px;font-weight:700}
.btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px}
.btn{padding:13px 22px;border-radius:8px;font-weight:700;border:1px solid #0b1d3a}
.primary{background:#0b1d3a;color:white}
.secondary{background:white;color:#0b1d3a}
.heroImg{background:linear-gradient(180deg,#253956,#0b1d3a);display:flex;align-items:center;justify-content:center;padding:40px}
.photo{width:min(430px,100%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:30px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.photo img{width:100%;height:600px;object-fit:cover;object-position:center top;border-radius:24px;display:block}
.caption{text-align:center;color:white;padding:18px 6px 4px}
.caption h3{color:#c9a96e}
.title{max-width:1100px;margin:0 auto 42px}
.title p{max-width:850px}
.grid{max-width:1100px;margin:auto;display:grid;gap:22px}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
.four{grid-template-columns:repeat(4,1fr)}
.card,.metric{background:white;border:1px solid #e5eaf2;border-radius:22px;padding:26px;box-shadow:0 18px 45px rgba(15,23,42,.06)}
.card h3{color:#173c68;margin-bottom:10px}
.metric{background:#0b1d3a;color:white}
.metric strong{display:block;color:#c9a96e;font-size:30px;margin-bottom:6px}
.dark{background:linear-gradient(135deg,#0b1d3a,#173c68);color:white}
.dark .title h2,.dark .title p{color:white}
.dark .card{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)}
.dark .card h3{color:#c9a96e}
.dark .card p{color:#dbeafe}
.project{max-width:1100px;margin:0 auto 24px;background:white;border-radius:28px;overflow:hidden;display:grid;grid-template-columns:.33fr .67fr;box-shadow:0 22px 55px rgba(15,23,42,.08)}
.projectNo{background:#0b1d3a;color:white;padding:32px}
.projectNo span{color:#c9a96e;font-size:12px;text-transform:uppercase;letter-spacing:1.5px}
.projectNo strong{display:block;font-size:50px;font-weight:300;margin-top:18px}
.projectBody{padding:32px}
.projectBody h3{font-size:28px;color:#0b1d3a;margin-bottom:10px}
.meta{color:#c9a96e;font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:1px;margin-bottom:12px}
.miniGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.mini{background:#f8fafc;border:1px solid #e5eaf2;border-radius:16px;padding:16px}
.mini b{display:block;color:#173c68;margin-bottom:6px}
.mini p{font-size:14px}
.quote{max-width:1100px;margin:auto;background:white;border-left:5px solid #c9a96e;border-radius:22px;padding:32px;font-size:21px;color:#0b1d3a}
footer{background:#0b1d3a;color:#cbd5e1;text-align:center;padding:34px 6vw;font-size:14px}
@media(max-width:900px){
.navlinks{display:none}
.hero{grid-template-columns:1fr}
.photo img
</style>
</head>
<body>

<h1 style="padding:40px;">Website loading test</h1>

</body>
</html>
