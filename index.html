<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phatshanant Thanakitpunsakul | Executive Healthcare & Wellness Brand</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
:root{
  --navy:#0B1D3A;
  --blue:#173C68;
  --soft:#F7F9FC;
  --cream:#F8F5EF;
  --gold:#C9A96E;
  --ink:#111827;
  --muted:#64748B;
  --line:#E5EAF2;
  --white:#FFFFFF;
}
body{
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--soft);
  color:var(--ink);
  line-height:1.75;
}
a{text-decoration:none;color:inherit}
nav{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:16px 7vw;
  display:flex;justify-content:space-between;align-items:center;
}
.logo{font-weight:800;color:var(--navy);letter-spacing:.4px}
.navlinks{display:flex;gap:24px;font-size:13px;color:var(--muted)}
.navlinks a:hover{color:var(--gold)}

.hero{
  min-height:94vh;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  background:linear-gradient(135deg,#fff 0%,#f6f9fc 58%,#e4edf7 100%);
}
.heroText{
  padding:84px 7vw;
  display:flex;flex-direction:column;justify-content:center;
}
.label{
  display:inline-block;width:max-content;
  border:1px solid rgba(11,29,58,.25);
  border-radius:999px;
  padding:8px 15px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.8px;
  color:var(--blue);
  background:rgba(255,255,255,.75);
  margin-bottom:26px;
}
h1{
  font-size:clamp(48px,7vw,88px);
  line-height:.98;
  font-weight:300;
  letter-spacing:-3px;
  color:var(--blue);
}
.hero h2{
  margin:28px 0 18px;
  max-width:720px;
  font-size:clamp(25px,3vw,38px);
  font-weight:300;
  line-height:1.18;
  color:var(--navy);
}
.hero p{
  max-width:700px;
  color:#475569;
  font-size:17px;
}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0}
.chip{
  background:rgba(23,60,104,.08);
  color:var(--blue);
  border:1px solid rgba(23,60,104,.10);
  border-radius:999px;
  padding:7px 13px;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
}
.btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.btn{
  padding:13px 22px;
  border-radius:9px;
  border:1px solid var(--navy);
  font-weight:800;
}
.primary{background:var(--navy);color:white}
.secondary{background:white;color:var(--navy)}
.btn:hover{transform:translateY(-2px)}

.heroImage{
  background:linear-gradient(180deg,#243653,#0B1D3A);
  display:flex;align-items:center;justify-content:center;
  padding:50px;
}
.photo{
  width:min(430px,100%);
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  border-radius:34px;
  padding:17px;
  box-shadow:0 35px 85px rgba(0,0,0,.32);
}
.photo img{
  width:100%;
  height:610px;
  object-fit:cover;
  object-position:center top;
  border-radius:26px;
  display:block;
}
.caption{text-align:center;color:white;padding:18px 8px 4px}
.caption h3{color:var(--gold);font-size:18px}
.caption p{color:#dbeafe;font-size:14px}

section{padding:86px 7vw}
.title{max-width:1120px;margin:0 auto 44px}
.title h2{
  font-size:clamp(34px,4vw,56px);
  font-weight:300;
  color:var(--navy);
  line-height:1.1;
  margin:10px 0 14px;
}
.title p{max-width:860px;color:var(--muted);font-size:17px}
.grid{max-width:1120px;margin:auto;display:grid;gap:22px}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
.four{grid-template-columns:repeat(4,1fr)}
.card,.metric{
  background:white;
  border:1px solid var(--line);
  border-radius:24px;
  padding:28px;
  box-shadow:0 18px 45px rgba(15,23,42,.06);
}
.card h3{color:var(--blue);font-size:21px;margin-bottom:10px;line-height:1.3}
.card p{color:#475569}
.metric{
  background:var(--navy);
  color:white;
  min-height:135px;
}
.metric strong{display:block;color:var(--gold);font-size:31px;margin-bottom:5px}

.dark{
  background:linear-gradient(135deg,#0B1D3A
