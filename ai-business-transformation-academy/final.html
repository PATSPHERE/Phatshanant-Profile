<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RELEARNOS | Final Review</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="site" src="./" title="RELEARNOS Final Review"></iframe>
<script>
const frame=document.getElementById('site');
const founderCopy={
  th:{
    label:'ผู้ก่อตั้ง RELEARNOS',
    title:'คนเติบโตได้ เมื่อการเรียนรู้เชื่อมโยงกับงานจริง เป็นมนุษย์ และรู้สึกว่าเป็นไปได้',
    body:'พัฌณ์นันณ์เชื่อมประสบการณ์ด้านงานบริการ การพัฒนาความสามารถ และการเปลี่ยนแปลงเชิงปฏิบัติ เพื่อออกแบบเส้นทางการเรียนรู้ที่ผู้เรียนสามารถนำกลับไปใช้กับงานจริงได้',
    name:'พัฌณ์นันณ์ ธนกิจพันธ์สกุล',
    role:'ผู้ก่อตั้ง · ผู้นำด้านการเรียนรู้และการเปลี่ยนแปลง'
  },
  en:{
    label:'Founder Spotlight',
    title:'People grow when learning feels relevant, human and possible.',
    body:'Phatshanant brings together service experience, capability development and practical transformation to create learning journeys people can carry into their work.',
    name:'Phatshanant Thanakitpunsakul',
    role:'Founder · Learning & Transformation Lead'
  }
};
function ensureFixStyle(d){
  if(d.getElementById('final-review-fixes')) return;
  const s=d.createElement('style');
  s.id='final-review-fixes';
  s.textContent=`
    #framework .display{word-break:keep-all!important;overflow-wrap:normal!important;hyphens:none!important;line-height:1.22!important}
    #framework .fw-term{display:inline-block;white-space:nowrap}
    #framework .fw-arrow{display:inline-block;white-space:nowrap;margin:0 .16em}
    .founder .ey,.founder [data-text="founderTitle"],.founder [data-text="founderBody"],.founder [data-text="founderRole"],.founder .foundername{word-break:normal!important;overflow-wrap:break-word!important}
    @media(max-width:620px){#framework .display{font-size:29px!important;line-height:1.32!important}.founder h2{font-size:32px!important;line-height:1.28!important}}
  `;
  d.head.appendChild(s);
}
function patchFramework(d){
  const h=d.querySelector('#framework .display');
  if(!h) return;
  h.innerHTML='<span class="fw-term">Diagnose</span><span class="fw-arrow">→</span><span class="fw-term">Learn</span><span class="fw-arrow">→</span><span class="fw-term">Re-Learn</span><span class="fw-arrow">→</span><span class="fw-term">Re-Act</span><span class="fw-arrow">→</span><span class="fw-term">Measure</span>';
}
function patchFounder(d){
  const lang=d.body?.getAttribute('data-lang')==='en'?'en':'th';
  const c=founderCopy[lang];
  const label=d.querySelector('.founder .ey');
  const title=d.querySelector('[data-text="founderTitle"]');
  const body=d.querySelector('[data-text="founderBody"]');
  const role=d.querySelector('[data-text="founderRole"]');
  const name=d.querySelector('.foundername');
  if(label) label.textContent=c.label;
  if(title) title.textContent=c.title;
  if(body) body.textContent=c.body;
  if(role) role.textContent=c.role;
  if(name){
    let textNode=[...name.childNodes].find(n=>n.nodeType===3);
    if(textNode) textNode.nodeValue=c.name;
  }
}
function applyFixes(){
  try{
    const d=frame.contentDocument;
    if(!d?.body) return;
    ensureFixStyle(d);
    patchFramework(d);
    patchFounder(d);
  }catch(e){}
}
frame.addEventListener('load',()=>{
  applyFixes();
  try{
    const d=frame.contentDocument;
    const observer=new MutationObserver(()=>setTimeout(applyFixes,20));
    observer.observe(d.body,{attributes:true,attributeFilter:['data-lang'],childList:true,subtree:true});
    d.addEventListener('click',()=>{setTimeout(applyFixes,20);setTimeout(applyFixes,120);},true);
    setInterval(applyFixes,500);
  }catch(e){}
});
</script>
</body>
</html>
