const expEN={heroH:'We start with the business challenge — then help people, work and technology move forward together.',heroP:'Every business starts from a different context. RELEARNOS begins by understanding the real work before designing the right capability, ways of working and use of AI for that environment.',appliedH:'Experience shaped by real business challenges',appliedP:'We do not begin with one formula for every organisation. We start with the work, readiness and business outcomes that matter in that context.',cases:[['From a central service to a model partners can use in real contexts','Designed and led the integration of a group Telemedicine service across different businesses and locations — from service model, customer journey and access flow to partner coordination and launch readiness.',['Health services embedded in the resident experience','Exclusive health benefits for customers','Service access for the school community','Connected access across locations'],'Designed the service model and partner integration so Telemedicine could plug into each partner’s existing service experience.'],['AI-assisted Real-time Service Improvement','Used AI to analyse front-line conditions and service delivery in real time, helping teams see what to replenish, adjust or improve quickly — across product readiness, service environment and store standards.',['See product availability and replenishment needs','See service-area readiness','Track front-line service standards','Use operational data for continuous service improvement'],'Reduce service gaps, protect brand standards and continuously improve customer experience.'],['AI-assisted Quality & Standards Design','Strengthened quality and operating standards by first making “quality” explicit — defining shared standards, process steps, evidence and decision points the team can use together.',['Turn principles and standards into shared criteria','Structure documents, data and evidence for review','Use AI to check complet function findByEy(d,text){return [...d.querySelectorAll('section')].find(s=>s.querySelector('.ey')?.textContent.trim().toUpperCase()===text.toUpperCase())}
function hideLegacyHomeSections(d){const start=findByEy(d,'CHOOSE YOUR STARTING POINT');if(start)start.classList.add('home-deemphasise');const diag=[...d.querySelectorAll('section')].find(s=>s.classList.contains('diagnostic')||s.querySelector('.diaghead'));if(diag)diag.classList.add('home-deemphasise');const about=d.querySelector('#about');if(about)about.classList.add('home-about-hide');const founder=d.querySelector('.founder');if(founder)founder.classList.add('home-about-hide');d.querySelector('#business-specific')?.classList.add('home-deemphasise');[...d.querySelectorAll('section')].forEach(x=>{if(x.querySelector('.ey')?.textContent.trim()==='Industries')x.classList.add('struct-hide-industries')})}
function buildSolutions(d,lang){let sec=d.querySelector('#solutions-review');const legacy=findByEy(d,'OUTCOMES THAT MATTER');if(!sec){sec=d.createElement('section');sec.id='solutions-review';if(legacy)legacy.before(sec);else d.querySelector('.hero')?.after(sec)}if(legacy)legacy.classList.add('home-deemphasise');const th=lang==='th';const data=th?[['Smarter Work','งานลื่นไหลขึ้น ลดงานซ้ำและขั้นตอนที่ไม่จำเป็น','work'],['Better Decisions','ตัดสินใจได้ชัดขึ้นจากข้อมูล บริบท และวิจารณญาณที่ดีขึ้น','measure'],['Better Service','ยกระดับคุณภาพบริการและความเชื่อมั่นของลูกค้า','service'],['Future-ready People','คนเรียนรู้ ปรับตัว และทำงานร่วมกับ AI ได้อย่างมีความหมาย','people']]:[['Smarter Work','Reduce friction, repetition and unnecessary work.','work'],['Better Decisions','Strengthen judgement with clearer information and context.','measure'],['Better Service','Improve service quality and customer confidence.','service'],['Future-ready People','Build people who can learn, adapt and work meaningfully with AI.','people']];sec.innerHTML=`<div class="wrap"><div class="solutions-head"><p class="ey">${th?'OUTCOMES THAT MATTER':'OUTCOMES THAT MATTER'}</p><h2>${th?'คุณอยากเห็นอะไรเปลี่ยนไปในองค์กร?':'What do you want to change?'}</h2><p>${th?'เริ่มจากผลลัพธ์ที่องค์กรต้องการ แล้วค่อยเชื่อมไปสู่แนวทางพัฒนา โปรแกรม และประสบการณ์ที่เกี่ยวข้อง':'Start with the outcome your organisation needs, then connect it to the right development path, programme and relevant experience.'}</p></div><div class="solution-grid">${data.map((x,i)=>`<article class="solution-card"><div class="solution-top"><div class="solution-icon">${icons[x[2]]}</div><span class="solution-num">0${i+1}</span></div><h3>${x[0]}</h3><p>${x[1]}</p><span class="solution-link">${th?'ดูแนวทางและเคสที่เกี่ยวข้อง →':'Explore related approach & cases →'}</span></article>`).join('')}</div></div>`;return sec}
function patchFramework(d,lang){const fw=d.querySelector('#framework');if(!fw)return;const e=fw.querySelector('.head .ey');if(e)e.textContent='RELEARNOS Framework';const t=fw.querySelector('.head .display');if(t)t.textContent=lang==='th'?'จากจุดเริ่มต้น สู่การเปลี่ยนแปลงที่วัดผลได้':'From the right starting point to measurable change';['Diagnose','Learn','Re-Learn','Re-Act','Measure'].forEach((name,i)=>{const x=fw.querySelectorAll('.step')[i];if(x){const h=x.querySelector('h3'),n=x.querySelector('.num');if(h)h.textContent=name;if(n)n.textContent=String(i+1).padStart(2,'0')}});let note=fw.querySelector('.framework-snapshot-note');if(!note){note=d.createElement('p');note.className='framework-snapshot-note';fw.querySelector('.wrap')?.appendChild(note)}note.textContent=lang==='th'?'Framework เดียวของ RELEARNOS — ใช้พัฒนาคน งาน บริการ และการใช้เทคโนโลยีให้เชื่อมกับงานจริง':'One RELEARNOS Framework — connecting people, work, service and technology to real work.'}
function patchPrograms(d,lang){const p=d.querySelector('#programs');if(!p)return;let b=p.querySelector('.mp-principle');if(!b){b=d.createElement('div');b.className='mp-principle';p.querySelector('.pricingnote')?.before(b)}b.innerHTML=lang==='th'?'<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>แกนการเรียนรู้ร่วมกัน เชื่อมกับโจทย์ งานจริง และบริบทของแต่ละธุรกิจบริการ</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>':'<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>A shared learning core, adapted to the real work, challenges and context of each service business.</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>'}
function patchNav(d,lang,solutions){const links=[...d.querySelectorAll('.nav .links a')];if(!links.length)return;const th=lang==='th';const map=[['Solutions',solutions?`#${solutions.id}`:'#solutions-review'],[th?'โปรแกรม':'Programmes','#programs'],[th?'วิธีที่ RELEARNOS ทำงาน':'How RELEARNOS Works','#framework'],[th?'ประสบการณ์':'Experience','insights/'],[th?'เกี่ยวกับ RELEARNOS':'About RELEARNOS','#about'],[th?'ติดต่อ':'Contact','#contact']];links.forEach((a,i)=>{if(!map[i])return;a.textContent=map[i][0];a.setAttribute('href',map[i][1])});const aboutLink=links[4];if(aboutLink){aboutLink.classList.add('redteam-about-link');aboutLink.onclick=e=>{e.preventDefault();const about=d.querySelector('#about'),founder=d.querySelector('.founder');about?.classList.remove('home-about-hide');founder?.classList.remove('home-about-hide');about?.scrollIntoView({behavior:'smooth'})}}}
function reorderHome(d,solutions){const hero=d.querySelector('.hero'),fw=d.querySelector('#framework'),programs=d.querySelector('#programs'),clients=d.querySelector('.client-experience');if(!hero||!solutions)return;hero.after(solutions);if(fw)solutions.after(fw);if(programs)(fw||solutions).after(programs);if(clients)(programs||fw||solutions).after(clients)}
function patchMain(d){ensureMainCss(d);const lang=d.body.getAttribute('data-lang')==='en'?'en':'th';localStorage.setItem('relearnosLang',lang);hideLegacyHomeSections(d);const solutions=buildSolutions(d,lang);patchFramework(d,lang);patchPrograms(d,lang);reorderHome(d,solutions);patchNav(d,lang,solutions)}
function ensureExpCss(d){if(d.getElementById('experience-review-css'))return;const s=d.createElement('style');s.id='experience-review-css';s.textContent=`.expTools{display:flex;align-items:center;gap:10px;margin-left:auto}.expBack{font-size:13px;font-weight:700;color:#104886;white-space:nowrap}.expLang{display:flex;border:1px solid #d7e6da;border-radius:999px;overflow:hidden;background:#fff}.expLang button{border:0;background:transparent;padding:7px 10px;font:600 12px inherit;color:#607083;cursor:pointer}.expLang button.active{background:#104886;color:#fff}.keep-thai{display:inline-block;white-space:nowrap!important}.exp-concept-hide{display:none!important}@media(max-width:620px){.navlinks{display:none!important}}`;d.head.appendChild(s)}
function saveThai(d){if(d.body.dataset.expSaved)return;d.body.dataset.expSaved='1';d.querySelectorAll('h1,h2,h3,p,.iconItem,.outcome,.principle,.quote,.bigline,.navlinks a,.nav .primary,.qrBlock small').forEach(el=>el.dataset.th=el.innerHTML)}function restoreThai(d){d.querySelectorAll('[data-th]').forEach(el=>el.innerHTML=el.dataset.th)}function setTxt(el,html){if(el)el.innerHTML=html}function patchBiotech(d){const card=[...d.querySelectorAll('.caseCard')].find(x=>x.querySelector('.caseNumber')?.textContent.includes('04 · BIOTECH'));if(!card)return;const title=card.querySelector('h3');if(title)title.innerHTML='จากบริษัทที่มีเทคโนโลยี สู่โครงสร้างธุรกิจที่<span class="keep-thai">พร้อมต่อยอด</span>'}
function applyExperienceLang(d,lang){saveThai(d);if(lang==='th'){restoreThai(d);patchBiotech(d)}else{const hero=d.querySelector('.experienceHero');setTxt(hero?.querySelector('h1'),expEN.heroH);setTxt(hero?.querySelector('.lead'),expEN.heroP);const applied=d.querySelector('#applied');setTxt(applied?.querySelector('.display'),expEN.appliedH);setTxt(applied?.querySelector('.head>p'),expEN.appliedP);[...applied?.querySelectorAll('.caseCard')||[]].forEach((card,i)=>{const c=expEN.cases[i];if(!c)return;setTxt(card.querySelector('h3'),c[0]);setTxt(card.querySelector('.caseContent>p'),c[1]);[...card.querySelectorAll('.iconItem')].forEach((x,j)=>{const b=x.querySelector('b')?.outerHTML||'';x.innerHTML=b+c[2][j]});setTxt(card.querySelector('.outcome'),c[3])});const cur=d.querySelector('#current');setTxt(cur?.querySelector('.currentPanel>div>p:not(.ey)'),expEN.currentP);const partners=d.querySelector('#partners');setTxt(partners?.querySelector('.display'),expEN.partnersH);setTxt(partners?.querySelector('.head>p'),expEN.partnersP);const line=d.querySelector('.lineCta');setTxt(line?.querySelector('h2'),expEN.ctaH);setTxt(line?.querySelector('p'),expEN.ctaP)}d.documentElement.lang=lang;d.body.dataset.expLang=lang;localStorage.setItem('relearnosLang',lang);d.querySelectorAll('.expLang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));const back=d.querySelector('.expBack');if(back)back.textContent=lang==='th'?'← กลับ RELEARNOS':'← RELEARNOS'}
function patchExperience(d){ensureExpCss(d);[...d.querySelectorAll('section')].forEach(s=>{const ey=s.querySelector('.ey')?.textContent.trim();if(['What We Build','What Remains','The RELEARNOS View'].includes(ey))s.classList.add('exp-concept-hide')});const nav=d.querySelector('.navin');if(nav&&!d.querySelector('.expTools')){const tools=d.createElement('div');tools.className='expTools';tools.innerHTML='<a class="expBack" href="../">← กลับ RELEARNOS</a><div class="expLang"><button type="button" data-lang="th">TH</button><button type="button" data-lang="en">EN</button></div>';nav.appendChild(tools);tools.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>applyExperienceLang(d,b.dataset.lang)))}applyExperienceLang(d,localStorage.getItem('relearnosLang')==='en'?'en':'th')}
function apply(){try{const d=f.contentDocument;if(!d?.body)return;const path=f.contentWindow.location.pathname||'';if(path.includes('/insights'))patchExperience(d);else patchMain(d)}catch(e){}}f.addEventListener('load',()=>{apply();try{const d=f.contentDocument;const obs=new MutationObserver(m=>{if(m.some(x=>x.type==='attributes'&&x.attributeName==='data-lang'))requestAnimationFrame(apply)});obs.observe(d.body,{attributes:true,attributeFilter:['data-lang']})}catch(e){}});
