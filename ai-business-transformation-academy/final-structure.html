<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RELEARNOS | Structural Review</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0;background:#fff}</style></head><body><iframe id="site" src="./" title="RELEARNOS Structural Review"></iframe><script>

const icons={diagnose:`<svg viewBox="0 0 48 48"><circle cx="21" cy="21" r="11"/><path d="M29 29l9 9"/><path d="M16 21h10M21 16v10"/></svg>`,learn:`<svg viewBox="0 0 48 48"><path d="M7 11c8-2 13 0 17 4v25c-4-4-9-6-17-4z"/><path d="M41 11c-8-2-13 0-17 4v25c4-4 9-6 17-4z"/></svg>`,relearn:`<svg viewBox="0 0 48 48"><path d="M35 14a15 15 0 10 3 18"/><path d="M35 7v9h-9"/><path d="M13 34v-9h9"/></svg>`,react:`<svg viewBox="0 0 48 48"><path d="M6 24L42 7 31 41l-8-12z"/><path d="M23 29L42 7"/></svg>`,measure:`<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="16"/><circle cx="24" cy="24" r="9"/><circle cx="24" cy="24" r="3"/><path d="M27 21l12-12M34 9h5v5"/></svg>`,people:`<svg viewBox="0 0 48 48"><circle cx="19" cy="17" r="7"/><path d="M6 39c1-9 6-13 13-13s12 4 13 13"/><circle cx="34" cy="19" r="5"/><path d="M31 28c6 0 10 4 11 10"/></svg>`,work:`<svg viewBox="0 0 48 48"><rect x="6" y="14" width="36" height="25" rx="2"/><path d="M18 14v-4h12v4M6 24h36M21 24v3h6v-3"/></svg>`,service:`<svg viewBox="0 0 48 48"><path d="M24 39S8 30 8 18c0-6 7-9 11-5l5 5 5-5c4-4 11-1 11 5 0 12-16 21-16 21z"/><path d="M8 36h10M30 36h10"/></svg>`,ai:`<svg viewBox="0 0 48 48"><rect x="11" y="11" width="26" height="26" rx="8"/><circle cx="19" cy="21" r="2"/><circle cx="29" cy="21" r="2"/><path d="M18 29c4 3 8 3 12 0M24 5v6M24 37v6M5 24h6M37 24h6"/></svg>`};
const expEN={heroH:'We start with the business challenge — then help people, work and technology move forward together.',heroP:'Every business starts from a different context. RELEARNOS begins by understanding the real work before designing the right capability, ways of working and use of AI for that environment.',appliedH:'Experience shaped by real business challenges',appliedP:'We do not begin with one formula for every organisation. We start with the work, readiness and business outcomes that matter in that context.',cases:[['From a central service to a model partners can use in real contexts','Designed and led the integration of a group Telemedicine service across different businesses and locations — from service model, customer journey and access flow to partner coordination and launch readiness.',['Health services embedded in the resident experience','Exclusive health benefits for customers','Service access for the school community','Connected access across locations'],'Designed the service model and partner integration so Telemedicine could plug into each partner’s existing service experience.'],['AI-assisted Real-time Service Improvement','Used AI to analyse front-line conditions and service delivery in real time, helping teams see what to replenish, adjust or improve quickly — across product readiness, service environment and store standards.',['See product availability and replenishment needs','See service-area readiness','Track front-line service standards','Use operational data for continuous service improvement'],'Reduce service gaps, protect brand standards and continuously improve customer experience.'],['AI-assisted Quality & Standards Design','Strengthened quality and operating standards by first making “quality” explicit — defining shared standards, process steps, evidence and decision points the team can use together.',['Turn principles and standards into shared criteria','Structure documents, data and evidence for review','Use AI to check completeness and surface issues','Feed insights back into workflows, standards and team practice'],'Turn quality work into a learning system that helps the organisation maintain standards and continuously improve how work gets done.'],['From a technology-led company to a business structure built to scale','Worked with an established biotech business to structure operations, define its position in the value chain and connect commercial growth with research, partnerships and IP.',['Define the organisation’s role in the business value chain','Structure operations for scalable growth','Connect international collaboration and research','Prepare IP and products for commercialisation'],'Connect Science, Product, Partnership, IP and Commercialisation into one coherent growth picture.']],currentP:'From incoming documents to close-ready information: designing a workflow for teams managing multiple clients and tracking document readiness each month.',currentItems:['Receive and track monthly documents','Classify documents by relevant transaction','Extract key information for professional review','Identify missing items early, before close'],currentPrinciple:'RELEARNOS helps design the data-analysis framework and AI-assisted workflow around the accounting practice’s own principles.<br><br>AI helps structure information and flag items for review. Accountants remain responsible for interpretation, decisions and accuracy.',partnersH:'When good technology has to reach the market — and real users',partnersP:'RELEARNOS develops people, communication and organisational readiness, while Technology Partners build automation and technical solutions for real-world use.',partnerDesc:['Turn Digital Service Expertise into business value that can be communicated to a broader market.','Turn systems expertise into a stronger service experience and greater customer confidence.','Connect customer challenges to systems designed for real-world adoption.'],viewH:'Businesses do not change because they have a new tool.<br>They change when people work differently.',viewP:'AI creates value when it helps people understand the work, see information together and improve outcomes that matter to the business.',view3:'We do not start with “Which AI tool should we use?”',viewBody:'We start by understanding where the business is trying to go, what people need to do better, and which ways of working are getting in the way. Then we design learning, work and technology as one connected system.',viewBig:'Good tools make work faster. Shared understanding helps the organisation move forward.',ctaH:'Have a business challenge you want to make real progress on?',ctaP:'Start with the business context, then design the right starting point for your team and goals.'};
function ensureMainCss(d){if(d.getElementById('stable-structure-css'))return;const s=d.createElement('style');s.id='stable-structure-css';s.textContent=`#business-specific{display:none!important}.struct-hide-industries{display:none!important}#programs .mp-principle{margin:30px 0 0;padding:28px 30px;border:1px solid #cfe5d4;background:linear-gradient(135deg,#fbfdf8,#eef6fb);box-shadow:0 14px 36px rgba(16,72,134,.07)}#programs .mp-principle-ey{margin:0 0 8px;color:#20a653;font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}#programs .mp-principle h3{margin:0;color:#104886;font-size:28px;line-height:1.18}#programs .mp-principle p{margin:10px 0 18px;color:#607083;font-size:15px}#programs .mp-contexts{display:flex;flex-wrap:wrap;gap:8px}#programs .mp-contexts span{padding:6px 11px;border:1px solid #bde4c6;background:#fff;color:#123b67;font-size:12px;font-weight:600}#framework{position:relative;overflow:hidden;padding:96px 0!important;background:radial-gradient(circle at 18% 12%,rgba(23,110,184,.48),transparent 34%),radial-gradient(circle at 82% 78%,rgba(32,166,83,.24),transparent 32%),linear-gradient(135deg,#0d315c,#104886 48%,#0b3151)!important}#framework .head{display:block!important;text-align:center;margin:0 auto 52px!important;max-width:900px}#framework .head .ey{color:#9ce4b4!important;margin-bottom:14px!important}#framework .head .display{font-size:clamp(38px,5.2vw,66px)!important;line-height:1.05!important;color:#fff!important;letter-spacing:-.02em!important}#framework .head>p{display:none!important}#framework .timeline{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:12px!important;border:0!important;overflow:visible!important}#framework .step{position:relative;min-height:184px!important;padding:24px 16px!important;border:1px solid rgba(255,255,255,.22)!important;background:rgba(255,255,255,.07)!important;display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.14)}#framework .step:nth-child(1),#framework .step:nth-child(5){background:rgba(32,166,83,.13)!important}#framework .step:nth-child(3){background:rgba(255,255,255,.13)!important;transform:translateY(-10px)}#framework .step .num{margin:0 0 14px!important;display:grid;place-items:center;width:42px;height:42px;border:1px solid #9ce4b4;border-radius:50%;color:#b9f4c8!important}#framework .step h3{margin:0!important;color:#fff!important;font-size:clamp(18px,1.8vw,25px)!important;white-space:nowrap}#framework .step p{display:none!important}#framework .step:not(:last-child):after{content:'→';position:absolute;right:-17px;top:50%;transform:translateY(-50%);font-size:22px;color:#b9f4c8;font-weight:700;z-index:3}#about .aboutgrid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:22px!important;align-items:stretch!important}#about .aboutcard{display:block!important;min-height:390px!important;padding:32px!important;border:1px solid #dce5df!important;background:#fff!important;box-shadow:0 18px 42px rgba(16,72,134,.08)!important}#about .aboutcard h3{margin:0 0 10px!important;font-size:25px!important;line-height:1.25!important;color:#104886!important}#about .aboutcard p{margin:0 0 28px!important;color:#607083!important}.about-iconflow{display:grid;align-items:start;margin-top:20px}.framework-card .about-iconflow{grid-template-columns:repeat(5,1fr);gap:8px}.bridge-card .about-iconflow{grid-template-columns:repeat(4,1fr);gap:14px}.about-node{position:relative;text-align:center;min-width:0}.about-icon{width:76px;height:76px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:#f1f6ff;border:1px solid #d6e2f2;color:#104886;box-shadow:0 10px 22px rgba(16,72,134,.08)}.about-node:nth-child(3) .about-icon{background:#eaf8f5;border-color:#ccebe4}.about-node:nth-child(4) .about-icon{background:#fff4dc;border-color:#f0dfb8;color:#9c701b}.about-node:nth-child(5) .about-icon{background:#104886;color:#fff;border-color:#104886}.bridge-card .about-node:nth-child(1) .about-icon{background:#104886;color:#fff;border-color:#104886}.bridge-card .about-node:nth-child(2) .about-icon{background:#eaf3f8;color:#17658b}.bridge-card .about-node:nth-child(3) .about-icon{background:#fff4dc;color:#9c701b;border-color:#f0dfb8}.bridge-card .about-node:nth-child(4) .about-icon{background:#f1edfb;color:#6653a2;border-color:#ddd4f2}.about-icon svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.about-node b{display:block;color:#104886;font-size:13px;line-height:1.2}.about-node small{display:block;margin-top:5px;color:#77879a;font-size:10px;line-height:1.35}.framework-card .about-node:not(:last-child):after{content:'→';position:absolute;top:28px;right:-10px;color:#7f98b4;font-size:17px;font-weight:700}.aboutcard .aboutpillars{display:none!important}.founder{background:#fff!important}.founder .foundergrid{border:1px solid #d7e6da!important;background:linear-gradient(110deg,#fff 0%,#fffdf7 100%)!important;box-shadow:0 20px 54px rgba(16,72,134,.10)!important;overflow:hidden!important;align-items:stretch!important}.founder .founderphoto{min-height:430px!important}.founder .founderphoto img{width:100%!important;height:100%!important;min-height:430px!important;object-fit:cover!important;object-position:center top!important}.founder .foundergrid>div:first-child{padding:44px!important}.founder .ey{color:#b18431!important}.founder h2{font-size:clamp(30px,3.4vw,46px)!important;line-height:1.14!important}@media(max-width:900px){#framework .timeline{grid-template-columns:1fr!important;gap:10px!important}#framework .step{min-height:94px!important;flex-direction:row;justify-content:flex-start;gap:16px;text-align:left}#framework .step:nth-child(3){transform:none}#framework .step h3{white-space:normal}#framework .step:not(:last-child):after{display:none}#about .aboutgrid{grid-template-columns:1fr!important}}@media(max-width:620px){.framework-card .about-iconflow,.bridge-card .about-iconflow{grid-template-columns:repeat(2,1fr)!important;gap:22px 12px}.framework-card .about-node:not(:last-child):after{display:none}}`;d.head.appendChild(s)}
function ensureExpCss(d){if(d.getElementById('experience-review-css'))return;const s=d.createElement('style');s.id='experience-review-css';s.textContent=`.expTools{display:flex;align-items:center;gap:10px;margin-left:auto}.expBack{font-size:13px;font-weight:700;color:#104886;white-space:nowrap}.expLang{display:flex;border:1px solid #d7e6da;border-radius:999px;overflow:hidden;background:#fff}.expLang button{border:0;background:transparent;padding:7px 10px;font:600 12px inherit;color:#607083;cursor:pointer}.expLang button.active{background:#104886;color:#fff}.keep-thai{display:inline-block;white-space:nowrap!important}@media(max-width:620px){.expTools{gap:6px}.expBack{font-size:12px}.expLang button{padding:6px 8px}.navlinks{display:none!important}}`;d.head.appendChild(s)}
function patchAbout(d,lang){const about=d.querySelector('#about');if(!about)return;const cards=[...about.querySelectorAll('.aboutcard')];const L=lang==='th'?{d:['Diagnose','เข้าใจจุดเริ่มต้น'],l:['Learn','เรียนรู้'],r:['Re-Learn','ปรับมุมมอง'],a:['Re-Act','ลงมือกับงานจริง'],m:['Measure','วัดการเปลี่ยนแปลง'],p:['People','ศักยภาพของคน'],w:['Work','วิธีทำงาน'],s:['Service','คุณค่าบริการ'],ai:['AI','เสริมการตัดสินใจ']}:{d:['Diagnose','Starting point'],l:['Learn','Build capability'],r:['Re-Learn','Reflect & redesign'],a:['Re-Act','Apply to work'],m:['Measure','Track change'],p:['People','Human capability'],w:['Work','Ways of working'],s:['Service','Service value'],ai:['AI','Intelligent tools']};[[cards[0],'framework-card',[['diagnose',L.d],['learn',L.l],['relearn',L.r],['react',L.a],['measure',L.m]]],[cards[1],'bridge-card',[['people',L.p],['work',L.w],['service',L.s],['ai',L.ai]]]].forEach(([card,cls,data])=>{if(!card)return;card.classList.add(cls);let v=card.querySelector('.about-iconflow');if(!v){v=d.createElement('div');v.className='about-iconflow';card.appendChild(v)}if(v.dataset.lang!==lang){v.innerHTML=data.map(([k,x])=>`<div class="about-node"><div class="about-icon">${icons[k]}</div><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');v.dataset.lang=lang}})}
function patchMain(d){ensureMainCss(d);const lang=d.body.getAttribute('data-lang')==='en'?'en':'th';localStorage.setItem('relearnosLang',lang);const p=d.querySelector('#programs');if(p){let b=p.querySelector('.mp-principle');if(!b){b=d.createElement('div');b.className='mp-principle';p.querySelector('.pricingnote')?.before(b)}if(b.dataset.lang!==lang){b.innerHTML=lang==='th'?'<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>แกนการเรียนรู้ร่วมกัน เชื่อมกับโจทย์ งานจริง และบริบทของแต่ละธุรกิจบริการ</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>':'<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>A shared learning core, adapted to the real work, challenges and context of each service business.</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>';b.dataset.lang=lang}}d.querySelector('#business-specific')?.style.setProperty('display','none');[...d.querySelectorAll('section')].forEach(x=>{if(x.querySelector('.ey')?.textContent.trim()==='Industries')x.classList.add('struct-hide-industries')});const fw=d.querySelector('#framework');if(fw){const e=fw.querySelector('.head .ey');if(e)e.textContent='RELEARNOS Framework';const t=fw.querySelector('.head .display'),target=lang==='th'?'จากการมองเห็นจุดเริ่มต้น สู่การเปลี่ยนแปลงที่วัดผลได้':'From the right starting point to measurable change';if(t&&t.textContent!==target)t.textContent=target;['Diagnose','Learn','Re-Learn','Re-Act','Measure'].forEach((name,i)=>{const x=fw.querySelectorAll('.step')[i];if(x){const h=x.querySelector('h3'),n=x.querySelector('.num');if(h)h.textContent=name;if(n)n.textContent=String(i+1).padStart(2,'0')}})}patchAbout(d,lang)}
function saveThai(d){if(d.body.dataset.expSaved)return;d.body.dataset.expSaved='1';d.querySelectorAll('h1,h2,h3,p,.iconItem,.outcome,.principle,.quote,.bigline,.navlinks a,.nav .primary,.qrBlock small').forEach(el=>el.dataset.th=el.innerHTML)}
function restoreThai(d){d.querySelectorAll('[data-th]').forEach(el=>el.innerHTML=el.dataset.th)}
function setTxt(el,html){if(el)el.innerHTML=html}
function patchBiotech(d){const card=[...d.querySelectorAll('.caseCard')].find(x=>x.querySelector('.caseNumber')?.textContent.includes('04 · BIOTECH'));if(!card)return;const title=card.querySelector('h3');if(title)title.innerHTML='จากบริษัทที่มีเทคโนโลยี สู่โครงสร้างธุรกิจที่<span class="keep-thai">พร้อมต่อยอด</span>';const operating=[...card.querySelectorAll('.iconItem')].find(x=>x.textContent.includes('Operating Structure'));if(operating){const b=operating.querySelector('b');if(b)operating.innerHTML=b.outerHTML+'จัดรูปแบบการดำเนินงานให้<span class="keep-thai">พร้อมต่อยอด</span>ธุรกิจ'}}
function applyExperienceLang(d,lang){saveThai(d);if(lang==='th'){restoreThai(d);patchBiotech(d)}else{const hero=d.querySelector('.experienceHero');setTxt(hero?.querySelector('h1'),expEN.heroH);setTxt(hero?.querySelector('.lead'),expEN.heroP);const applied=d.querySelector('#applied');setTxt(applied?.querySelector('.display'),expEN.appliedH);setTxt(applied?.querySelector('.head>p'),expEN.appliedP);[...applied?.querySelectorAll('.caseCard')||[]].forEach((card,i)=>{const c=expEN.cases[i];if(!c)return;setTxt(card.querySelector('h3'),c[0]);setTxt(card.querySelector('.caseContent>p'),c[1]);[...card.querySelectorAll('.iconItem')].forEach((x,j)=>{const b=x.querySelector('b')?.outerHTML||'';x.innerHTML=b+c[2][j]});setTxt(card.querySelector('.outcome'),c[3])});const cur=d.querySelector('#current');setTxt(cur?.querySelector('.currentPanel>div>p:not(.ey)'),expEN.currentP);[...cur?.querySelectorAll('.iconItem')||[]].forEach((x,j)=>{const b=x.querySelector('b')?.outerHTML||'';x.innerHTML=b+expEN.currentItems[j]});setTxt(cur?.querySelector('.principle'),expEN.currentPrinciple);const partners=d.querySelector('#partners');setTxt(partners?.querySelector('.display'),expEN.partnersH);setTxt(partners?.querySelector('.head>p'),expEN.partnersP);[...partners?.querySelectorAll('.partnerCard>p:not(.ey)')||[]].forEach((x,i)=>setTxt(x,expEN.partnerDesc[i]));const view=d.querySelector('#relearn-view');setTxt(view?.querySelector('.display'),expEN.viewH);setTxt(view?.querySelector('.head>p'),expEN.viewP);setTxt(view?.querySelector('.heroInsight h3'),expEN.view3);setTxt(view?.querySelector('.heroInsightMain>p'),expEN.viewBody);setTxt(view?.querySelector('.bigline'),expEN.viewBig);const line=d.querySelector('.lineCta');setTxt(line?.querySelector('h2'),expEN.ctaH);setTxt(line?.querySelector('p'),expEN.ctaP);setTxt(line?.querySelector('.btn'),'Discuss your business challenge on LINE OA →');setTxt(line?.querySelector('.qrBlock small'),'On desktop? Scan to add LINE OA.')}d.documentElement.lang=lang;d.body.dataset.expLang=lang;localStorage.setItem('relearnosLang',lang);d.querySelectorAll('.expLang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));const back=d.querySelector('.expBack');if(back)back.textContent=lang==='th'?'← กลับ RELEARNOS':'← RELEARNOS';const cta=d.querySelector('.nav .primary');if(cta)cta.textContent=lang==='th'?'คุยโจทย์ธุรกิจ':'Discuss a business challenge'}
function patchExperience(d){ensureExpCss(d);const nav=d.querySelector('.navin');if(nav&&!d.querySelector('.expTools')){const tools=d.createElement('div');tools.className='expTools';tools.innerHTML='<a class="expBack" href="../">← กลับ RELEARNOS</a><div class="expLang"><button type="button" data-lang="th">TH</button><button type="button" data-lang="en">EN</button></div>';nav.appendChild(tools);tools.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>applyExperienceLang(d,b.dataset.lang)))}applyExperienceLang(d,localStorage.getItem('relearnosLang')==='en'?'en':'th')}
function apply(){try{const d=f.contentDocument;if(!d?.body)return;const path=f.contentWindow.location.pathname||'';if(path.includes('/insights'))patchExperience(d);else patchMain(d)}catch(e){}}
f.addEventListener('load',()=>{apply();try{const d=f.contentDocument;const obs=new MutationObserver(m=>{if(m.some(x=>x.type==='attributes'&&x.attributeName==='data-lang'))requestAnimationFrame(apply)});obs.observe(d.body,{attributes:true,attributeFilter:['data-lang']})}catch(e){}});
</script></body></html>
