<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RELEARNOS | Structural Review</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0;background:#fff}</style></head><body><iframe id="site" src="./" title="RELEARNOS Structural Review"></iframe><script>

const expEN={heroH:'We start with the business challenge — then help people, work and technology move forward together.',heroP:'Every business starts from a different context. RELEARNOS begins by understanding the real work before designing the right capability, ways of working and use of AI for that environment.',appliedH:'Experience shaped by real business challenges',appliedP:'We do not begin with one formula for every organisation. We start with the work, readiness and business outcomes that matter in that context.',cases:[['From a central service to a model partners can use in real contexts','Designed and led the integration of a group Telemedicine service across different businesses and locations — from service model, customer journey and access flow to partner coordination and launch readiness.',['Health services embedded in the resident experience','Exclusive health benefits for customers','Service access for the school community','Connected access across locations'],'Designed the service model and partner integration so Telemedicine could plug into each partner’s existing service experience.'],['AI-assisted Real-time Service Improvement','Used AI to analyse front-line conditions and service delivery in real time, helping teams see what to replenish, adjust or improve quickly — across product readiness, service environment and store standards.',['See product availability and replenishment needs','See service-area readiness','Track front-line service standards','Use operational data for continuous service improvement'],'Reduce service gaps, protect brand standards and continuously improve customer experience.'],['AI-assisted Quality & Standards Design','Strengthened quality and operating standards by first making “quality” explicit — defining shared standards, process steps, evidence and decision points the team can use together.',['Turn principles and standards into shared criteria','Structure documents, data and evidence for review','Use AI to check completeness and surface issues','Feed insights back into workflows, standards and team practice'],'Turn quality work into a learning system that helps the organisation maintain standards and continuously improve how work gets done.'],['From a technology-led company to a business structure built to scale','Worked with an established biotech business to structure operations, define its position in the value chain and connect commercial growth with research, partnerships and IP.',['Define the organisation’s role in the business value chain','Structure operations for scalable growth','Connect international collaboration and research','Prepare IP and products for commercialisation'],'Connect Science, Product, Partnership, IP and Commercialisation into one coherent growth picture.']],currentP:'From incoming documents to close-ready information: designing a workflow for teams managing multiple clients and tracking document readiness each month.',currentItems:['Receive and track monthly documents','Classify documents by relevant transaction','Extract key information for professional review','Identify missing items early, before close'],currentPrinciple:'RELEARNOS helps design the data-analysis framework and AI-assisted workflow around the accounting practice’s own principles.<br><br>AI helps structure information and flag items for review. Accountants remain responsible for interpretation, decisions and accuracy.',partnersH:'When good technology has to reach the market — and real users',partnersP:'RELEARNOS develops people, communication and organisational readiness, while Technology Partners build automation and technical solutions for real-world use.',partnerDesc:['Turn Digital Service Expertise into business value that can be communicated to a broader market.','Turn systems expertise into a stronger service experience and greater customer confidence.','Connect customer challenges to systems designed for real-world adoption.'],ctaH:'Have a business challenge you want to make real progress on?',ctaP:'Start with the business context, then design the right starting point for your team and goals.'};
function ensureMainCss(d){if(d.getElementById('stable-structure-css'))return;const s=d.createElement('style');s.id='stable-structure-css';s.textContent=`#business-specific{display:none!important}.struct-hide-industries{display:none!important}.hero{position:relative!important;background:#104886!important;overflow:hidden!important}.hero .heroin{position:relative!important;width:100%!important;max-width:none!important;min-height:650px!important;display:grid!important;grid-template-columns:minmax(0,56%) 1fr!important;gap:0!important;padding:0!important}.hero .heroin>div:first-child{position:relative!important;z-index:3!important;display:flex!important;flex-direction:column!important;justify-content:center!important;min-height:650px!important;padding:72px max(44px,calc((100vw - 1180px)/2))!important;padding-right:9vw!important;background:linear-gradient(90deg,rgba(16,72,134,.99) 0%,rgba(16,72,134,.96) 72%,rgba(16,72,134,.80) 88%,rgba(16,72,134,.30) 100%)!important;border-radius:0 210px 210px 0!important}.hero .herovisual{position:absolute!important;z-index:1!important;inset:0!important;width:100%!important;height:100%!important;min-height:650px!important;border:0!important;box-shadow:none!important;background-size:cover!important;background-position:center!important}.hero .herovisual:after{background:linear-gradient(90deg,rgba(16,72,134,.20),rgba(16,72,134,.02) 62%,rgba(16,72,134,.04))!important}.hero h1{color:#fff!important;max-width:760px!important;font-size:clamp(44px,5vw,68px)!important}.hero .lead{color:rgba(255,255,255,.88)!important}.hero .ey{color:#b9f4c8!important}.heroanswer{color:#fff!important}.heroanswer:before{background:rgba(255,255,255,.10)!important;color:#b9f4c8!important;border-color:rgba(255,255,255,.34)!important}.herochip{background:rgba(255,255,255,.10)!important;color:#fff!important;border-color:rgba(255,255,255,.30)!important}.hero .secondary{color:#fff!important;border-color:rgba(255,255,255,.55)!important}.visualcaption{display:none!important}#programs .mp-principle{margin:30px 0 0;padding:28px 30px;border:1px solid #cfe5d4;background:linear-gradient(135deg,#fbfdf8,#eef6fb);box-shadow:0 14px 36px rgba(16,72,134,.07)}#programs .mp-principle-ey{margin:0 0 8px;color:#20a653;font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}#programs .mp-principle h3{margin:0;color:#104886;font-size:28px;line-height:1.18}#programs .mp-principle p{margin:10px 0 18px;color:#607083;font-size:15px}#programs .mp-contexts{display:flex;flex-wrap:wrap;gap:8px}#programs .mp-contexts span{padding:6px 11px;border:1px solid #bde4c6;background:#fff;color:#123b67;font-size:12px;font-weight:600}#framework{position:relative;overflow:hidden;padding:96px 0!important;background:radial-gradient(circle at 18% 12%,rgba(23,110,184,.48),transparent 34%),radial-gradient(circle at 82% 78%,rgba(32,166,83,.24),transparent 32%),linear-gradient(135deg,#0d315c,#104886 48%,#0b3151)!important}#framework .head{display:block!important;text-align:center;margin:0 auto 52px!important;max-width:900px}#framework .head .ey{color:#9ce4b4!important;margin-bottom:14px!important}#framework .head .display{font-size:clamp(38px,5.2vw,66px)!important;line-height:1.05!important;color:#fff!important}#framework .head>p{display:none!important}#framework .timeline{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:12px!important;border:0!important;overflow:visible!important}#framework .step{position:relative;min-height:184px!important;padding:24px 16px!important;border:1px solid rgba(255,255,255,.22)!important;background:rgba(255,255,255,.07)!important;display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.14)}#framework .step:nth-child(3){background:rgba(255,255,255,.13)!important;transform:translateY(-10px)}#framework .step .num{margin:0 0 14px!important;display:grid;place-items:center;width:42px;height:42px;border:1px solid #9ce4b4;border-radius:50%;color:#b9f4c8!important}#framework .step h3{margin:0!important;color:#fff!important;font-size:clamp(18px,1.8vw,25px)!important;white-space:nowrap}#framework .step p{display:none!important}#framework .step:not(:last-child):after{content:'→';position:absolute;right:-17px;top:50%;transform:translateY(-50%);font-size:22px;color:#b9f4c8;font-weight:700;z-index:3}#about .aboutgrid{display:block!important}#about .framework-card{display:none!important}#about .bridge-card{max-width:1040px!important;margin:0 auto!important;min-height:auto!important;padding:34px 26px 28px!important;border:0!important;box-shadow:none!important;background:transparent!important}#about .bridge-card h3,#about .bridge-card>p{text-align:center!important}#about .bridge-card h3{font-size:30px!important;color:#104886!important}#about .bridge-card>p{max-width:720px;margin:0 auto 30px!important;color:#607083!important}.about-iconflow{display:grid;align-items:start;margin-top:20px}.bridge-card .about-iconflow{grid-template-columns:repeat(4,1fr);gap:28px}.about-node{text-align:center}.about-icon{width:92px;height:92px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#104886;color:#fff;box-shadow:0 12px 26px rgba(16,72,134,.14)}.bridge-card .about-node:nth-child(2) .about-icon{background:#176eb8}.bridge-card .about-node:nth-child(3) .about-icon{background:#20a653}.bridge-card .about-node:nth-child(4) .about-icon{background:#705aa8}.about-icon svg{width:45px;height:45px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.about-node b{display:block;color:#104886;font-size:16px}.about-node small{display:block;margin:6px auto 0;max-width:150px;color:#77879a;font-size:12px;line-height:1.4}.aboutcard .aboutpillars{display:none!important}.founder{background:#fff!important}.founder .foundergrid{border:1px solid #d7e6da!important;background:linear-gradient(110deg,#fff 0%,#fffdf7 100%)!important;box-shadow:0 20px 54px rgba(16,72,134,.10)!important}.founder .founderphoto{min-height:430px!important}.founder .founderphoto img{width:100%!important;height:100%!important;min-height:430px!important;object-fit:cover!important;object-position:center top!important}.founder .ey{color:#b18431!important}@media(max-width:900px){.hero .heroin{grid-template-columns:1fr!important}.hero .heroin>div:first-child{min-height:610px!important;border-radius:0!important;background:linear-gradient(90deg,rgba(16,72,134,.96),rgba(16,72,134,.76))!important;padding:60px 34px!important}.hero .herovisual{min-height:610px!important}#framework .timeline{grid-template-columns:1fr!important}#framework .step{min-height:94px!important;flex-direction:row;justify-content:flex-start;gap:16px;text-align:left}#framework .step:nth-child(3){transform:none}#framework .step:not(:last-child):after{display:none}.bridge-card .about-iconflow{grid-template-columns:repeat(2,1fr)!important}}@media(max-width:620px){.hero h1{font-size:40px!important}.bridge-card .about-iconflow{grid-template-columns:1fr!important}}`;d.head.appendChild(s)}
function ensureExpCss(d){if(d.getElementById('experience-review-css'))return;const s=d.createElement('style');s.id='experience-review-css';s.textContent=`.expTools{display:flex;align-items:center;gap:10px;margin-left:auto}.expBack{font-size:13px;font-weight:700;color:#104886;white-space:nowrap}.expLang{display:flex;border:1px solid #d7e6da;border-radius:999px;overflow:hidden;background:#fff}.expLang button{border:0;background:transparent;padding:7px 10px;font:600 12px inherit;color:#607083;cursor:pointer}.expLang button.active{background:#104886;color:#fff}.keep-thai{display:inline-block;white-space:nowrap!important}.exp-concept-hide{display:none!important}@media(max-width:620px){.navlinks{display:none!important}}`;d.head.appendChild(s)}
function patchAbout(d,lang){const about=d.querySelector('#about');if(!about)return;const cards=[...about.querySelectorAll('.aboutcard')];if(cards[0])cards[0].classList.add('framework-card');const card=cards[1];if(!card)return;card.classList.add('bridge-card');const L=lang==='th'?{p:['People','ศักยภาพของคน'],w:['Work','วิธีทำงาน'],s:['Service','คุณค่าบริการ'],ai:['AI','เสริมการตัดสินใจ']}:{p:['People','Human capability'],w:['Work','Ways of working'],s:['Service','Service value'],ai:['AI','Intelligent tools']};let v=card.querySelector('.about-iconflow');if(!v){v=d.createElement('div');v.className='about-iconflow';card.appendChild(v)}if(v.dataset.lang!==lang){v.innerHTML=[['people',L.p],['work',L.w],['service',L.s],['ai',L.ai]].map(([k,x])=>`<div class="about-node"><div class="about-icon">${icons[k]}</div><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');v.dataset.lang=lang}}
function patchMain(d){ensureMainCss(d);const lang=d.body.getAttribute('data-lang')==='en'?'en':'th';localStorage.setItem('relearnosLang',lang);const about=d.querySelector('#about'),fw=d.querySelector('#framework'),founder=d.querySelector('.founder'),clients=d.querySelector('.client-experience');if(clients&&about&&about.nextElementSibling!==fw){clients.parentNode.insertBefore(about,clients);clients.parentNode.insertBefore(fw,clients);if(founder)clients.parentNode.insertBefore(founder,clients)}const p=d.querySelector('#programs');if(p){let b=p.querySelector('.mp-principle');if(!b){b=d.createElement('div');b.className='mp-principle';p.querySelector('.pricingnote')?.before(b)}if(b.dataset.lang!==lang){b.innerHTML=lang==='th'?'<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>แกนการเรียนรู้ร่วมกัน เชื่อมกับโจทย์ งานจริง และบริบทของแต่ละธุรกิจบริการ</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>':'<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>A shared learning core, adapted to the real work, challenges and context of each service business.</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>';b.dataset.lang=lang}}d.querySelector('#business-specific')?.style.setProperty('display','none');[...d.querySelectorAll('section')].forEach(x=>{if(x.querySelector('.ey')?.textContent.trim()==='Industries')x.classList.add('struct-hide-industries')});if(fw){const e=fw.querySelector('.head .ey');if(e)e.textContent='RELEARNOS Framework';const t=fw.querySelector('.head .display'),target=lang==='th'?'จากการมองเห็นจุดเริ่มต้น สู่การเปลี่ยนแปลงที่วัดผลได้':'From the right starting point to measurable change';if(t)t.textContent=target;['Diagnose','Learn','Re-Learn','Re-Act','Measure'].forEach((name,i)=>{const x=fw.querySelectorAll('.step')[i];if(x){const h=x.querySelector('h3'),n=x.querySelector('.num');if(h)h.textContent=name;if(n)n.textContent=String(i+1).padStart(2,'0')}})}patchAbout(d,lang)}
function saveThai(d){if(d.body.dataset.expSaved)return;d.body.dataset.expSaved='1';d.querySelectorAll('h1,h2,h3,p,.iconItem,.outcome,.principle,.quote,.bigline,.navlinks a,.nav .primary,.qrBlock small').forEach(el=>el.dataset.th=el.innerHTML)}function restoreThai(d){d.querySelectorAll('[data-th]').forEach(el=>el.innerHTML=el.dataset.th)}function setTxt(el,html){if(el)el.innerHTML=html}function patchBiotech(d){const card=[...d.querySelectorAll('.caseCard')].find(x=>x.querySelector('.caseNumber')?.textContent.includes('04 · BIOTECH'));if(!card)return;const title=card.querySelector('h3');if(title)title.innerHTML='จากบริษัทที่มีเทคโนโลยี สู่โครงสร้างธุรกิจที่<span class="keep-thai">พร้อมต่อยอด</span>'}
function applyExperienceLang(d,lang){saveThai(d);if(lang==='th'){restoreThai(d);patchBiotech(d)}else{const hero=d.querySelector('.experienceHero');setTxt(hero?.querySelector('h1'),expEN.heroH);setTxt(hero?.querySelector('.lead'),expEN.heroP);const applied=d.querySelector('#applied');setTxt(applied?.querySelector('.display'),expEN.appliedH);setTxt(applied?.querySelector('.head>p'),expEN.appliedP);[...applied?.querySelectorAll('.caseCard')||[]].forEach((card,i)=>{const c=expEN.cases[i];if(!c)return;setTxt(card.querySelector('h3'),c[0]);setTxt(card.querySelector('.caseContent>p'),c[1]);[...card.querySelectorAll('.iconItem')].forEach((x,j)=>{const b=x.querySelector('b')?.outerHTML||'';x.innerHTML=b+c[2][j]});setTxt(card.querySelector('.outcome'),c[3])});const cur=d.querySelector('#current');setTxt(cur?.querySelector('.currentPanel>div>p:not(.ey)'),expEN.currentP);const partners=d.querySelector('#partners');setTxt(partners?.querySelector('.display'),expEN.partnersH);setTxt(partners?.querySelector('.head>p'),expEN.partnersP);const line=d.querySelector('.lineCta');setTxt(line?.querySelector('h2'),expEN.ctaH);setTxt(line?.querySelector('p'),expEN.ctaP)}d.documentElement.lang=lang;d.body.dataset.expLang=lang;localStorage.setItem('relearnosLang',lang);d.querySelectorAll('.expLang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));const back=d.querySelector('.expBack');if(back)back.textContent=lang==='th'?'← กลับ RELEARNOS':'← RELEARNOS'}
function patchExperience(d){ensureExpCss(d);[...d.querySelectorAll('section')].forEach(s=>{const ey=s.querySelector('.ey')?.textContent.trim();if(['What We Build','What Remains','The RELEARNOS View'].includes(ey))s.classList.add('exp-concept-hide')});const nav=d.querySelector('.navin');if(nav&&!d.querySelector('.expTools')){const tools=d.createElement('div');tools.className='expTools';tools.innerHTML='<a class="expBack" href="../">← กลับ RELEARNOS</a><div class="expLang"><button type="button" data-lang="th">TH</button><button type="button" data-lang="en">EN</button></div>';nav.appendChild(tools);tools.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>applyExperienceLang(d,b.dataset.lang)))}applyExperienceLang(d,localStorage.getItem('relearnosLang')==='en'?'en':'th')}
function apply(){try{const d=f.contentDocument;if(!d?.body)return;const path=f.contentWindow.location.pathname||'';if(path.includes('/insights'))patchExperience(d);else patchMain(d)}catch(e){}}f.addEventListener('load',()=>{apply();try{const d=f.contentDocument;const obs=new MutationObserver(m=>{if(m.some(x=>x.type==='attributes'&&x.attributeName==='data-lang'))requestAnimationFrame(apply)});obs.observe(d.body,{attributes:true,attributeFilter:['data-lang']})}catch(e){}});
</script></body></html>
