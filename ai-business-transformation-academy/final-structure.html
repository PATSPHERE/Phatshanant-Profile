<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RELEARNOS | Structural Review</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0;background:#fff}</style></head><body><iframe id="site" src="./" title="RELEARNOS Structural Review"></iframe><script>
const f=document.getElementById('site');
function closestBox(el){let n=el;for(let i=0;i<4&&n;i++,n=n.parentElement){if(n.tagName==='DIV'&&n.querySelector('h3,h4,strong')&&n.querySelector('p,span'))return n}return el?.parentElement||null}
function findText(root,words){const all=[...root.querySelectorAll('h2,h3,h4,strong,p,span,div')];return all.find(el=>{const t=(el.textContent||'').trim().toLowerCase();return words.some(w=>t.includes(w.toLowerCase()))})}
function ensureCss(d){if(d.getElementById('stable-structure-css'))return;const s=d.createElement('style');s.id='stable-structure-css';s.textContent=`#business-specific{display:none!important}.struct-hide-industries{display:none!important}#programs .mp-principle{margin:30px 0 0;padding:28px 30px;border:1px solid #cfe5d4;background:linear-gradient(135deg,#fbfdf8,#eef6fb);box-shadow:0 14px 36px rgba(16,72,134,.07)}#programs .mp-principle-ey{margin:0 0 8px;color:#20a653;font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}#programs .mp-principle h3{margin:0;color:#104886;font-size:28px;line-height:1.18}#programs .mp-principle p{margin:10px 0 18px;color:#607083;font-size:15px}#programs .mp-contexts{display:flex;flex-wrap:wrap;gap:8px}#programs .mp-contexts span{padding:6px 11px;border:1px solid #bde4c6;background:#fff;color:#123b67;font-size:12px;font-weight:600}
#framework{position:relative;overflow:hidden;padding:96px 0!important;background:radial-gradient(circle at 18% 12%,rgba(23,110,184,.48),transparent 34%),radial-gradient(circle at 82% 78%,rgba(32,166,83,.24),transparent 32%),linear-gradient(135deg,#0d315c,#104886 48%,#0b3151)!important}#framework .head{display:block!important;text-align:center;margin:0 auto 52px!important;max-width:900px}#framework .head .ey{color:#9ce4b4!important;margin-bottom:14px!important}#framework .head .display{font-size:clamp(38px,5.2vw,66px)!important;line-height:1.05!important;color:#fff!important;letter-spacing:-.02em!important}#framework .head>p{display:none!important}#framework .timeline{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:12px!important;border:0!important;overflow:visible!important}#framework .step{min-height:184px!important;padding:24px 16px!important;border:1px solid rgba(255,255,255,.22)!important;border-right:1px solid rgba(255,255,255,.22)!important;background:rgba(255,255,255,.07)!important;display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.14)}#framework .step:nth-child(1),#framework .step:nth-child(5){background:rgba(32,166,83,.13)!important}#framework .step:nth-child(3){background:rgba(255,255,255,.13)!important;transform:translateY(-10px)}#framework .step .num{margin:0 0 14px!important;display:grid;place-items:center;width:42px;height:42px;border:1px solid #9ce4b4;border-radius:50%;color:#b9f4c8!important}#framework .step h3{margin:0!important;color:#fff!important;font-size:clamp(18px,1.8vw,25px)!important;white-space:nowrap}#framework .step p{display:none!important}#framework .step:not(:last-child):after{content:'→';position:absolute;right:-17px;top:50%;transform:translateY(-50%);font-size:22px;color:#b9f4c8;font-weight:700;z-index:3}
#about .about-infographic{margin-top:22px;padding:24px;border:1px solid #d7e6da;background:linear-gradient(135deg,#fff,#f7fbf4);box-shadow:0 12px 30px rgba(16,72,134,.06)}#about .about-infographic h3{margin:0 0 18px;color:#104886;font-size:22px}#about .mini-flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:center}#about .mini-stage{position:relative;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 8px;background:#104886;color:#fff;text-align:center}#about .mini-stage b{font-size:14px;line-height:1.2}#about .mini-stage small{margin-top:5px;color:#bfeacb;font-size:10px}#about .mini-stage:not(:last-child):after{content:'→';position:absolute;right:-11px;z-index:2;color:#20a653;font-weight:800;font-size:18px}#about .bridge-icons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}#about .bridge-node{min-height:120px;padding:16px 10px;border:1px solid #d7e6da;background:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}#about .bridge-icon{width:46px;height:46px;margin-bottom:10px;border-radius:50%;display:grid;place-items:center;background:#eef7f1;color:#104886;font-size:20px;font-weight:700}#about .bridge-node b{color:#104886;font-size:14px}#about .bridge-caption{margin:14px 0 0;color:#607083;font-size:13px;text-align:center}
#about .founder{margin-top:38px!important;padding:0!important;border:1px solid #d7e6da!important;background:#fff!important;box-shadow:0 20px 54px rgba(16,72,134,.10)!important;overflow:hidden}#about .foundergrid,#about .founder>div{align-items:stretch!important}#about .founder img{width:100%!important;height:100%!important;min-height:420px!important;object-fit:cover!important;object-position:center top!important}#about .founder-copy,#about .foundertext{padding:42px!important}#about .founder .ey{color:#20a653!important}#about .founder .display,#about .founder h2{font-size:clamp(30px,3.4vw,46px)!important;line-height:1.14!important}#about .founder-proof{margin-top:22px;padding-top:18px;border-top:1px solid #d7e6da;display:flex;flex-wrap:wrap;gap:8px}#about .founder-proof span{padding:7px 10px;background:#f1f8ee;border:1px solid #d7e6da;color:#104886;font-size:11px;font-weight:700}
@media(max-width:900px){#framework .timeline{grid-template-columns:1fr!important;gap:10px!important}#framework .step{min-height:94px!important;flex-direction:row;justify-content:flex-start;gap:16px;text-align:left}#framework .step:nth-child(3){transform:none}#framework .step h3{white-space:normal}#framework .step:not(:last-child):after{display:none}#about .mini-flow{grid-template-columns:1fr}#about .mini-stage:not(:last-child):after{content:'↓';right:auto;bottom:-16px}#about .bridge-icons{grid-template-columns:repeat(2,1fr)}#about .founder img{min-height:340px!important}}@media(max-width:620px){#programs .mp-principle{padding:22px 20px}#programs .mp-principle h3{font-size:24px}#framework{padding:72px 0!important}#framework .head .display{font-size:38px!important}#about .bridge-icons{grid-template-columns:1fr}#about .founder-copy,#about .foundertext{padding:28px 22px!important}}`;d.head.appendChild(s)}
function patchAbout(d,lang){const about=d.querySelector('#about');if(!about)return;let visual=about.querySelector('.about-visual-pack');if(!visual){visual=d.createElement('div');visual.className='about-visual-pack';const anchor=about.querySelector('.head')||about.firstElementChild;anchor?.insertAdjacentElement('afterend',visual)}if(visual.dataset.lang!==lang){visual.innerHTML=lang==='th'?`<div class="about-infographic"><h3>Human-Centric Learning · Applied to Real Work</h3><div class="mini-flow"><div class="mini-stage"><b>Diagnose</b><small>เห็นจุดเริ่มต้น</small></div><div class="mini-stage"><b>Learn</b><small>สร้างความสามารถ</small></div><div class="mini-stage"><b>Re-Learn</b><small>ทบทวนและออกแบบใหม่</small></div><div class="mini-stage"><b>Re-Act</b><small>นำไปใช้กับงานจริง</small></div><div class="mini-stage"><b>Measure</b><small>วัดสิ่งที่เปลี่ยน</small></div></div></div><div class="about-infographic"><h3>Bridge between Service, Capability &amp; Intelligence</h3><div class="bridge-icons"><div class="bridge-node"><div class="bridge-icon">P</div><b>People</b></div><div class="bridge-node"><div class="bridge-icon">W</div><b>Work</b></div><div class="bridge-node"><div class="bridge-icon">S</div><b>Service</b></div><div class="bridge-node"><div class="bridge-icon">AI</div><b>AI</b></div></div><p class="bridge-caption">เชื่อมคน วิธีทำงาน คุณภาพบริการ และเทคโนโลยีให้เดินไปในทิศทางเดียวกัน</p></div>`:`<div class="about-infographic"><h3>Human-Centric Learning · Applied to Real Work</h3><div class="mini-flow"><div class="mini-stage"><b>Diagnose</b><small>See the starting point</small></div><div class="mini-stage"><b>Learn</b><small>Build capability</small></div><div class="mini-stage"><b>Re-Learn</b><small>Reflect &amp; redesign</small></div><div class="mini-stage"><b>Re-Act</b><small>Apply to real work</small></div><div class="mini-stage"><b>Measure</b><small>Track what changes</small></div></div></div><div class="about-infographic"><h3>Bridge between Service, Capability &amp; Intelligence</h3><div class="bridge-icons"><div class="bridge-node"><div class="bridge-icon">P</div><b>People</b></div><div class="bridge-node"><div class="bridge-icon">W</div><b>Work</b></div><div class="bridge-node"><div class="bridge-icon">S</div><b>Service</b></div><div class="bridge-node"><div class="bridge-icon">AI</div><b>AI</b></div></div><p class="bridge-caption">Connecting people, ways of working, service quality and technology as one system.</p></div>`;visual.dataset.lang=lang}
 const oldHuman=findText(about,['human-centric learning','human centric learning']);const oldBridge=findText(about,['bridge between service','people · work · service · ai','people work service ai']);[oldHuman,oldBridge].forEach(el=>{const box=closestBox(el);if(box&&box!==visual&&!box.classList.contains('about-infographic')&&!box.classList.contains('founder'))box.style.display='none'});
 const founder=about.querySelector('.founder');if(founder&&!founder.querySelector('.founder-proof')){const proof=d.createElement('div');proof.className='founder-proof';proof.innerHTML='<span>Service Experience</span><span>Capability Development</span><span>Practical Transformation</span>';const target=founder.querySelector('[data-text="founderBody"]')?.parentElement||founder.lastElementChild;target?.appendChild(proof)}}
function apply(){try{const d=f.contentDocument;if(!d?.body||f.contentWindow.location.pathname.includes('/insights'))return;ensureCss(d);const lang=d.body.getAttribute('data-lang')==='en'?'en':'th';const p=d.querySelector('#programs');if(p){let b=p.querySelector('.mp-principle');if(!b){b=d.createElement('div');b.className='mp-principle';const n=p.querySelector('.pricingnote');n?.parentNode?.insertBefore(b,n)}const desired=lang==='th'?'<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>แกนการเรียนรู้ร่วมกัน เชื่อมกับโจทย์ งานจริง และบริบทของแต่ละธุรกิจบริการ</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>':'<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>A shared learning core, adapted to the real work, challenges and context of each service business.</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>';if(b.dataset.lang!==lang){b.innerHTML=desired;b.dataset.lang=lang}}
const biz=d.querySelector('#business-specific');if(biz)biz.style.display='none';[...d.querySelectorAll('section')].forEach(x=>{if(x.querySelector('.ey')?.textContent.trim()==='Industries')x.classList.add('struct-hide-industries')});const fw=d.querySelector('#framework');if(fw){const e=fw.querySelector('.head .ey');if(e&&e.textContent!=='RELEARNOS Framework')e.textContent='RELEARNOS Framework';const target=lang==='th'?'จากการมองเห็นจุดเริ่มต้น สู่การเปลี่ยนแปลงที่วัดผลได้':'From the right starting point to measurable change';const t=fw.querySelector('.head .display');if(t&&t.textContent!==target)t.textContent=target;const names=['Diagnose','Learn','Re-Learn','Re-Act','Measure'];[...fw.querySelectorAll('.step')].forEach((x,i)=>{const h=x.querySelector('h3');if(h&&h.textContent!==names[i])h.textContent=names[i];const n=x.querySelector('.num'),nn=String(i+1).padStart(2,'0');if(n&&n.textContent!==nn)n.textContent=nn})}patchAbout(d,lang)}catch(e){}}
f.addEventListener('load',()=>{apply();try{const d=f.contentDocument;const obs=new MutationObserver(m=>{if(m.some(x=>x.type==='attributes'&&x.attributeName==='data-lang'))requestAnimationFrame(apply)});obs.observe(d.body,{attributes:true,attributeFilter:['data-lang']});}catch(e){}});
</script></body></html>
