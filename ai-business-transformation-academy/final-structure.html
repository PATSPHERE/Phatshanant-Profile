function patchAbout(d,lang){const about=d.querySelector('#about');if(!about)return;const cards=[...about.querySelectorAll('.aboutcard')];const labels=lang==='th'?{d:['Diagnose','เข้าใจจุดเริ่มต้น'],l:['Learn','เรียนรู้'],r:['Re-Learn','ปรับมุมมอง'],a:['Re-Act','ลงมือกับงานจริง'],m:['Measure','วัดการเปลี่ยนแปลง'],p:['People','ศักยภาพของคน'],w:['Work','วิธีทำงาน'],s:['Service','คุณค่าบริการ'],ai:['AI','เสริมการตัดสินใจ']}:{d:['Diagnose','Starting point'],l:['Learn','Build capability'],r:['Re-Learn','Reflect & redesign'],a:['Re-Act','Apply to work'],m:['Measure','Track change'],p:['People','Human capability'],w:['Work','Ways of working'],s:['Service','Service value'],ai:['AI','Intelligent tools']};if(cards[0]){cards[0].style.display='';cards[0].classList.add('framework-card');cards[0].querySelector('.aboutpillars')?.setAttribute('style','display:none!important');let v=cards[0].querySelector('.about-iconflow');if(!v){v=d.createElement('div');v.className='about-iconflow';cards[0].appendChild(v)}if(v.dataset.lang!==lang){v.innerHTML=[['diagnose',labels.d],['learn',labels.l],['relearn',labels.r],['react',labels.a],['measure',labels.m]].map(([k,x])=>`<div class="about-node"><div class="about-icon">${icons[k]}</div><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');v.dataset.lang=lang}}if(cards[1]){cards[1].style.display='';cards[1].classList.add('bridge-card');cards[1].querySelector('.aboutpillars')?.setAttribute('style','display:none!important');let v=cards[1].querySelector('.about-iconflow');if(!v){v=d.createElement('div');v.className='about-iconflow';cards[1].appendChild(v)}if(v.dataset.lang!==lang){v.innerHTML=[['people',labels.p],['work',labels.w],['service',labels.s],['ai',labels.ai]].map(([k,x])=>`<div class="about-node"><div class="about-icon">${icons[k]}</div><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');v.dataset.lang=lang}}}
function apply(){try{const d=f.contentDocument;if(!d?.body||f.contentWindow.location.pathname.includes('/insights'))return;ensureCss(d);const lang=d.body.getAttribute('data-lang')==='en'?'en':'th';const p=d.querySelector('#programs');if(p){let b=p.querySelector('.mp-principle');if(!b){b=d.createElement('div');b.className='mp-principle';const n=p.querySelector('.pricingnote');n?.parentNode?.insertBefore(b,n)}const desired=lang==='th'?'<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>แกนการเรียนรู้ร่วมกัน เชื่อมกับโจทย์ งานจริง และบริบทของแต่ละธุรกิจบริการ</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>':'<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>A shared learning core, adapted to the real work, challenges and context of each service business.</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>';if(b.dataset.lang!==lang){b.innerHTML=desired;b.dataset.lang=lang}}const biz=d.querySelector('#business-specific');if(biz)biz.style.display='none';[...d.querySelectorAll('section')].forEach(x=>{if(x.querySelector('.ey')?.textContent.trim()==='Industries')x.classList.add('struct-hide-industries')});const fw=d.querySelector('#framework');if(fw){const e=fw.querySelector('.head .ey');if(e&&e.textContent!=='RELEARNOS Framework')e.textContent='RELEARNOS Framework';const target=lang==='th'?'จากการมองเห็นจุดเริ่มต้น สู่การเปลี่ยนแปลงที่วัดผลได้':'From the right starting point to measurable change';const t=fw.querySelector('.head .display');if(t&&t.textContent!==target)t.textContent=target;const names=['Diagnose','Learn','Re-Learn','Re-Act','Measure'];[...fw.querySelectorAll('.step')].forEach((x,i)=>{const h=x.querySelector('h3');if(h&&h.textContent!==names[i])h.textContent=names[i];const n=x.querySelector('.num'),nn=String(i+1).padStart(2,'0');if(n&&n.textContent!==nn)n.textContent=nn})}patchAbout(d,lang)}catch(e){}}
