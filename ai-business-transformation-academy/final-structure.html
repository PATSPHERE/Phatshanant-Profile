function buildSolutions(d,lang){const data=S[lang],th=lang==='th';let sec=d.querySelector('#solutions-review');if(!sec){sec=d.createElement('section');sec.id='solutions-review';d.querySelector('.hero')?.after(sec)}sec.innerHTML=`<div class="wrap"><div class="solutions-head"><p class="ey">OUTCOMES THAT MATTER</p><h2>${th?'คุณอยากเห็นอะไรเปลี่ยนไปในองค์กร?':'What do you want to change?'}</h2><p>${th?'เริ่มจากผลลัพธ์ที่องค์กรต้องการ แล้วค่อยเชื่อมไปสู่แนวทางพัฒนา โปรแกรม และเคสที่เกี่ยวข้อง':'Start with the outcome, then connect it to the right approach, programme and evidence.'}</p></div><div class="solution-grid">${data.map((x,i)=>`<a class="solution-card" href="#solution-${x.slug}" data-solution="${x.slug}"><div class="solution-copy"><div class="solution-top"><div class="solution-icon">${icons[x.icon]}</div><span class="solution-num">0${i+1}</span></div><h3>${x.title}</h3><p>${x.desc}</p><span class="solution-link">${th?'ดูรายละเอียด →':'Explore →'}</span></div><div class="solution-thumb" style="background-image:url('${x.img}')"></div></a>`).join('')}</div></div>`;
let det=d.querySelector('.solution-details');if(!det){det=d.createElement('section');det.className='solution-details';sec.after(det)}det.innerHTML=data.map(x=>`<article class="solution-detail" id="solution-${x.slug}" data-detail="${x.slug}"><div class="wrap"><a class="detail-back" href="#solutions-review">← ${th?'กลับไป Outcomes':'Back to outcomes'}</a></div><div class="detail-hero"><div class="detail-hero-img" style="background-image:url('${x.img}')"></div><div class="detail-hero-copy"><p class="ey">SOLUTION / OUTCOME</p><h2>${x.title}</h2><p>${x.desc}</p></div></div><div class="detail-section"><div class="wrap detail-split"><div class="detail-photo" style="background-image:url('${x.img}')"></div><div class="detail-copy"><p class="ey">WHEN THIS IS HAPPENING</p><h3>${th?'สัญญาณว่าองค์กรอาจต้องพัฒนาเรื่องนี้':'Signals this outcome may matter'}</h3><div class="insight-list">${x.challenge.map((v,i)=>`<div class="insight-row"><b>0${i+1}</b><span>${v}</span></div>`).join('')}</div></div></div></div><div class="detail-section beforeafter"><div class="wrap"><p class="ey">WHAT CHANGES</p><div class="ba-grid"><div class="ba-box"><h4>${th?'ก่อน':'Before'}</h4>${x.before.map(v=>`<p>— ${v}</p>`).join('')}</div><div class="ba-arrow">→</div><div class="ba-box"><h4>${th?'หลัง':'After'}</h4>${x.after.map(v=>`<p>— ${v}</p>`).join('')}</div></div></div></div><div class="detail-section approach-band"><div class="wrap"><div><p class="ey">RELEARNOS APPROACH</p><h3>${th?'ไม่เริ่มจากเครื่องมือ แต่เริ่มจากงาน':'Start with work, not the tool'}</h3></div><div><p>${x.approach}</p><div class="framework-mini"><span>Diagnose</span><span>Learn</span><span>Re-Learn</span><span>Re-Act</span><span>Measure</span></div></div></div></div><div class="detail-section"><div class="wrap related-programmes"><div><p class="ey">RELATED PROGRAMMES</p><h3>${th?'เส้นทางพัฒนาที่เชื่อมกับ Outcome นี้':'Development paths connected to this outcome'}</h3></div><div class="programme-mini-grid">${x.programmes.map(v=>`<div class="programme-mini"><b>${v}</b><span>${th?'ดู Programme Outline ในส่วน Master Programme':'See programme outline in Master Programme'}</span></div>`).join('')}</div></div></div><div class="wrap"><div class="case-proof"><div class="case-proof-img" style="background-image:url('${x.img}')"></div><div class="case-proof-copy"><p class="ey">RELATED EXPERIENCE</p><h3>${x.caseTitle}</h3><h4>${x.caseSub}</h4><p>${x.caseText}</p><a href="insights/">${th?'ดู Experience / Case →':'View experience / case →'}</a></div></div></div><div style="height:82px"></div></article>`).join('');
sec.querySelectorAll('[data-solution]').forEach(a=>a.onclick=e=>{e.preventDefault();const slug=a.dataset.solution;det.querySelectorAll('.solution-detail').forEach(x=>x.classList.toggle('active',x.dataset.detail===slug));det.querySelector(`[data-detail="${slug}"]`)?.scrollIntoView({behavior:'smooth'})});return{sec,det}}
function framework(d,lang){const fw=d.querySelector('#framework');if(!fw)return;const ey=fw.querySelector('.head .ey');if(ey)ey.textContent='RELEARNOS Framework';const t=fw.querySelector('.head .display');if(t)t.textContent=lang==='th'?'จากจุดเริ่มต้น สู่การเปลี่ยนแปลงที่วัดผลได้':'From the right starting point to measurable change';['Diagnose','Learn','Re-Learn','Re-Act','Measure'].forEach((n,i)=>{const h=fw.querySelectorAll('.step')[i]?.querySelector('h3');if(h)h.textContent=n});let n=fw.querySelector('.framework-note');if(!n){n=d.createElement('p');n.className='framework-note';fw.querySelector('.wrap')?.appendChild(n)}n.textContent='People · Work · Service · AI/Technology'}
function programs(d,lang){const p=d.querySelector('#programs');if(!p)return;const th=lang==='th';[...p.querySelectorAll('.pathway')].forEach((card,i)=>{let a=card.querySelector('.outline-link');if(!a){a=d.createElement('a');a.className='outline-link';card.querySelector('.pathcta')?.appendChild(a)}a.textContent=th?'ดู Programme Outline →':'View programme outline →';a.href=`#outline-${i}`;a.onclick=e=>{e.preventDefault();p.querySelectorAll('.programme-outline').forEach(x=>x.classList.remove('active'));const o=p.querySelector(`#outline-${i}`);o?.classList.add('active');o?.scrollIntoView({behavior:'smooth',block:'center'})}});let h=p.querySelector('.programme-outlines');if(!h){h=d.createElement('div');h.className='programme-outlines';p.querySelector('.pathgrid')?.after(h)}h.innerHTML=outlines.map((x,i)=>`<article class="programme-outline" id="outline-${i}"><div class="outline-side"><p class="ey">PATH 0${i+1} · PROGRAMME OUTLINE</p><h3>${x[0]}</h3><p>${th?'โครงหลักก่อนปรับตามบริบทองค์กรและผู้เรียน':'Core structure before contextual adaptation'}</p></div><div class="outline-body"><div class="outline-list">${x[1].map((v,j)=>`<div class="outline-item"><b>0${j+1}</b> · ${v}</div>`).join('')}</div><span class="outline-close">${th?'ปิด Outline ↑':'Close ↑'}</span></div></article>`).join('');h.querySelectorAll('.outline-close').forEach(x=>x.onclick=()=>h.querySelectorAll('.programme-outline').forEach(y=>y.classList.remove('active')));let b=p.querySelector('.mp-principle');if(!b){b=d.createElement('div');b.className='mp-principle';p.querySelector('.pricingnote')?.before(b)}b.innerHTML=`<p class="ey">MASTER PROGRAMME PRINCIPLE</p><h3>One Core. Different Service Contexts.</h3><p>${th?'แกนการเรียนรู้ร่วมกัน ปรับตามงานจริง ระดับผู้เรียน และบริบทของแต่ละธุรกิจบริการ':'A shared core adapted to real work, learner level and service context.'}</p><div class="mp-contexts"><span>Property & Place Management</span><span>Hospitality & Experience</span><span>Healthcare & Care Services</span><span>Professional Services</span></div>`}
function about(d,lang){const a=d.querySelector('#about');if(!a)return;let s=a.querySelector('.about-system');if(!s){s=d.createElement('div');s.className='about-system wrap';a.appendChild(s)}const th=lang==='th';s.innerHTML=`<div><p class="ey">ABOUT RELEARNOS</p><h2>${th?'พื้นที่พัฒนาคนให้พร้อมสำหรับโลกที่กำลังมาถึง':'A place to develop people for the world ahead.'}</h2></div><div><p class="belief">Human-centred learning. Applied to real work.</p><p>${th?'RELEARNOS พัฒนาความสามารถของคนผ่านโจทย์และบริบทการทำงานจริง เป้าหมายไม่ใช่เพียงให้รู้มากขึ้น แต่ให้คิด ตัดสินใจ ปรับวิธีทำงาน และสร้างคุณค่าที่ดีขึ้นในโลกที่ AI และเทคโนโลยีเป็นส่วนหนึ่งของงาน':'RELEARNOS develops human capability through real work and business context.'}</p><div class="about-dimensions"><div class="about-dimension"><b>People</b></div><div class="about-dimension"><b>Work</b></div><div class="about-dimension"><b>Service</b></div><div class="about-dimension"><b>AI / Technology</b></div></div></div>`}
function nav(d,lang){const l=[...d.querySelectorAll('.nav .links a')],th=lang==='th',m=[['Solutions','#solutions-review'],[th?'โปรแกรม':'Programmes','#programs'],[th?'วิธีที่ RELEARNOS ทำงาน':'How RELEARNOS Works','#framework'],[th?'ประสบการณ์':'Experience','insights/'],[th?'เกี่ยวกับ RELEARNOS':'About RELEARNOS','#about'],[th?'ติดต่อ':'Contact','#contact']];l.forEach((a,i)=>{if(m[i]){a.textContent=m[i][0];a.href=m[i][1]}});if(l[4])l[4].onclick=e=>{e.preventDefault();const a=d.querySelector('#about'),fo=d.querySelector('.founder');a?.classList.remove('home-about-hide');a?.classList.add('about-revealed');fo?.classList.remove('home-about-hide');fo?.classList.add('founder-revealed');a?.scrollIntoView({behavior:'smooth'})}}
function reorder(d,o){const hero=d.querySelector('.hero'),fw=d.querySelector('#framework'),p=d.querySelector('#programs'),c=d.querySelector('.client-experience');if(hero)hero.after(o.sec);o.sec.after(o.det);if(fw)o.det.after(fw);if(p)fw?.after(p);if(c)p?.after(c)}
function main(d){addCss(d);const lang=d.body.getAttribute('data-lang')==='en'?'en':'th';hideOld(d);const o=buildSolutions(d,lang);framework(d,lang);programs(d,lang);about(d,lang);reorder(d,o);nav(d,lang)}
function exp(d){if(!d.getElementById('exp-review')){const s=d.createElement('style');s.id='exp-review';s.textContent='.expTools{display:flex;align-items:center;gap:10px;margin-left:auto}.expBack{font-size:13px;font-weight:700;color:#104886}.exp-concept-hide{display:none!important}.keep-thai{white-space:nowrap}';d.head.appendChild(s)}[...d.querySelectorAll('section')].forEach(s=>{if(['What We Build','What Remains','The RELEARNOS View'].includes(s.querySelector('.ey')?.textContent.trim()))s.classList.add('exp-concept-hide')});const n=d.querySelector('.navin');if(n&&!d.querySelector('.expTools')){const t=d.createElement('div');t.className='expTools';t.innerHTML='<a class="expBack" href="../">← กลับ RELEARNOS</a>';n.appendChild(t)}const c=[...d.querySelectorAll('.caseCard')].find(x=>x.querySelector('.caseNumber')?.textContent.includes('04 · BIOTECH'));if(c){const h=c.querySelector('h3');if(h)h.innerHTML='จากบริษัทที่มีเทคโนโลยี สู่โครงสร้างธุรกิจที่<span class="keep-thai">พร้อมต่อยอด</span>'}}
function apply(){try{const d=f.contentDocument;if(!d?.body)return;(f.contentWindow.location.pathname||'').includes('/insights')?exp(d):main(d)}catch(e){}}
f.addEventListener('load',()=>{apply();try{new MutationObserver(m=>{if(m.some(x=>x.type==='attributes'&&x.attributeName==='data-lang'))requestAnimationFrame(apply)}).observe(f.contentDocument.body,{attributes:true,attributeFilter:['data-lang']})}catch(e){}});
</script></body></html>
