<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RELEARNOS | Structural Review</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0;background:#fff}</style>
</head>
<body>
<iframe id="review" src="final.html" title="RELEARNOS Structural Review"></iframe>
<script>
const review=document.getElementById('review');
function innerFrame(){try{return review.contentDocument?.getElementById('site')||null}catch(e){return null}}
function siteDoc(){try{return innerFrame()?.contentDocument||null}catch(e){return null}}
function sitePath(){try{return innerFrame()?.contentWindow?.location?.pathname||''}catch(e){return ''}}
function ensureStructureStyle(d){
 if(d.getElementById('structure-review-fixes'))return;
 const s=d.createElement('style');s.id='structure-review-fixes';s.textContent=`
 #programs .mp-principle{margin:30px 0 0;padding:28px 30px;border:1px solid #cfe5d4;background:linear-gradient(135deg,#fbfdf8 0%,#f2f8ee 58%,#eef6fb 100%);box-shadow:0 14px 36px rgba(16,72,134,.07)}
 #programs .mp-principle-ey{margin:0 0 8px;color:#20a653;font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}
 #programs .mp-principle h3{margin:0;color:#104886;font-size:28px;line-height:1.18;font-weight:700}
 #programs .mp-principle p{margin:10px 0 18px;color:#607083;font-size:15px;max-width:760px}
 #programs .mp-contexts{display:flex;flex-wrap:wrap;gap:8px}
 #programs .mp-contexts span{display:inline-flex;align-items:center;min-height:34px;padding:6px 11px;border:1px solid #bde4c6;background:#fff;color:#123b67;font-size:12px;font-weight:600}
 #business-specific{display:none!important}
 section.struct-hide-industries{display:none!important}
 #framework{position:relative;overflow:hidden;padding:96px 0!important;background:radial-gradient(circle at 18% 12%,rgba(23,110,184,.48),transparent 34%),radial-gradient(circle at 82% 78%,rgba(32,166,83,.24),transparent 32%),linear-gradient(135deg,#0d315c 0%,#104886 48%,#0b3151 100%)!important}
 #framework:before{content:'';position:absolute;inset:-80px;background:linear-gradient(115deg,transparent 10%,rgba(255,255,255,.035) 30%,transparent 50%);transform:rotate(-6deg);pointer-events:none}
 #framework .wrap{position:relative;z-index:1}
 #framework .head{display:block!important;text-align:center;margin:0 auto 52px!important;max-width:900px}
 #framework .head .ey{color:#9ce4b4!important;margin-bottom:14px!important}
 #framework .head .display{font-size:clamp(38px,5.2vw,66px)!important;line-height:1.05!important;color:#fff!important;letter-spacing:-.02em!important}
 #framework .head>p{display:none!important}
 #framework .timeline{position:relative;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:12px!important;border:0!important;overflow:visible!important}
 #framework .timeline:before{content:'';position:absolute;left:8%;right:8%;top:50%;height:2px;background:linear-gradient(90deg,rgba(156,228,180,.35),#9ce4b4 45%,rgba(255,255,255,.45));transform:translateY(-50%);z-index:0}
 #framework .step{position:relative;z-index:1;min-height:184px!important;padding:24px 16px!important;border:1px solid rgba(255,255,255,.22)!important;border-right:1px solid rgba(255,255,255,.22)!important;background:rgba(255,255,255,.07)!important;backdrop-filter:blur(8px);display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.14)}
 #framework .step:nth-child(1),#framework .step:nth-child(5){background:rgba(32,166,83,.13)!important}
 #framework .step:nth-child(3){background:rgba(255,255,255,.13)!important;transform:translateY(-10px)}
 #framework .step .num{margin:0 0 14px!important;display:grid;place-items:center;width:42px;height:42px;border:1px solid rgba(156,228,180,.75);border-radius:50%;color:#b9f4c8!important;background:rgba(10,43,76,.62);font-size:12px!important;font-weight:700!important}
 #framework .step h3{margin:0!important;color:#fff!important;font-size:clamp(18px,1.8vw,25px)!important;line-height:1.15!important;font-weight:700!important;white-space:nowrap}
 #framework .step p{display:none!important}
 #framework .step:not(:last-child):after{content:'→';position:absolute;right:-17px;top:50%;transform:translateY(-50%);font-size:22px;color:#b9f4c8;font-weight:700;z-index:3;text-shadow:0 0 10px rgba(0,0,0,.2)}
 @media(max-width:900px){#framework .timeline{grid-template-columns:1fr!important;gap:10px!important;max-width:620px;margin:auto}#framework .timeline:before{display:none}#framework .step{min-height:94px!important;flex-direction:row;justify-content:flex-start;gap:16px;text-align:left;padding:18px 22px!important}#framework .step:nth-child(3){transform:none}#framework .step:not(:last-child):after{content:'↓';right:auto;left:31px;top:auto;bottom:-20px;transform:none}#framework .step h3{white-space:normal}}
 @media(max-width:620px){#programs .mp-principle{padding:22px 20px}#programs .mp-principle h3{font-size:24px}#framework{padding:72px 0!important}#framework .head{margin-bottom:34px!important}#framework .head .display{font-size:38px!important}}
 `;d.head.appendChild(s)
}
function patchProgramme(d){
 const programs=d.querySelector('#programs');if(!programs)return;
 const lang=d.body?.getAttribute('data-lang')==='en'?'en':'th';
 let box=programs.querySelector('.mp-principle');
 if(!box){box=d.createElement('div');box.className='mp-principle';const price=programs.querySelector('.pricingnote');price?.parentNode?.insertBefore(box,price)}
 box.innerHTML=lang==='th'?
 `<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>แกนการเรียนรู้ร่วมกัน เชื่อมกับโจทย์ งานจริง และบริบทของแต่ละธุรกิจบริการ</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>`:
 `<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>A shared learning core, adapted to the real work, challenges and context of each service business.</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>`;
 const biz=d.querySelector('#business-specific');if(biz)biz.style.display='none';
 [...d.querySelectorAll('section')].forEach(sec=>{const ey=sec.querySelector(':scope > .wrap .ey, :scope .ey');if(ey?.textContent.trim()==='Industries')sec.classList.add('struct-hide-industries')});
}
function patchFrameworkVisual(d){
 const fw=d.querySelector('#framework');if(!fw)return;
 const lang=d.body?.getAttribute('data-lang')==='en'?'en':'th';
 const ey=fw.querySelector('.head .ey');if(ey)ey.textContent='RELEARNOS Framework';
 const title=fw.querySelector('.head .display');if(title)title.textContent=lang==='th'?'จากการมองเห็นจุดเริ่มต้น สู่การเปลี่ยนแปลงที่วัดผลได้':'From the right starting point to measurable change';
 const steps=[...fw.querySelectorAll('.step')];const names=['Diagnose','Learn','Re-Learn','Re-Act','Measure'];steps.forEach((step,i)=>{const h=step.querySelector('h3');if(h)h.textContent=names[i]||h.textContent;const n=step.querySelector('.num');if(n)n.textContent=String(i+1).padStart(2,'0')});
}
function applyStructure(){
 try{const d=siteDoc();if(!d?.body)return;if(sitePath().includes('/insights'))return;ensureStructureStyle(d);patchProgramme(d);patchFrameworkVisual(d)}catch(e){}
}
review.addEventListener('load',()=>{setTimeout(applyStructure,120);setTimeout(applyStructure,500);try{const inner=innerFrame();inner?.addEventListener('load',()=>{setTimeout(applyStructure,100);setTimeout(applyStructure,450)});const d=siteDoc();if(d){const obs=new MutationObserver(()=>setTimeout(applyStructure,60));obs.observe(d.body,{attributes:true,attributeFilter:['data-lang'],childList:true,subtree:true});d.addEventListener('click',()=>{setTimeout(applyStructure,80);setTimeout(applyStructure,220)},true)}}catch(e){}});
setInterval(applyStructure,900);
</script>
</body>
</html>
