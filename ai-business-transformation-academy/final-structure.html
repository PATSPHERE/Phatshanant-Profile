ริ่มจากการเลือกเครื่องมือก่อน':'Not with a tool first'}</li><li>${th?'ไม่ใช้สูตรเดียวกับทุกองค์กร':'Not one formula for every organisation'}</li><li>${th?'ไม่แยกการเรียนออกจากงานจริง':'Not learning disconnected from work'}</li></ul></div></div><div class="detail-approach"><strong>RELEARNOS APPROACH</strong><p>${x.approach}</p></div><div class="detail-related"><div class="related-box"><h3>${th?'โปรแกรมที่เกี่ยวข้อง':'Related programmes'}</h3>${x.programmes.map(v=>`<p>→ ${v}</p>`).join('')}</div><div class="related-box"><h3>${th?'เคส/ประสบการณ์ที่เกี่ยวข้อง':'Related cases / experience'}</h3>${x.cases.map(v=>`<p>→ ${v}</p>`).join('')}</div></div></article>`).join('')}</div>`;sec.querySelectorAll('[data-solution]').forEach(a=>a.onclick=e=>{e.preventDefault();const slug=a.dataset.solution;details.querySelectorAll('.solution-detail').forEach(x=>x.classList.toggle('active',x.dataset.detail===slug));details.querySelector(`[data-detail="${slug}"]`)?.scrollIntoView({behavior:'smooth',block:'start'})});return {sec,details}}
function patchFramework(d,lang){const fw=d.querySelector('#framework');if(!fw)return;fw.querySelector('.head .ey').textContent='RELEARNOS Framework';const t=fw.querySelector('.head .display');if(t)t.textContent=lang==='th'?'จากจุดเริ่มต้น สู่การเปลี่ยนแปลงที่วัดผลได้':'From the right starting point to measurable change';['Diagnose','Learn','Re-Learn','Re-Act','Measure'].forEach((n,i)=>{const s=fw.querySelectorAll('.step')[i];if(s){const h=s.querySelector('h3');if(h)h.textContent=n}});let note=fw.querySelector('.framework-note');if(!note){note=d.createElement('p');note.className='framework-note';fw.querySelector('.wrap')?.appendChild(note)}note.textContent=lang==='th'?'Framework เดียวของ RELEARNOS — เชื่อม People · Work · Service · AI/Technology เข้ากับงานจริง':'One RELEARNOS Framework — connecting People · Work · Service · AI/Technology to real work.'}
function patchPrograms(d,lang){const p=d.querySelector('#programs');if(!p)return;const th=lang==='th',cards=[...p.querySelectorAll('.pathway')];cards.forEach((card,i)=>{let link=card.querySelector('.outline-link');if(!link){link=d.createElement('a');link.className='outline-link';card.querySelector('.pathcta')?.appendChild(link)}link.textContent=th?'ดู Programme Outline →':'View programme outline →';link.href=`#outline-${i+1}`;link.onclick=e=>{e.preventDefault();const box=p.querySelector(`#outline-${i+1}`);p.querySelectorAll('.programme-outline').forEach(x=>x.classList.remove('active'));box?.classList.add('active');box?.scrollIntoView({behavior:'smooth',block:'center'})}});let holder=p.querySelector('.programme-outlines');if(!holder){holder=d.createElement('div');holder.className='programme-outlines';p.querySelector('.pathgrid')?.after(holder)}holder.innerHTML=outlines[lang].map((x,i)=>`<article class="programme-outline" id="outline-${i+1}"><div class="outline-side"><p class="ey">PATH 0${i+1} · PROGRAMME OUTLINE</p><h3>${x[0]}</h3><p>${th?'ตัวอย่างโครงเนื้อหาหลักก่อนปรับตามบริบทองค์กรและระดับผู้เรียน':'Illustrative core structure before adapting to organisational context and learner level.'}</p></div><div class="outline-body"><h4>${th?'Core Learning Outline':'Core Learning Outline'}</h4><div class="outline-list">${x[1].map((v,j)=>`<div class="outline-item"><b>${String(j+1).padStart(2,'0')}</b> · ${v}</div>`).join('')}</div><span class="outline-close">${th?'ปิด Outline ↑':'Close outline ↑'}</span></div></article>`).join('');holder.querySelectorAll('.outline-close').forEach(x=>x.onclick=()=>holder.querySelectorAll('.programme-outline').forEach(y=>y.classList.remove('active')));let b=p.querySelector('.mp-principle');if(!b){b=d.createElement('div');b.className='mp-principle';p.querySelector('.pricingnote')?.before(b)}b.innerHTML=th?'<p class="ey">MASTER PROGRAMME PRINCIPLE</p><h3>One Core. Different Service Contexts.</h3><p>แกนการเรียนรู้ร่วมกัน ปรับตามงานจริง ระดับผู้เรียน และบริบทของแต่ละธุรกิจบริการ</p><div class="mp-contexts"><span>Property & Place Management</span><span>Hospitality & Experience</span><span>Healthcare & Care Services</span><span>Professional Services</span></div>':'<p class="ey">MASTER PROGRAMME PRINCIPLE</p><h3>One Core. Different Service Contexts.</h3><p>A shared learning core adapted to real work, learner level and each service-business context.</p><div class="mp-contexts"><span>Property & Place Management</span><span>Hospitality & Experience</span><span>Healthcare & Care Services</span><span>Professional Services</span></div>'}
function patchAbout(d,lang){const about=d.querySelector('#about');if(!about)return;let sys=about.querySelector('.about-system');if(!sys){sys=d.createElement('div');sys.className='about-system wrap';about.appendChild(sys)}const th=lang==='th';sys.innerHTML=th?`<div><div class="about-kicker">ABOUT RELEARNOS</div><h2>พื้นที่พัฒนาคนให้พร้อมสำหรับโลกที่กำลังมาถึง</h2></div><div><p class="belief">Human-centred learning. Applied to real work.</p><p class="copy">RELEARNOS คือ learning practice ที่พัฒนาความสามารถของคนผ่านโจทย์และบริบทการทำงานจริง เป้าหมายไม่ใช่เพียงให้ “รู้มากขึ้น” แต่ให้คนสามารถคิด ตัดสินใจ ปรับวิธีทำงาน และสร้างคุณค่าที่ดีขึ้นในโลกที่เทคโนโลยีและ AI เป็นส่วนหนึ่งของงาน</p><div class="about-dimensions"><div class="about-dimension"><b>People</b><span>ศักยภาพ วิจารณญาณ และความพร้อมของคน</span></div><div class="about-dimension"><b>Work</b><span>วิธีทำงาน บทบาท และ workflow ที่ชัดขึ้น</span></div><div class="about-dimension"><b>Service</b><span>คุณค่าบริการและประสบการณ์ที่ดีขึ้น</span></div><div class="about-dimension"><b>AI / Technology</b><span>เทคโนโลยีในบทบาทที่เหมาะสมกับงาน</span></div></div></div>`:`<div><div class="about-kicker">ABOUT RELEARNOS</div><h2>A place to develop people for the world ahead.</h2></div><div><p class="belief">Human-centred learning. Applied to real work.</p><p class="copy">RELEARNOS is a learning practice that develops human capability through real work and business context. The goal is not simply to know more, but to help people think, decide, adapt how work gets done, and create stronger value in a world where technology and AI are part of work.</p><div class="about-dimensions"><div class="about-dimension"><b>People</b><span>Capability, judgement and readiness</span></div><div class="about-dimension"><b>Work</b><span>Clearer roles, workflow and ways of working</span></div><div class="about-dimension"><b>Service</b><span>Stronger service value and experience</span></div><div class="about-dimension"><b>AI / Technology</b><span>Technology in the right role</span></div></div></div>`}
function nav(d,lang,solutions){const links=[...d.querySelectorAll('.nav .links a')],th=lang==='th';const map=[['Solutions','#solutions-review'],[th?'โปรแกรม':'Programmes','#programs'],[th?'วิธีที่ RELEARNOS ทำงาน':'How RELEARNOS Works','#framework'],[th?'ประสบการณ์':'Experience','insights/'],[th?'เกี่ยวกับ RELEARNOS':'About RELEARNOS','#about'],[th?'ติดต่อ':'Contact','#contact']];links.forEach((a,i)=>{if(!map[i])return;a.textContent=map[i][0];a.href=map[i][1]});if(links[4])links[4].onclick=e=>{e.preventDefault();const about=d.querySelector('#about'),founder=d.querySelector('.founder');about?.classList.remove('home-about-hide');about?.classList.add('about-revealed');founder?.classList.remove('home-about-hide');founder?.classList.add('founder-revealed');about?.scrollIntoView({behavior:'smooth'})}}
function reorder(d,sol){const hero=d.querySelector('.hero'),fw=d.querySelector('#framework'),p=d.querySelector('#programs'),clients=d.querySelector('.client-experience');if(hero&&sol.sec)hero.after(sol.sec);if(sol.details)sol.sec.after(sol.details);if(fw)sol.details.after(fw);if(p)fw?.after(p);if(clients)p?.after(clients)}
function main(d){css(d);const lang=d.body.getAttribute('data-lang')==='en'?'en':'th';hideOld(d);const sol=buildSolutions(d,lang);patchFramework(d,lang);patchPrograms(d,lang);patchAbout(d,lang);reorder(d,sol);nav(d,lang,sol)}
function expCss(d){if(d.getElementById('exp-review'))return;const s=d.createElement('style');s.id='exp-review';s.textContent='.expTools{display:flex;align-items:center;gap:10px;margin-left:auto}.expBack{font-size:13px;font-weight:700;color:#104886}.expLang{display:flex;border:1px solid #d7e6da;border-radius:999px;overflow:hidden}.expLang button{border:0;background:#fff;padding:7px 10px;cursor:pointer}.expLang button.active{background:#104886;color:#fff}.exp-concept-hide{display:none!important}.keep-thai{white-space:nowrap}';d.head.appendChild(s)}
function patchExp(d){expCss(d);[...d.querySelectorAll('section')].forEach(s=>{const ey=s.querySelector('.ey')?.textContent.trim();if(['What We Build','What Remains','The RELEARNOS View'].includes(ey))s.classList.add('exp-concept-hide')});const nav=d.querySelector('.navin');if(nav&&!d.querySelector('.expTools')){const tools=d.createElement('div');tools.className='expTools';tools.innerHTML='<a class="expBack" href="../">← กลับ RELEARNOS</a><div class="expLang"><button class="active">TH</button><button>EN</button></div>';nav.appendChild(tools)}const card=[...d.querySelectorAll('.caseCard')].find(x=>x.querySelector('.caseNumber')?.textContent.includes('04 · BIOTECH'));if(card){const title=card.querySelector('h3');if(title)title.innerHTML='จากบริษัทที่มีเทคโนโลยี สู่โครงสร้างธุรกิจที่<span class="keep-thai">พร้อมต่อยอด</span>'}}
function apply(){try{const d=f.contentDocument;if(!d?.body)return;const path=f.contentWindow.location.pathname||'';if(path.includes('/insights'))patchExp(d);else main(d)}catch(e){}}
f.addEventListener('load',()=>{apply();try{const d=f.contentDocument;new MutationObserver(m=>{if(m.some(x=>x.type==='attributes'&&x.attributeName==='data-lang'))requestAnimationFrame(apply)}).observe(d.body,{attributes:true,attributeFilter:['data-lang']})}catch(e){}});
</script></body></html>
