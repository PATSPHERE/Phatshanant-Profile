const f=document.getElementById('site');
function ensureCss(d){if(d.getElementById('stable-structure-css'))return;const s=d.createElement('style');s.id='stable-structure-css';s.textContent=`#business-specific{display:none!important}.struct-hide-industries{display:none!important}#programs .mp-principle{margin:30px 0 0;padding:28px 30px;border:1px solid #cfe5d4;background:linear-gradient(135deg,#fbfdf8,#eef6fb);box-shadow:0 14px 36px rgba(16,72,134,.07)}#programs .mp-principle-ey{margin:0 0 8px;color:#20a653;font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}#programs .mp-principle h3{margin:0;color:#104886;font-size:28px;line-height:1.18}#programs .mp-principle p{margin:10px 0 18px;color:#607083;font-size:15px}#programs .mp-contexts{display:flex;flex-wrap:wrap;gap:8px}#programs .mp-contexts span{padding:6px 11px;border:1px solid #bde4c6;background:#fff;color:#123b67;font-size:12px;font-weight:600}
#framework{position:relative;overflow:hidden;padding:96px 0!important;background:radial-gradient(circle at 18% 12%,rgba(23,110,184,.48),transparent 34%),radial-gradient(circle at 82% 78%,rgba(32,166,83,.24),transparent 32%),linear-gradient(135deg,#0d315c,#104886 48%,#0b3151)!important}#framework .head{display:block!important;text-align:center;margin:0 auto 52px!important;max-width:900px}#framework .head .ey{color:#9ce4b4!important;margin-bottom:14px!important}#framework .head .display{font-size:clamp(38px,5.2vw,66px)!important;line-height:1.05!important;color:#fff!important;letter-spacing:-.02em!important}#framework .head>p{display:none!important}#framework .timeline{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:12px!important;border:0!important;overflow:visible!important}#framework .step{min-height:184px!important;padding:24px 16px!important;border:1px solid rgba(255,255,255,.22)!important;border-right:1px solid rgba(255,255,255,.22)!important;background:rgba(255,255,255,.07)!important;display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.14)}#framework .step:nth-child(1),#framework .step:nth-child(5){background:rgba(32,166,83,.13)!important}#framework .step:nth-child(3){background:rgba(255,255,255,.13)!important;transform:translateY(-10px)}#framework .step .num{margin:0 0 14px!important;display:grid;place-items:center;width:42px;height:42px;border:1px solid #9ce4b4;border-radius:50%;color:#b9f4c8!important}#framework .step h3{margin:0!important;color:#fff!important;font-size:clamp(18px,1.8vw,25px)!important;white-space:nowrap}#framework .step p{display:none!important}#framework .step:not(:last-child):after{content:'→';position:absolute;right:-17px;top:50%;transform:translateY(-50%);font-size:22px;color:#b9f4c8;font-weight:700;z-index:3}
#about .aboutgrid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:20px!important;align-items:stretch!important}#about .aboutcard{display:block!important;min-height:320px!important;padding:30px!important;border:1px solid #d7e6da!important;box-shadow:0 14px 36px rgba(16,72,134,.07)!important;overflow:visible!important}#about .aboutcard:first-child{background:linear-gradient(145deg,#0f3b70,#104886)!important;border-color:#104886!important;color:#fff!important}#about .aboutcard:first-child h3{color:#fff!important}#about .aboutcard:first-child p{color:rgba(255,255,255,.78)!important}#about .aboutcard:nth-child(2){background:linear-gradient(145deg,#fff,#f5faf3)!important}#about .aboutcard h3{margin:0 0 12px!important;font-size:24px!important;line-height:1.25!important;color:#104886}#about .aboutcard p{margin:0 0 26px!important;color:#607083!important}#about .aboutpillars{display:grid!important;gap:8px!important;margin-top:auto!important}#about .framework-card .aboutpillars{grid-template-columns:repeat(5,1fr)!important;align-items:center!important}#about .framework-card .aboutpillars span{position:relative;min-height:76px!important;padding:12px 6px!important;display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important;border:1px solid rgba(255,255,255,.24)!important;background:rgba(255,255,255,.08)!important;color:#fff!important;font-size:12px!important;font-weight:700!important;line-height:1.15!important}#about .framework-card .aboutpillars span:not(:last-child):after{content:'→';position:absolute;right:-9px;z-index:2;color:#a9edb5;font-size:16px;font-weight:800}#about .bridge-card .aboutpillars{grid-template-columns:repeat(4,1fr)!important}#about .bridge-card .aboutpillars span{min-height:94px!important;padding:14px 8px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important;border:1px solid #d7e6da!important;background:#fff!important;color:#104886!important;font-size:13px!important;font-weight:700!important}#about .bridge-card .aboutpillars span:before{display:grid;place-items:center;width:42px;height:42px;margin-bottom:8px;border-radius:50%;background:#eef7f1;color:#104886;font-size:15px;font-weight:800}#about .bridge-card .aboutpillars span:nth-child(1):before{content:'P'}#about .bridge-card .aboutpillars span:nth-child(2):before{content:'W'}#about .bridge-card .aboutpillars span:nth-child(3):before{content:'S'}#about .bridge-card .aboutpillars span:nth-child(4):before{content:'AI'}
.founder{background:#fff!important}.founder .foundergrid{border:1px solid #d7e6da!important;background:#fff!important;box-shadow:0 20px 54px rgba(16,72,134,.10)!important;overflow:hidden!important;align-items:stretch!important}.founder .founderphoto{min-height:430px!important}.founder .founderphoto img{width:100%!important;height:100%!important;min-height:430px!important;object-fit:cover!important;object-position:center top!important}.founder .foundergrid>div:first-child{padding:42px!important}.founder .ey{color:#20a653!important}.founder h2{font-size:clamp(30px,3.4vw,46px)!important;line-height:1.14!important}
@media(max-width:900px){#framework .timeline{grid-template-columns:1fr!important;gap:10px!important}#framework .step{min-height:94px!important;flex-direction:row;justify-content:flex-start;gap:16px;text-align:left}#framework .step:nth-child(3){transform:none}#framework .step h3{white-space:normal}#framework .step:not(:last-child):after{display:none}#about .aboutgrid{grid-template-columns:1fr!important}#about .framework-card .aboutpillars{grid-template-columns:1fr!important}#about .framework-card .aboutpillars span:not(:last-child):after{content:'↓';right:auto;bottom:-15px}#about .bridge-card .aboutpillars{grid-template-columns:repeat(2,1fr)!important}.founder .foundergrid>div:first-child{padding:32px!important}}@media(max-width:620px){#programs .mp-principle{padding:22px 20px}#programs .mp-principle h3{font-size:24px}#framework{padding:72px 0!important}#framework .head .display{font-size:38px!important}#about .bridge-card .aboutpillars{grid-template-columns:1fr!important}.founder .foundergrid>div:first-child{padding:26px 22px!important}}`;d.head.appendChild(s)}
function patchAbout(d){const about=d.querySelector('#about');if(!about)return;const cards=[...about.querySelectorAll('.aboutcard')];if(cards[0]){cards[0].style.display='';cards[0].classList.add('framework-card');const pillars=cards[0].querySelector('.aboutpillars');if(pillars&&pillars.dataset.visual!=='framework'){pillars.innerHTML='<span>Diagnose</span><span>Learn</span><span>Re-Learn</span><span>Re-Act</span><span>Measure</span>';pillars.dataset.visual='framework'}}if(cards[1]){cards[1].style.display='';cards[1].classList.add('bridge-card');const pillars=cards[1].querySelector('.aboutpillars');if(pillars&&pillars.dataset.visual!=='bridge'){pillars.innerHTML='<span>People</span><span>Work</span><span>Service</span><span>AI</span>';pillars.dataset.visual='bridge'}}const injected=about.querySelector('.about-visual-pack');if(injected)injected.remove()}
function apply(){try{const d=f.contentDocument;if(!d?.body||f.contentWindow.location.pathname.includes('/insights'))return;ensureCss(d);const lang=d.body.getAttribute('data-lang')==='en'?'en':'th';const p=d.querySelector('#programs');if(p){let b=p.querySelector('.mp-principle');if(!b){b=d.createElement('div');b.className='mp-principle';const n=p.querySelector('.pricingnote');n?.parentNode?.insertBefore(b,n)}const desired=lang==='th'?'<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>แกนการเรียนรู้ร่วมกัน เชื่อมกับโจทย์ งานจริง และบริบทของแต่ละธุรกิจบริการ</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>':'<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>A shared learning core, adapted to the real work, challenges and context of each service business.</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>';if(b.dataset.lang!==lang){b.innerHTML=desired;b.dataset.lang=lang}}const biz=d.querySelector('#business-specific');if(biz)biz.style.display='none';[...d.querySelectorAll('section')].forEach(x=>{if(x.querySelector('.ey')?.textContent.trim()==='Industries')x.classList.add('struct-hide-industries')});const fw=d.querySelector('#framework');if(fw){const e=fw.querySelector('.head .ey');if(e&&e.textContent!=='RELEARNOS Framework')e.textContent='RELEARNOS Framework';const target=lang==='th'?'จากการมองเห็นจุดเริ่มต้น สู่การเปลี่ยนแปลงที่วัดผลได้':'From the right starting point to measurable change';const t=fw.querySelector('.head .display');if(t&&t.textContent!==target)t.textContent=target;const names=['Diagnose','Learn','Re-Learn','Re-Act','Measure'];[...fw.querySelectorAll('.step')].forEach((x,i)=>{const h=x.querySelector('h3');if(h&&h.textContent!==names[i])h.textContent=names[i];const n=x.querySelector('.num'),nn=String(i+1).padStart(2,'0');if(n&&n.textContent!==nn)n.textContent=nn})}patchAbout(d)}catch(e){}}
f.addEventListener('load',()=>{apply();try{const d=f.contentDocument;const obs=new MutationObserver(m=>{if(m.some(x=>x.type==='attributes'&&x.attributeName==='data-lang'))requestAnimationFrame(apply)});obs.observe(d.body,{attributes:true,attributeFilter:['data-lang']});}catch(e){}});
