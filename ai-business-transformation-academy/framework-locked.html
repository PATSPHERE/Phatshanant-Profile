function patch(){let d;try{d=f.contentDocument}catch(e){return}if(!d?.body)return;const fw=d.querySelector('#framework');if(!fw)return;if(d.getElementById('locked-framework-css')==null){const s=d.createElement('style');s.id='locked-framework-css';s.textContent=`#framework.rf-locked{padding:72px 0 76px!important;background:linear-gradient(180deg,#fffdfa 0%,#f7faf6 100%)!important;border-top:1px solid #e6ece7;border-bottom:1px solid #dfe7e1;color:#123f73!important}.rfl-head{text-align:center;max-width:900px;margin:0 auto 42px}.rfl-head .ey{color:#18874b!important;letter-spacing:.16em;font-weight:700}.rfl-head h2{margin:8px 0 12px;color:#123f73;font-size:clamp(38px,4.2vw,56px);line-height:1.06}.rfl-head p{margin:0 auto;color:#657789;font-size:14px;max-width:760px;line-height:1.7}.rfl-wrap{max-width:1080px;margin:0 auto;position:relative;padding:0 205px 0 20px}.rfl-stages{display:flex;flex-direction:column-reverse;align-items:center;gap:34px;position:relative;z-index:2}.rfl-stage{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:18px;min-height:146px;padding:20px 34px;background:#fff;border:1px solid #dbe5df;box-shadow:0 14px 34px rgba(17,63,115,.06);clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);position:relative}.rfl-stage.s1{width:100%;background:#fbfdfb}.rfl-stage.s2{width:88%;background:#fffaf0}.rfl-stage.s3{width:76%;background:#f4f8fd}.rfl-stage.s4{width:64%;background:#f5faf5}.rfl-icon,.rfl-found span{position:relative;border-radius:50%;background:radial-gradient(circle at 32% 24%,#fff 0 13%,#def7e6 28%,#74d88f 58%,#1b9149 100%);border:1px solid rgba(30,137,72,.28);box-shadow:inset 0 2px 7px rgba(255,255,255,.92),inset 0 -9px 18px rgba(17,123,60,.18),0 10px 22px rgba(17,123,60,.16)}.rfl-icon{width:64px;height:64px;display:grid;place-items:center}.rfl-icon svg,.rfl-found svg{position:relative;z-index:1;fill:none;stroke:#0b6d38;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.rfl-icon svg{width:30px;height:30px}.rfl-headline{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.rfl-stage b{font-size:21px;color:#123f73}.rfl-stage strong{font-size:13px;color:#29445f}.rfl-stage small{display:block;font-size:12px;color:#5f7182;line-height:1.68;margin-top:8px}.rfl-up{position:absolute;left:50%;bottom:-31px;transform:translateX(-50%);width:28px;height:28px}.rfl-up:before{content:'';position:absolute;left:13px;bottom:0;width:3px;height:18px;background:#238e56;border-radius:3px}.rfl-up:after{content:'';position:absolute;left:7px;top:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:10px solid #238e56}.rfl-loop{position:absolute;right:12px;top:42px;width:200px;height:calc(100% - 54px);z-index:3;pointer-events:none}.rfl-loop svg{width:100%;height:100%;overflow:visible}.rfl-loop path{fill:none;stroke:#248958;stroke-width:5;stroke-linecap:round}.rfl-loop polygon{fill:#248958}.rfl-measure{position:absolute;right:0;top:42%;transform:translateY(-50%);width:170px;z-index:4;color:#123f73}.rfl-measure .rfl-icon{width:62px;height:62px;margin-bottom:10px}.rfl-measure b{display:block;color:#18874b;font-size:17px}.rfl-measure strong{display:block;font-size:12px;margin:3px 0 7px}.rfl-measure span{display:block;font-size:10.8px;line-height:1.55;color:#657789}.rfl-feedback{text-align:center;margin:24px auto 0;max-width:620px;color:#607485;font-size:11px;line-height:1.55}.rfl-feedback b{display:block;color:#18874b;font-size:14px;margin-bottom:3px}.rfl-foundbox{max-width:1030px;margin:34px auto 0;padding:24px 26px 20px;background:rgba(255,255,255,.8);border:1px solid #dfe7e1;border-radius:22px}.rfl-foundtitle{text-align:center;color:#18874b;font-size:15px;font-weight:700;margin-bottom:18px}.rfl-found{display:grid;grid-template-columns:repeat(5,1fr)}.rfl-found div{text-align:center;padding:0 10px;border-right:1px solid #e4e9e5}.rfl-found div:last-child{border-right:0}.rfl-found span{width:46px;height:46px;display:grid;place-items:center;margin:0 auto 8px}.rfl-found svg{width:22px;height:22px}.rfl-found b{display:block;color:#172d49;font-size:12px}.rfl-found small{display:block;font-size:9.5px;color:#607485;margin-top:3px}.rfl-note{text-align:center;margin-top:17px;color:#27435e;font-size:11px}@media(max-width:900px){.rfl-head{margin-bottom:32px}.rfl-head h2{font-size:33px}.rfl-wrap{padding:0 82px 0 4px}.rfl-stages{gap:30px}.rfl-stage{grid-template-columns:50px 1fr;gap:11px;min-height:138px;padding:14px 15px}.rfl-stage.s1{width:100%}.rfl-stage.s2{width:94%}.rfl-stage.s3{width:88%}.rfl-stage.s4{width:82%}.rfl-icon{width:46px;height:46px}.rfl-icon svg{width:23px;height:23px}.rfl-stage b{font-size:16px}.rfl-stage strong{font-size:10.8px}.rfl-stage small{font-size:9.8px;line-height:1.55}.rfl-loop{right:3px;top:34px;width:88px;height:calc(100% - 46px)}.rfl-loop path{stroke-width:4}.rfl-measure{right:-3px;top:41%;width:76px}.rfl-measure .rfl-icon{width:40px;height:40px}.rfl-measure b{font-size:11px}.rfl-measure strong{font-size:8px}.rfl-measure span{font-size:7.2px;line-height:1.3}.rfl-feedback{padding:0 24px;font-size:9px}.rfl-foundbox{padding:19px 8px 15px}.rfl-foundtitle{font-size:13px}.rfl-found div{padding:0 2px}.rfl-found span{width:32px;height:32px}.rfl-found svg{width:16px;height:16px}.rfl-found b{font-size:8.5px}.rfl-found small{font-size:6.8px}.rfl-note{font-size:9px}}`;d.head.appendChild(s)}
fw.className='rf-locked';fw.setAttribute('data-framework','locked-redteam-final');fw.innerHTML=`<div class="wrap"><div class="rfl-head"><p class="ey">RELEARNOS FRAMEWORK</p><h2>จากการเรียนรู้ สู่การเปลี่ยนแปลงที่วัดผลได้</h2><p>Framework หลักของ RELEARNOS เชื่อมการเข้าใจจุดเริ่มต้น การพัฒนาคน การปรับวิธีทำงานและบริการ การใช้เทคโนโลยีอย่างเหมาะสม และการนำไปใช้จริงให้เป็นวงจรเดียวกัน</p></div><div class="rfl-wrap"><div class="rfl-loop"><svg viewBox="0 0 200 760" preserveAspectRatio="none"><path d="M40 68 C158 108 174 230 162 356 C151 490 146 602 62 680 C43 697 26 706 14 709"/><polygon points="12,709 31,697 29,719"/></svg></div><div class="rfl-measure"><div class="rfl-icon">${I.measure}</div><b>Measure</b><strong>วัดผลและพัฒนาต่อเนื่อง</strong><span>วัดการเปลี่ยนแปลงที่เกิดขึ้นจริงทั้งด้านคน พฤติกรรมการทำงาน ประสิทธิภาพ คุณภาพบริการ ประสบการณ์ลูกค้า และผลลัพธ์ขององค์กร แล้วนำสิ่งที่เรียนรู้กลับเข้าสู่ Diagnose เพื่อกำหนดการพัฒนารอบถัดไป</span></div><div class="rfl-stages"><div class="rfl-stage s1"><div class="rfl-icon">${I.diagnose}</div><div><div class="rfl-headline"><b>Diagnose</b><strong>— เข้าใจจุดเริ่มต้น</strong></div><small>ประเมินความพร้อมของคน งาน บริการ เทคโนโลยี และบริบทขององค์กร เพื่อเข้าใจสถานะปัจจุบัน เห็นจุดแข็ง ช่องว่าง และประเด็นที่ควรพัฒนา ก่อนออกแบบการเรียนรู้และการเปลี่ยนแปลงที่เหมาะกับแต่ละองค์กร</small></div><span class="rfl-up"></span></div><div class="rfl-stage s2"><div class="rfl-icon">${I.learn}</div><div><div class="rfl-headline"><b>Learn</b><strong>— พัฒนาคนและความสามารถ</strong></div><small>พัฒนาความรู้ ทักษะ วิธีคิด และความมั่นใจที่จำเป็นต่อการทำงานและการบริการในโลกที่เปลี่ยนแปลง โดยเชื่อมการเรียนรู้กับบทบาท งานจริง ลูกค้า เทคโนโลยี และความท้าทายขององค์กร ไม่ใช่การเรียนรู้ที่จบอยู่ในห้องอบรม</small></div><span class="rfl-up"></span></div><div class="rfl-stage s3"><div class="rfl-icon">${I.relearn}</div><div><div class="rfl-headline"><b>Re-Learn</b><strong>— ปรับวิธีคิดและวิธีทำงาน</strong></div><small>กลับมาทบทวนสิ่งที่เคยรู้และวิธีที่เคยทำ เรียนรู้จากประสบการณ์จริง แล้วออกแบบบทบาท วิธีทำงาน Workflow และ Service Experience ใหม่ เพื่อให้คน กระบวนการ และเทคโนโลยีทำงานร่วมกันได้ดีขึ้น</small></div><span class="rfl-up"></span></div><div class="rfl-stage s4"><div class="rfl-icon">${I.react}</div><div><div class="rfl-headline"><b>Re-Act</b><strong>— นำการเรียนรู้ไปสู่การลงมือทำ</strong></div><small>เปลี่ยนความรู้และแนวคิดให้เกิดขึ้นในงานจริง ผ่านการทดลอง ประยุกต์ใช้ และพัฒนาวิธีทำงานร่วมกันในระดับบุคคล ทีม และองค์กร จนการเปลี่ยนแปลงไม่ใช่เพียงสิ่งที่ “เรียนมา” แต่กลายเป็นวิธีที่องค์กรทำงานและส่งมอบบริการ</small></div></div></div><div class="rfl-feedback"><b>Feedback → Diagnose</b>ผลลัพธ์จาก Measure กลับมาเป็นจุดเริ่มต้นของการพัฒนารอบถัดไป</div></div><div class="rfl-foundbox"><div class="rfl-foundtitle">Foundation of the whole system</div><div class="rfl-found"><div><span>${I.people}</span><b>People</b><small>คนและศักยภาพ</small></div><div><span>${I.work}</span><b>Work</b><small>งานและวิธีทำงาน</small></div><div><span>${I.service}</span><b>Service</b><small>บริการและประสบการณ์</small></div><div><span>${I.tech}</span><b>Technology</b><small>เทคโนโลยี</small></div><div><span>${I.org}</span><b>Organization</b><small>บริบทและองค์กร</small></div></div><div class="rfl-note">Transformation moves upward. Measurement brings learning back to the beginning.</div></div></div>`;
}
