;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;margin:-8px 0 2px}.rf-foundation div{text-align:center;color:#445f75;font-size:10px}.rf-foundation span{width:38px;height:38px;display:grid;place-items:center;margin:0 auto 6px}.rf-foundation svg{width:19px;height:19px;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.rf-cycle{position:absolute;inset:0 6px 0 6px;pointer-events:none;z-index:0}.rf-cycle svg{width:100%;height:100%;overflow:visible}.rf-cycle path{fill:none;stroke:#18874b;stroke-width:2;stroke-linecap:round;stroke-dasharray:6 7;opacity:.72}.rf-cycle polygon{fill:#18874b}.rf-cycle-label{position:absolute;right:0;top:42%;transform:translateY(-50%);width:155px;padding:14px 14px 14px 16px;background:rgba(246,251,247,.97);border:1px solid #cfe3d5;border-radius:18px;box-shadow:0 10px 26px rgba(24,135,75,.08);color:#123f73;z-index:2}.rf-cycle-label b{display:block;color:#18874b;font-size:14px;margin-bottom:4px}.rf-cycle-label span{display:block;font-size:10.5px;line-height:1.5;color:#667a89}.rf-cycle-return{position:absolute;left:0;bottom:7%;width:138px;font-size:10px;line-height:1.45;color:#667a89;text-align:right;z-index:2}.rf-cycle-return b{color:#18874b}.rf-measure{margin:30px auto 0;max-width:820px;display:flex;align-items:flex-start;justify-content:center;gap:14px;padding:18px 22px;border-top:1px solid #d8e5e2;color:#123f73}.rf-measure .ico{width:50px;height:50px;display:grid;place-items:center;flex:0 0 auto}.rf-measure svg{width:25px;height:25px;fill:none;stroke-width:1.7}.rf-measure b{font-size:15px}.rf-measure span{display:block;font-size:11.5px;color:#667b8c;margin-top:4px;line-height:1.6}.rf-loop{max-width:760px;margin:8px auto 0;text-align:center;font-size:10px;color:#6c8292}.rf-loop b{color:#18874b}

d.querySelectorAll('#programs .mp-intro-principle').forEach(x=>x.remove());['PATH 01','PATH 02','PATH 03','PATH 04'].forEach((label,i)=>{const el=[...d.querySelectorAll('#programs *')].find(x=>x.children.length===0&&x.textContent.trim()===label);if(!el)return;const card=el.closest('article')||el.parentElement?.parentElement||el.parentElement;if(card&&!card.querySelector('.path-visual-icon')){const ic=d.createElement('div');ic.className='path-visual-icon';ic.innerHTML=pathIcons[i];el.parentElement.insertBefore(ic,el);el.classList.add('path-label-hide')}});
const fw=d.querySelector('#framework');if(fw&&!fw.classList.contains('rf-core')){fw.className='rf-core';fw.innerHTML=`<div class="wrap"><div class="rf-head"><p class="ey">RELEARNOS FRAMEWORK</p><h2>จากการเรียนรู้ สู่การเปลี่ยนแปลงที่วัดผลได้</h2><p>Framework หลักของ RELEARNOS เชื่อมการเข้าใจจุดเริ่มต้น การพัฒนาคน การปรับวิธีทำงานและบริการ การใช้เทคโนโลยีอย่างเหมาะสม และการนำไปใช้จริงให้เป็นวงจรเดียวกัน</p></div><div class="rf-core-wrap"><div class="rf-cycle"><svg viewBox="0 0 1000 740" preserveAspectRatio="none" aria-hidden="true"><path d="M790 90 C925 155 955 300 920 455 C895 565 790 655 625 690 C390 740 160 680 110 565 C75 485 90 405 130 350"/><polygon points="126,350 143,355 134,370"/></svg></div><div class="rf-cycle-label"><b>Measure</b><span>วัดผลจากการเปลี่ยนแปลงจริง แล้วนำ Insight กลับไปใช้พัฒนารอบถัดไป</span></div><div class="rf-cycle-return"><b>Feedback → Diagnose</b><br>ผลลัพธ์ไม่จบที่การวัด แต่กลับมาเป็นจุดเริ่มต้นใหม่</div><div class="rf-pyramid"><div class="rf-tier t1"><div class="rf-tier-icon">${I.diagnose}</div><div><b>Diagnose</b><strong>เข้าใจจุดเริ่มต้น</strong><small>ประเมินความพร้อมของคน งาน บริการ เทคโนโลยี และบริบทขององค์กร เพื่อเข้าใจสถานะปัจจุบัน เห็นจุดแข็ง ช่องว่าง และประเด็นที่ควรพัฒนา ก่อนออกแบบการเรียนรู้และการเปลี่ยนแปลงที่เหมาะกับแต่ละองค์กร</small></div></div><div class="rf-foundation"><div><span>${I.people}</span>People</div><div><span>${I.process}</span>Work</div><div><span>${I.data}</span>Service</div><div><span>${I.tech}</span>Technology</div><div><span>${I.gov}</span>Organization</div></div><div class="rf-tier t2"><div class="rf-tier-icon">${I.learn}</div><div><b>Learn</b><strong>พัฒนาคนและความสามารถ</strong><small>พัฒนาความรู้ ทักษะ วิธีคิด และความมั่นใจที่จำเป็นต่อการทำงานและการบริการในโลกที่เปลี่ยนแปลง โดยเชื่อมการเรียนรู้กับบทบาท งานจริง ลูกค้า เทคโนโลยี และความท้าทายขององค์กร ไม่ใช่การเรียนรู้ที่จบอยู่ในห้องอบรม</small></div></div><div class="rf-tier t3"><div class="rf-tier-icon">${I.relearn}</div><div><b>Re-Learn</b><strong>ปรับวิธีคิดและวิธีทำงาน</strong><small>กลับมาทบทวนสิ่งที่เคยรู้และวิธีที่เคยทำ เรียนรู้จากประสบการณ์จริง แล้วออกแบบบทบาท วิธีทำงาน Workflow และ Service Experience ใหม่ เพื่อให้คน กระบวนการ และเทคโนโลยีทำงานร่วมกันได้ดีขึ้น</small></div></div><div class="rf-tier t4"><div class="rf-tier-icon">${I.react}</div><div><b>Re-Act</b><strong>นำการเรียนรู้ไปสู่การลงมือทำ</strong><small>เปลี่ยนความรู้และแนวคิดให้เกิดขึ้นในงานจริง ผ่านการทดลอง ประยุกต์ใช้ และพัฒนาวิธีทำงานร่วมกันในระดับบุคคล ทีม และองค์กร จนการเปลี่ยนแปลงไม่ใช่เพียงสิ่งที่ “เรียนมา” แต่กลายเป็นวิธีที่องค์กรทำงานและส่งมอบบริการ</small></div></div></div><div class="rf-measure"><div class="ico">${I.measure}</div><div><b>Measure · วัดผลและพัฒนาต่อเนื่อง</b><span>วัดการเปลี่ยนแปลงที่เกิดขึ้นจริงทั้งด้านคน พฤติกรรมการทำงาน ประสิทธิภาพ คุณภาพบริการ ประสบการณ์ลูกค้า และผลลัพธ์ขององค์กร แล้วนำสิ่งที่เรียนรู้กลับเข้าสู่ Diagnose เพื่อกำหนดการพัฒนารอบถัดไป</span></div></div><div class="rf-loop"><b>Diagnose → Learn → Re-Learn → Re-Act → Measure → Diagnose</b></div></div></div>`}
d.querySelectorAll('main svg,section svg').forEach(svg=>{const host=svg.parentElement;if(!host||host.closest('header,nav,.brand,.logo,.lang,.language,.nav-actions,.menu,.cta'))return;const txt=(host.textContent||'').trim();if(txt.length===0||host.classList.contains('path-visual-icon')||host.classList.contains('rf-tier-icon')||host.closest('.rf-foundation')||host.closest('.rf-measure'))host.classList.add('relearn-icon-bubble')});
