<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RELEARNOS | TH Final Review</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="review" src="final-structure.html" title="RELEARNOS Thai Review"></iframe><script>
const outer=document.getElementById('review');
function getDoc(){try{const w=outer.contentWindow;const inner=w.document.getElementById('site');return inner?.contentDocument||null}catch(e){return null}}
const pathIcons=[
`<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 39S8 30 8 18c0-6 7-9 11-5l5 5 5-5c4-4 11-1 11 5 0 12-16 21-16 21z"/><circle cx="24" cy="24" r="3"/></svg>`,
`<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="15"/><circle cx="24" cy="24" r="8"/><path d="M28 20l11-11M34 9h5v5M10 38l8-8"/></svg>`,
`<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="18" cy="16" r="6"/><circle cx="33" cy="19" r="5"/><path d="M6 38c1-9 6-13 12-13s11 4 12 13M29 28c7 0 11 4 12 10M24 8v10"/></svg>`,
`<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="10" width="28" height="28" rx="5"/><path d="M17 24h14M24 17v14M4 18h6M4 30h6M38 18h6M38 30h6M18 4v6M30 4v6M18 38v6M30 38v6"/></svg>`
];
function patch(){const d=getDoc();if(!d?.body)return;
if(d.body.getAttribute('data-lang')==='en'){const th=[...d.querySelectorAll('button,a')].find(x=>x.textContent.trim()==='TH');th?.click();return}
if(!d.getElementById('th-final-visual')){const s=d.createElement('style');s.id='th-final-visual';s.textContent=`
.solution-detail .detail-section{padding:42px 0!important}.solution-detail .detail-split{grid-template-columns:1fr 1fr!important;gap:28px!important}.solution-detail .detail-photo{min-height:300px!important;border-radius:0 54px 0 0!important;box-shadow:none!important}.solution-detail .detail-copy h3{font-size:27px!important;max-width:560px!important}.solution-detail .insight-list{grid-template-columns:repeat(3,1fr)!important;gap:10px!important}.solution-detail .insight-row{display:block!important;min-height:128px!important;padding:18px!important;border:0!important;border-top:4px solid #104886!important;background:#f4f8fc!important}.solution-detail .insight-row b{margin-bottom:15px!important;width:32px!important;height:32px!important}.solution-detail .insight-row span{display:block!important;font-size:13px!important;line-height:1.45!important}.beforeafter{padding:42px 0!important}.ba-grid{gap:8px!important}.ba-box{border:0!important;box-shadow:0 8px 22px rgba(16,72,134,.06)!important}.ba-box p{border:0!important;background:#f6f9fb!important}.approach-band{padding:44px 0!important}.framework-mini span{font-size:11px!important}.related-programmes{padding-top:2px!important}.programme-mini{border:0!important;border-top:4px solid #104886!important}.case-proof{margin-top:8px!important}
/* Master: one master programme -> four friendly learning paths. No extra taxonomy. */
#programs .mp-principle,#programs .mp-intro-principle{display:none!important}.path-visual-icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#f0f6ff;color:#104886;margin:0 0 18px}.path-visual-icon svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.path-card-friendly{transition:transform .18s ease,box-shadow .18s ease!important}.path-card-friendly:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(16,72,134,.08)!important}.path-card-friendly .path-label-hide{display:none!important}
@media(max-width:900px){.solution-detail .detail-split,.solution-detail .insight-list{grid-template-columns:1fr!important}}
`;d.head.appendChild(s)}
// Remove the previous principle/context block entirely in Thai final.
d.querySelectorAll('#programs .mp-intro-principle').forEach(x=>x.remove());
// Replace PATH 01-04 labels with programme icons. Numbers are not a learning sequence.
['PATH 01','PATH 02','PATH 03','PATH 04'].forEach((label,i)=>{const el=[...d.querySelectorAll('#programs *')].find(x=>x.children.length===0&&x.textContent.trim()===label);if(!el)return;const card=el.closest('article')||el.parentElement?.parentElement||el.parentElement;if(card){card.classList.add('path-card-friendly');if(!card.querySelector('.path-visual-icon')){const icon=d.createElement('div');icon.className='path-visual-icon';icon.innerHTML=pathIcons[i];el.parentElement.insertBefore(icon,el)}el.classList.add('path-label-hide')}});
}
function start(){let n=0;const t=setInterval(()=>{patch();if(++n>24)clearInterval(t)},250)}
outer.addEventListener('load',start);start();
</script></body></html>
