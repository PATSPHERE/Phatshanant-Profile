d.querySelectorAll('#programs .mp-intro-principle').forEach(x=>x.remove());['PATH 01','PATH 02','PATH 03','PATH 04'].forEach((label,i)=>{const el=[...d.querySelectorAll('#programs *')].find(x=>x.children.length===0&&x.textContent.trim()===label);if(!el)return;const card=el.closest('article')||el.parentElement?.parentElement||el.parentElement;if(card&&!card.querySelector('.path-visual-icon')){const ic=d.createElement('div');ic.className='path-visual-icon';ic.innerHTML=pathIcons[i];el.parentElement.insertBefore(ic,el);el.classList.add('path-label-hide')}});
const fw=d.querySelector('#framework');if(fw&&!fw.classList.contains('rf-signature')){fw.className='rf-signature';fw.innerHTML=`<div class="wrap"><div class="rf-head"><p class="ey">RELEARNOS FRAMEWORK</p><h2>จากการเรียนรู้ สู่การเปลี่ยนแปลงที่วัดผลได้</h2><p>RELEARNOS เชื่อว่า การพัฒนาคน งาน บริการ และเทคโนโลยี ต้องเริ่มจากการเข้าใจอย่างแท้จริง ลงมือพัฒนาอย่างมีทิศทาง นำไปใช้ในงานจริง วัดผลอย่างเป็นระบบ และเรียนรู้ต่อเนื่องไม่สิ้นสุด</p></div><div class="rf-stage-wrap"><div class="rf-measure-rail"><svg viewBox="0 0 190 760" preserveAspectRatio="none" aria-hidden="true"><path d="M35 65 C150 105 168 220 156 340 C146 460 152 585 58 680 C42 696 28 703 16 706"/><polygon points="13,706 31,694 29,716"/></svg></div><div class="rf-measure-card"><div class="rf-icon">${I.measure}</div><b>Measure</b><strong>วัดผลและพัฒนาต่อเนื่อง</strong><span>วัดการเปลี่ยนแปลงจริงทั้งด้านคน พฤติกรรมการทำงาน ประสิทธิภาพ คุณภาพบริการ ประสบการณ์ลูกค้า และผลลัพธ์ขององค์กร แล้วนำสิ่งที่เรียนรู้กลับเข้าสู่ Diagnose</span></div><div class="rf-stages"><div class="rf-stage s1"><div class="rf-icon">${I.diagnose}</div><div><div class="rf-copy-head"><span class="rf-num">1</span><b>Diagnose</b><strong>— เข้าใจจุดเริ่มต้น</strong></div><small>ประเมินความพร้อมของคน งาน บริการ เทคโนโลยี และบริบทขององค์กร เพื่อเข้าใจสถานะปัจจุบัน เห็นจุดแข็ง ช่องว่าง และประเด็นที่ควรพัฒนา ก่อนออกแบบการเรียนรู้และการเปลี่ยนแปลงที่เหมาะกับแต่ละองค์กร</small></div><span class="rf-up"></span></div><div class="rf-stage s2"><div class="rf-icon">${I.learn}</div><div><div class="rf-copy-head"><span class="rf-num">2</span><b>Learn</b><strong>— พัฒนาคนและความสามารถ</strong></div><small>พัฒนาความรู้ ทักษะ วิธีคิด และความมั่นใจที่จำเป็นต่อการทำงานและการบริการในโลกที่เปลี่ยนแปลง โดยเชื่อมการเรียนรู้กับบทบาท งานจริง ลูกค้า เทคโนโลยี และความท้าทายขององค์กร ไม่ใช่การเรียนรู้ที่จบอยู่ในห้องอบรม</small></div><span class="rf-up"></span></div><div class="rf-stage s3"><div class="rf-icon">${I.relearn}</div><div><div class="rf-copy-head"><span class="rf-num">3</span><b>Re-Learn</b><strong>— ปรับวิธีคิดและวิธีทำงาน</strong></div><small>กลับมาทบทวนสิ่งที่เคยรู้และวิธีที่เคยทำ เรียนรู้จากประสบการณ์จริง แล้วออกแบบบทบาท วิธีทำงาน Workflow และ Service Experience ใหม่ เพื่อให้คน กระบวนการ และเทคโนโลยีทำงานร่วมกันได้ดีขึ้น</small></div><span class="rf-up"></span></div><div class="rf-stage s4"><div class="rf-icon">${I.react}</div><div><div class="rf-copy-head"><span class="rf-num">4</span><b>Re-Act</b><strong>— นำไปใช้ในงานจริง</strong></div><small>เปลี่ยนความรู้และแนวคิดให้เกิดขึ้นในงานจริง ผ่านการทดลอง ประยุกต์ใช้ และพัฒนาวิธีทำงานร่วมกันในระดับบุคคล ทีม และองค์กร จนการเปลี่ยนแปลงไม่ใช่เพียงสิ่งที่ “เรียนมา” แต่กลายเป็นวิธีที่องค์กรทำงานและส่งมอบบริการ</small></div></div></div><div class="rf-feedback"><b>Feedback → Diagnose</b>นำผลลัพธ์และบทเรียนกลับมาวินิจฉัยใหม่ เพื่อกำหนดการพัฒนารอบถัดไปที่แม่นยำกว่าเดิม</div></div><div class="rf-foundation-box"><div class="rf-foundation-title">รากฐานของการเปลี่ยนแปลงที่ยั่งยืน</div><div class="rf-foundation"><div><span>${I.people}</span><b>People</b><small>คนและศักยภาพ</small></div><div><span>${I.process}</span><b>Work</b><small>งานและวิธีทำงาน</small></div><div><span>${I.data}</span><b>Service</b><small>การบริการและประสบการณ์</small></div><div><span>${I.tech}</span><b>Technology</b><small>เทคโนโลยีและนวัตกรรม</small></div><div><span>${I.gov}</span><b>Organization</b><small>โครงสร้าง วัฒนธรรม และกลไกองค์กร</small></div></div><div class="rf-foundation-note">เราเชื่อมทุกองค์ประกอบนี้เข้าด้วยกัน เพื่อสร้างการเปลี่ยนแปลงที่จับต้องได้ และเติบโตอย่างยั่งยืน</div></div><div class="rf-signature-line"><b>“Designed Around Outcomes. Not Training Days.”</b><span>เราออกแบบการเรียนรู้เพื่อให้เกิดผลลัพธ์จริง ไม่ใช่แค่จบคอร์ส</span></div></div>`}
