<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RELEARNOS | Stable Structural Review</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="site" src="./"></iframe><script>const f=document.getElementById('site');function apply(){try{const d=f.contentDocument;if(!d||!d.body||f.contentWindow.location.pathname.includes('/insights'))return;let s=d.getElementById('stable-structure-css');if(!s){s=d.createElement('style');s.id='stable-structure-css';s.textContent=`#business-specific{display:none!important}.struct-hide-industries{display:none!important}#programs .mp-principle{margin:30px 0 0;padding:28px 30px;border:1px solid #cfe5d4;background:linear-gradient(135deg,#fbfdf8,#eef6fb);box-shadow:0 14px 36px rgba(16,72,134,.07)}#programs .mp-principle-ey{margin:0 0 8px;color:#20a653;font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}#programs .mp-principle h3{margin:0;color:#104886;font-size:28px;line-height:1.18}#programs .mp-principle p{margin:10px 0 18px;color:#607083;font-size:15px}#programs .mp-contexts{display:flex;flex-wrap:wrap;gap:8px}#programs .mp-contexts span{padding:6px 11px;border:1px solid #bde4c6;background:#fff;color:#123b67;font-size:12px;font-weight:600}#framework{padding:96px 0!important;background:radial-gradient(circle at 18% 12%,rgba(23,110,184,.48),transparent 34%),radial-gradient(circle at 82% 78%,rgba(32,166,83,.24),transparent 32%),linear-gradient(135deg,#0d315c,#104886 48%,#0b3151)!important}#framework .head{display:block!important;text-align:center;margin:0 auto 52px!important;max-width:900px}#framework .head .ey{color:#9ce4b4!important}#framework .head .display{font-size:clamp(38px,5.2vw,66px)!important;line-height:1.05!important;color:#fff!important}#framework .head>p{display:none!important}#framework .timeline{display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:12px!important;border:0!important}#framework .step{min-height:184px!important;padding:24px 16px!important;border:1px solid rgba(255,255,255,.22)!important;background:rgba(255,255,255,.07)!important;display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center}#framework .step:nth-child(1),#framework .step:nth-child(5){background:rgba(32,166,83,.13)!important}#framework .step:nth-child(3){background:rgba(255,255,255,.13)!important;transform:translateY(-10px)}#framework .step .num{margin:0 0 14px!important;display:grid;place-items:center;width:42px;height:42px;border:1px solid #9ce4b4;border-radius:50%;color:#b9f4c8!important}#framework .step h3{margin:0!important;color:#fff!important;font-size:clamp(18px,1.8vw,25px)!important;white-space:nowrap}#framework .step p{display:none!important}@media(max-width:900px){#framework .timeline{grid-template-columns:1fr!important}#framework .step{min-height:94px!important;flex-direction:row;justify-content:flex-start;gap:16px;text-align:left}#framework .step:nth-child(3){transform:none}#framework .step h3{white-space:normal}}`;d.head.appendChild(s)}const lang=d.body.getAttribute('data-lang')==='en'?'en':'th';const p=d.querySelector('#programs');if(p){let b=p.querySelector('.mp-principle');if(!b){b=d.createElement('div');b.className='mp-principle';const n=p.querySelector('.pricingnote');n?.parentNode?.insertBefore(b,n)}b.innerHTML=lang==='th'?'<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>แกนการเรียนรู้ร่วมกัน เชื่อมกับโจทย์ งานจริง และบริบทของแต่ละธุรกิจบริการ</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>':'<div class="mp-principle-ey">Master Programme Principle</div><h3>One Core. Different Service Contexts.</h3><p>A shared learning core, adapted to the real work, challenges and context of each service business.</p><div class="mp-contexts"><span>Property &amp; Place Management</span><span>Hospitality &amp; Experience</span><span>Healthcare &amp; Care Services</span><span>Professional Services</span></div>'}const biz=d.querySelector('#business-specific');if(biz)biz.style.display='none';[...d.querySelectorAll('section')].forEach(x=>{if(x.querySelector('.ey')?.textContent.trim()==='Industries')x.classList.add('struct-hide-industries')});const fw=d.querySelector('#framework');if(fw){const e=fw.querySelector('.head .ey');if(e)e.textContent='RELEARNOS Framework';const t=fw.querySelector('.head .display');if(t)t.textContent=lang==='th'?'จากการมองเห็นจุดเริ่มต้น สู่การเปลี่ยนแปลงที่วัดผลได้':'From the right starting point to measurable change';const names=['Diagnose','Learn','Re-Learn','Re-Act','Measure'];[...fw.querySelectorAll('.step')].forEach((x,i)=>{const h=x.querySelector('h3');if(h)h.textContent=names[i];const n=x.querySelector('.num');if(n)n.textContent=String(i+1).padStart(2,'0')})}}catch(e){}}f.addEventListener('load',()=>{apply();try{const d=f.contentDocument;new MutationObserver(apply).observe(d.body,{attributes:true,attributeFilter:['data-lang']});d.addEventListener('click',()=>setTimeout(apply,60),true)}catch(e){}});</script></body></html>
