<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Section 4 · Document Knowledge + AI Guided Demo | RELEARN OS × QPM</title>
<style>
:root{--blue:#1767d1;--cyan:#2db8d8;--green:#35ad62;--ink:#17345b;--muted:#64748b;--line:#d9e8f1;--bg:#eef7fb;--warn:#fff5d6}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}body{overflow:hidden}
.shell{height:100vh;display:grid;grid-template-rows:68px 1fr 64px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-weight:900;font-size:22px}.brand .r{color:var(--blue)}.brand .o{color:var(--green)}
.badge{margin-left:12px;padding:7px 10px;border-radius:999px;background:#eaf3ff;color:var(--blue);font-size:11px;font-weight:900}
main{display:grid;grid-template-columns:minmax(650px,1.35fr) minmax(340px,.65fr);gap:18px;padding:18px 22px;min-height:0}
.sim,.guide{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 38px rgba(30,69,110,.10);overflow:hidden}
.sim{display:grid;grid-template-rows:48px 1fr}.simhead{display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-size:12px;background:#fbfdff}
.stage{position:relative;background:linear-gradient(135deg,#f6fbff,#eef8fc);padding:18px;overflow:auto}
.window{width:min(100%,1080px);height:610px;margin:auto;background:#fff;border:1px solid #dfe7ee;border-radius:18px;overflow:hidden;box-shadow:0 18px 48px rgba(20,42,68,.14);display:grid;grid-template-columns:250px 1fr}
.sidebar{background:#f8fbfd;border-right:1px solid #e6edf2;padding:16px}.appLogo{font-weight:900;color:#1c4b77;font-size:20px;margin-bottom:18px}.new{background:#1767d1;color:#fff;padding:11px 13px;border-radius:12px;font-weight:800;font-size:12px;margin-bottom:12px}
.menu{padding:9px 10px;border-radius:10px;font-size:12px;color:#496075}.menu.active{background:#eaf3ff;color:#1767d1;font-weight:800}
.content{display:grid;grid-template-rows:58px 1fr}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e7edf2}.toolbar b{font-size:14px}.workspace{position:relative;padding:22px;overflow:auto}
.card{border:1px solid #e0e7ee;border-radius:16px;padding:16px;background:#fff}.meta{font-size:11px;color:#6b7c8e;margin-bottom:10px}.body{font-size:13px;line-height:1.65;color:#34495e}
.ai{margin-top:16px;border:1px solid #d7e4ed;border-radius:16px;padding:16px;background:#fbfdff}.ai h3{margin:0 0 10px;font-size:15px}.prompt{background:#f6f9fc;border:1px solid #dce5eb;border-radius:12px;padding:12px;font-size:12px;line-height:1.6;color:#42576c}.output{margin-top:12px;background:#fff;border:1px dashed #cbdbe7;border-radius:12px;padding:12px;font-size:12px;line-height:1.65;color:#31465d}
.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.doc{border:1px solid #dfe7ee;border-radius:12px;padding:12px;background:#fff}.doc b{font-size:12px;color:#1767d1}.doc p{font-size:10.5px;color:#65778a;margin:5px 0 0;line-height:1.5}
.source{font-size:10px;color:#1767d1;font-weight:800;margin-top:6px}.qa{display:grid;gap:10px}.q{background:#f5f9fc;border:1px solid #dae6ef;border-radius:12px;padding:11px;font-size:11px}.a{background:#fff;border:1px solid #dce5eb;border-radius:12px;padding:11px;font-size:11px;line-height:1.6}
.table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}.table th,.table td{border:1px solid #dfe7ee;padding:8px;text-align:left;vertical-align:top}.table th{background:#f4f8fb}
.spot{position:absolute;border:4px solid #27aa5f;border-radius:14px;box-shadow:0 0 0 5px rgba(39,170,95,.12);display:none;z-index:50;pointer-events:none}.spotnum{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:none;place-items:center;font-size:12px;font-weight:900;z-index:51}
.guide{padding:20px;display:flex;flex-direction:column}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--blue)}.guide h2{font-size:25px;line-height:1.25;margin:7px 0 8px}.guide p{font-size:12px;line-height:1.65;color:#5f7185;margin:0}
.info{margin-top:12px;border:1px solid var(--line);background:#f5f9fc;border-radius:15px;padding:12px}.info b{display:block;color:var(--blue);font-size:11px;margin-bottom:4px}.human{background:var(--warn);border-color:#ecd98a}.human b{color:#9b6a00}.next{background:#eef9f4;border-color:#cfe8d6}.next b{color:var(--green)}
footer{display:flex;align-items:center;justify-content:space-between;padding:9px 22px;background:#fff;border-top:1px solid var(--line)}.controls{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:12px}.primary{background:linear-gradient(90deg,var(--blue),var(--cyan));color:#fff}.secondary{background:#edf3f7;color:#35485d}.progress{font-size:11px;color:#687b8f;text-align:center}.bar{width:220px;height:7px;background:#e2ebf1;border-radius:999px;overflow:hidden;margin-top:4px}.bar>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:16.6%}.note{font-size:10px;color:#748599}
@media(max-width:980px){body{overflow:auto}.shell{height:auto;grid-template-rows:auto auto auto}main{grid-template-columns:1fr}.stage{min-height:720px}.window{transform:scale(.82);transform-origin:top center}}
</style></head><body><div class="shell">
<header><div><span class="brand"><span class="r">RELEARN</span> <span class="o">OS</span></span><span class="badge">SECTION 4 · REAL WORK USE CASE</span></div><div><b>Document Knowledge + AI Guided Demo</b><br><small>จากเอกสารจำนวนมาก → ฐานความรู้ที่ถามได้</small></div></header>
<main><section class="sim"><div class="simhead"><b id="simTitle"></b><span>Interactive Simulation · Knowledge Base Thinking</span></div><div class="stage" id="stage"></div></section>
<aside class="guide"><div class="eyebrow" id="eyebrow"></div><h2 id="title"></h2><p id="body"></p><div class="info"><b>สิ่งที่ต้องจำ</b><p id="memory"></p></div><div class="info human"><b>Human Check</b><p id="human"></p></div><div class="info next"><b>ถัดไปคืออะไร</b><p id="nextText"></p></div></aside></main>
<footer><div class="controls"><button class="btn secondary" id="prev">← ก่อนหน้า</button><button class="btn primary" id="next">ถัดไป →</button><button class="btn secondary" id="reset">เริ่มใหม่</button></div><div class="progress"><div id="count"></div><div class="bar"><div id="fill"></div></div></div><div class="note">RELEARN OS · Documents → Scope → Ask → Cite → Synthesize → Human Approval</div></footer>
</div>
<script>
const $=id=>document.getElementById(id);
function shell(inner){return '<div class="window"><aside class="sidebar"><div class="appLogo">Knowledge Workspace</div><div class="new">＋ Add sources</div><div class="menu active">Sources</div><div class="menu">Ask</div><div class="menu">Notes</div><div class="menu">Saved Answers</div></aside><section class="content"><div class="toolbar"><b>Property Knowledge Base</b><span>6 sources</span></div><div class="workspace">'+inner+'</div></section></div><div class="spot" id="spot"></div><div class="spotnum" id="spotnum"></div>'}
const docs='<div class="card" id="docSet"><div class="meta">ตัวอย่างเอกสารที่ใช้ได้</div><div class="docs"><div class="doc"><b>SOP-OPS-01</b><p>SOP การรับแจ้งเหตุและส่งต่องาน</p></div><div class="doc"><b>BUILDING-MANUAL</b><p>คู่มืออาคารและระบบส่วนกลาง</p></div><div class="doc"><b>CONDO-RULES</b><p>กฎและข้อบังคับอาคารชุด</p></div><div class="doc"><b>FORM-INCIDENT</b><p>แบบฟอร์มบันทึกเหตุการณ์</p></div><div class="doc"><b>VENDOR-SLA</b><p>เงื่อนไขและ SLA ผู้รับเหมา</p></div><div class="doc"><b>MONTHLY-REPORT</b><p>รายงานการดำเนินงานเดือนล่าสุด</p></div></div></div>';
const steps=[
{sim:"Step 1 · Documents",eye:"USE CASE 1/6",title:"เริ่มจากชุดเอกสารที่เชื่อถือได้",body:"รวบรวม SOP คู่มือ กฎ แบบฟอร์ม และรายงานที่เป็นแหล่งจริงก่อนสร้างฐานความรู้",memory:"คุณภาพคำตอบขึ้นกับคุณภาพและเวอร์ชันของเอกสารต้นทาง",human:"ตรวจว่าเอกสารเป็นฉบับล่าสุด มีสิทธิ์ใช้งาน และไม่มีข้อมูลเกินความจำเป็น",next:"กำหนด Scope",view:"docs",target:"docSet"},
{sim:"Step 2 · Scope",eye:"USE CASE 2/6",title:"กำหนดขอบเขตให้ AI ตอบจากเอกสารเท่านั้น",body:"บอก AI ชัดว่าต้องตอบจาก Source ที่ให้ และถ้าไม่พบข้อมูลต้องบอกว่าไม่พบ",memory:"Knowledge Base ที่ดีไม่ควรทำให้ผู้ใช้เข้าใจว่าคำตอบทุกอย่างเป็นข้อเท็จจริง",human:"อย่าให้ AI ใช้ความรู้ภายนอกมาปะปนกับข้อกำหนดภายในองค์กรโดยไม่ระบุ",next:"ถามคำถามจริง",view:"scope",target:"scopeBox"},
{sim:"Step 3 · Ask",eye:"USE CASE 3/6",title:"ถามด้วยคำถามที่คนทำงานใช้จริง",body:"ใช้คำถาม เช่น ข้อกำหนดคืออะไร ขั้นตอนถูกต้องคืออะไร หรือ ต้องใช้เอกสารไหน",memory:"คำถามควรเฉพาะเจาะจงพอให้ตรวจคำตอบย้อนกลับได้",human:"คำถามด้านกฎหมาย ความปลอดภัย หรือข้อยกเว้นต้องตรวจเอกสารต้นฉบับเสมอ",next:"ดูคำตอบพร้อม Citation",view:"ask",target:"askBox"},
{sim:"Step 4 · Cite",eye:"USE CASE 4/6",title:"คำตอบต้องมีแหล่งอ้างอิง",body:"ให้ AI ชี้ว่าคำตอบมาจากเอกสารไหน และส่วนใด เพื่อให้คนเปิดตรวจได้",memory:"Citation ทำให้คำตอบตรวจสอบได้ ไม่ใช่แค่ฟังดูน่าเชื่อถือ",human:"เปิด Source จริงเพื่อตรวจข้อความสำคัญก่อนนำไปใช้",next:"สังเคราะห์หลายเอกสาร",view:"cite",target:"citeBox"},
{sim:"Step 5 · Synthesize",eye:"USE CASE 5/6",title:"รวมหลายเอกสารเป็นคำตอบที่ใช้งานได้",body:"AI ช่วยเชื่อม SOP + กฎ + แบบฟอร์ม เพื่อสรุปขั้นตอนและเอกสารที่ต้องใช้",memory:"Synthesis มีไว้ลดเวลาค้นหา ไม่ได้แทนการอนุมัติของคนรับผิดชอบ",human:"ถ้าเอกสารขัดกัน ให้หยุดและยกระดับให้เจ้าของกระบวนการตัดสิน",next:"Human Approval",view:"synth",target:"synthBox"},
{sim:"Step 6 · Human Approval",eye:"USE CASE 6/6",title:"ตรวจและอนุมัติก่อนใช้จริง",body:"ก่อนใช้คำตอบกับลูกบ้าน ทีมงาน หรือ Vendor ให้ผู้รับผิดชอบตรวจ Source และบริบท",memory:"AI ช่วยค้นและสรุป แต่ Authority ยังอยู่ที่เอกสารและคนอนุมัติ",human:"Version • Source • Context • Conflict • Approval",next:"พร้อมใช้เป็น Knowledge Base",view:"final",target:"finalBox"}
];
function renderStage(s){
let inner=docs;
if(s.view==="scope") inner+='<div class="ai" id="scopeBox"><h3>Source-grounded Prompt</h3><div class="prompt">ตอบคำถามของฉันโดยใช้ “เฉพาะเอกสารใน Knowledge Base นี้” เท่านั้น<br><br>ทุกคำตอบต้อง:<br>• ระบุชื่อเอกสารที่อ้างอิง<br>• ถ้าไม่พบ ให้ตอบว่า “ไม่พบข้อมูลในเอกสาร”<br>• ถ้าเอกสารขัดกัน ให้ระบุว่ามี Conflict<br>• ห้ามเดาหรือเติมข้อมูลจากภายนอก</div></div>';
if(s.view==="ask") inner+='<div class="ai" id="askBox"><h3>คำถามตัวอย่าง</h3><div class="qa"><div class="q"><b>Q1:</b> ถ้าลูกบ้านแจ้งเหตุหลังเวลาทำการ ขั้นตอนแรกที่ถูกต้องคืออะไร?</div><div class="q"><b>Q2:</b> เหตุประเภทใดต้องบันทึก Incident Form?</div><div class="q"><b>Q3:</b> ถ้าต้องส่งต่อ Vendor ต้องตรวจ SLA จุดไหนบ้าง?</div></div></div>';
if(s.view==="cite") inner+='<div class="ai" id="citeBox"><h3>Answer + Citation</h3><div class="a"><b>คำตอบ:</b> หลังเวลาทำการ ให้รับแจ้งเหตุ เก็บข้อมูลสำคัญ และประเมินระดับความเร่งด่วนก่อนส่งต่อทีมที่เกี่ยวข้อง<div class="source">Source: SOP-OPS-01 · ขั้นตอนรับแจ้งเหตุ / BUILDING-MANUAL · Emergency Contact</div></div></div>';
if(s.view==="synth") inner+='<div class="ai" id="synthBox"><h3>Cross-document Synthesis</h3><table class="table"><tr><th>สิ่งที่ต้องทำ</th><th>อ้างอิง</th><th>สิ่งที่ต้องตรวจ</th></tr><tr><td>รับแจ้งและบันทึกข้อมูล</td><td>SOP-OPS-01</td><td>ข้อมูลครบ/ระดับความเร่งด่วน</td></tr><tr><td>บันทึก Incident เมื่อเข้าเกณฑ์</td><td>FORM-INCIDENT</td><td>ประเภทเหตุและรายละเอียด</td></tr><tr><td>ส่งต่อ Vendor ตาม SLA</td><td>VENDOR-SLA</td><td>Response time / Scope</td></tr></table><div class="output"><b>Open Question:</b> หาก SLA กับ SOP กำหนดเวลาไม่ตรงกัน ต้องให้เจ้าของกระบวนการยืนยันก่อนใช้</div></div>';
if(s.view==="final") inner+='<div class="ai" id="finalBox"><h3>Human Approval Checklist</h3><div class="output">✓ เอกสารเป็นเวอร์ชันล่าสุด<br>✓ Citation เปิดตรวจได้<br>✓ คำตอบไม่สรุปเกิน Source<br>✓ ไม่มี Conflict ที่ยังไม่ได้แก้<br>✓ เรื่องกฎหมาย/ข้อบังคับตรวจต้นฉบับแล้ว<br>✓ ผู้รับผิดชอบอนุมัติก่อนใช้งานจริง</div></div>';
$("stage").innerHTML=shell(inner);setTimeout(()=>spotlight(s.target),80)
}
function spotlight(id){
  const el=$(id),stage=$("stage");if(!el)return;
  el.scrollIntoView({block:"center",inline:"nearest"});
  setTimeout(()=>{const st=stage.getBoundingClientRect(),r=el.getBoundingClientRect(),sp=$("spot"),n=$("spotnum");const left=r.left-st.left+stage.scrollLeft-5,top=r.top-st.top+stage.scrollTop-5;sp.style.left=left+"px";sp.style.top=top+"px";sp.style.width=(r.width+10)+"px";sp.style.height=(r.height+10)+"px";sp.style.display="block";n.style.left=Math.max(6,left-14)+"px";n.style.top=Math.max(6,top-14)+"px";n.style.display="grid";n.textContent=i+1},60)
}
let i=0;function render(){const s=steps[i];$("simTitle").textContent=s.sim;$("eyebrow").textContent=s.eye;$("title").textContent=s.title;$("body").textContent=s.body;$("memory").textContent=s.memory;$("human").textContent=s.human;$("nextText").textContent=s.next;$("count").textContent=(i+1)+" / "+steps.length;$("fill").style.width=((i+1)/steps.length*100)+"%";$("prev").disabled=i===0;$("next").textContent=i===steps.length-1?"จบ Demo ✓":"ถัดไป →";renderStage(s)}
$("next").onclick=()=>{if(i<steps.length-1){i++;render()}};$("prev").onclick=()=>{if(i>0){i--;render()}};$("reset").onclick=()=>{i=0;render()};document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&i<steps.length-1){i++;render()}if(e.key==="ArrowLeft"&&i>0){i--;render()}});render();
</script></body></html>
