<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Section 4 · Incident + QAQC Guided Demo | RELEARN OS × QPM</title>
<style>
:root{--blue:#1767d1;--cyan:#2db8d8;--green:#35ad62;--ink:#17345b;--muted:#64748b;--line:#d9e8f1;--bg:#eef7fb;--warn:#fff5d6}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}body{overflow:hidden}
.shell{height:100vh;display:grid;grid-template-rows:68px 1fr 64px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-weight:900;font-size:22px}.brand .r{color:var(--blue)}.brand .o{color:var(--green)}
.badge{margin-left:12px;padding:7px 10px;border-radius:999px;background:#eaf3ff;color:var(--blue);font-size:11px;font-weight:900}
main{display:grid;grid-template-columns:minmax(650px,1.35fr) minmax(340px,.65fr);gap:18px;padding:18px 22px;min-height:0}
.sim,.guide{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 38px rgba(30,69,110,.10);overflow:hidden}
.sim{display:grid;grid-template-rows:48px 1fr}.simhead{display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-size:12px;background:#fbfdff}
.stage{position:relative;background:linear-gradient(135deg,#f6fbff,#eef8fc);padding:18px;overflow:auto}
.window{width:min(100%,1080px);height:610px;margin:auto;background:#fff;border:1px solid #dfe7ee;border-radius:18px;overflow:hidden;box-shadow:0 18px 48px rgba(20,42,68,.14);display:grid;grid-template-columns:250px 1fr}
.sidebar{background:#f8fbfd;border-right:1px solid #e6edf2;padding:16px}.appLogo{font-weight:900;color:#1c4b77;font-size:20px;margin-bottom:18px}.new{background:#1767d1;color:#fff;padding:11px 13px;border-radius:12px;font-weight:800;font-size:12px;margin-bottom:12px}
.menu{padding:9px 10px;border-radius:10px;font-size:12px;color:#496075}.menu.active{background:#eaf3ff;color:#1767d1;font-weight:800}
.content{display:grid;grid-template-rows:58px 1fr}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e7edf2}.toolbar b{font-size:14px}.workspace{position:relative;padding:22px;overflow:auto}
.card{border:1px solid #e0e7ee;border-radius:16px;padding:16px;background:#fff}.meta{font-size:11px;color:#6b7c8e;margin-bottom:10px}.body{font-size:13px;line-height:1.65;color:#34495e}
.ai{margin-top:16px;border:1px solid #d7e4ed;border-radius:16px;padding:16px;background:#fbfdff}.ai h3{margin:0 0 10px;font-size:15px}.prompt{background:#f6f9fc;border:1px solid #dce5eb;border-radius:12px;padding:12px;font-size:12px;line-height:1.6;color:#42576c}.output{margin-top:12px;background:#fff;border:1px dashed #cbdbe7;border-radius:12px;padding:12px;font-size:12px;line-height:1.65;color:#31465d}
.table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}.table th,.table td{border:1px solid #dfe7ee;padding:8px;text-align:left;vertical-align:top}.table th{background:#f4f8fb}
.status{display:inline-block;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900}.high{background:#ffe9e9;color:#b83232}.med{background:#fff4d7;color:#9b6a00}.ok{background:#eaf8ef;color:#23884a}
.spot{position:absolute;border:4px solid #27aa5f;border-radius:14px;box-shadow:0 0 0 5px rgba(39,170,95,.12);display:none;z-index:50;pointer-events:none}.spotnum{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:none;place-items:center;font-size:12px;font-weight:900;z-index:51}
.guide{padding:20px;display:flex;flex-direction:column}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--blue)}.guide h2{font-size:25px;line-height:1.25;margin:7px 0 8px}.guide p{font-size:12px;line-height:1.65;color:#5f7185;margin:0}
.info{margin-top:12px;border:1px solid var(--line);background:#f5f9fc;border-radius:15px;padding:12px}.info b{display:block;color:var(--blue);font-size:11px;margin-bottom:4px}.human{background:var(--warn);border-color:#ecd98a}.human b{color:#9b6a00}.next{background:#eef9f4;border-color:#cfe8d6}.next b{color:var(--green)}
footer{display:flex;align-items:center;justify-content:space-between;padding:9px 22px;background:#fff;border-top:1px solid var(--line)}.controls{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:12px}.primary{background:linear-gradient(90deg,var(--blue),var(--cyan));color:#fff}.secondary{background:#edf3f7;color:#35485d}.progress{font-size:11px;color:#687b8f;text-align:center}.bar{width:220px;height:7px;background:#e2ebf1;border-radius:999px;overflow:hidden;margin-top:4px}.bar>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:16.6%}.note{font-size:10px;color:#748599}
@media(max-width:980px){body{overflow:auto}.shell{height:auto;grid-template-rows:auto auto auto}main{grid-template-columns:1fr}.stage{min-height:720px}.window{transform:scale(.82);transform-origin:top center}}
</style></head><body><div class="shell">
<header><div><span class="brand"><span class="r">RELEARN</span> <span class="o">OS</span></span><span class="badge">SECTION 4 · REAL WORK USE CASE</span></div><div><b>Incident + QAQC Guided Demo</b><br><small>เหตุการณ์ → บันทึกข้อมูล → AI จัดรูป → คนตัดสินใจ</small></div></header>
<main><section class="sim"><div class="simhead"><b id="simTitle"></b><span>Interactive Simulation · Safe & Responsible Workflow</span></div><div class="stage" id="stage"></div></section>
<aside class="guide"><div class="eyebrow" id="eyebrow"></div><h2 id="title"></h2><p id="body"></p><div class="info"><b>สิ่งที่ต้องจำ</b><p id="memory"></p></div><div class="info human"><b>Human Check</b><p id="human"></p></div><div class="info next"><b>ถัดไปคืออะไร</b><p id="nextText"></p></div></aside></main>
<footer><div class="controls"><button class="btn secondary" id="prev">← ก่อนหน้า</button><button class="btn primary" id="next">ถัดไป →</button><button class="btn secondary" id="reset">เริ่มใหม่</button></div><div class="progress"><div id="count"></div><div class="bar"><div id="fill"></div></div></div><div class="note">RELEARN OS · Incident → Record → Structure → QAQC → Human Decision</div></footer>
</div>
<script>
const $=id=>document.getElementById(id);
function shell(inner){return '<div class="window"><aside class="sidebar"><div class="appLogo">Incident Workspace</div><div class="new">＋ New incident</div><div class="menu active">Incident Log</div><div class="menu">QAQC</div><div class="menu">Communication</div><div class="menu">Evidence</div><div class="menu">Archive</div></aside><section class="content"><div class="toolbar"><b>Incident #PM-2026-0922</b><span>Property Operations</span></div><div class="workspace">'+inner+'</div></section></div><div class="spot" id="spot"></div><div class="spotnum" id="spotnum"></div>'}
const base='<div class="card" id="incident"><div class="meta">ตัวอย่างเหตุการณ์</div><div class="body"><b>เหตุ:</b> น้ำรั่วบริเวณโถงชั้น 8<br><b>เวลา:</b> 09:20<br><b>สถานที่:</b> อาคาร B ชั้น 8<br><b>ผู้พบเหตุ:</b> เจ้าหน้าที่อาคาร<br><b>สถานะเบื้องต้น:</b> ปิดวาล์วเฉพาะจุดแล้ว พื้นที่เปียกและกั้นพื้นที่ไว้<br><b>หลักฐาน:</b> ภาพถ่าย 3 ภาพ / CCTV ช่วงเวลาเกิดเหตุ</div></div>';
const steps=[
{sim:"Step 1 · Incident",eye:"USE CASE 1/6",title:"เริ่มจากเหตุการณ์จริง",body:"บันทึกสิ่งที่เกิดขึ้นตามข้อเท็จจริงก่อน ไม่รีบสรุปสาเหตุ",memory:"แยก Facts ออกจาก Assumptions ให้ชัด",human:"ความปลอดภัยมาก่อน AI เสมอ หากเป็นเหตุฉุกเฉินให้ทำตาม SOP ทันที",next:"จัดข้อมูลให้ครบ",view:"incident",target:"incident"},
{sim:"Step 2 · Record",eye:"USE CASE 2/6",title:"เก็บข้อมูลให้เป็นโครงสร้าง",body:"เวลา สถานที่ ผู้เกี่ยวข้อง ภาพถ่าย การตอบสนองเบื้องต้น และความเสี่ยง ต้องถูกบันทึกให้ครบ",memory:"ข้อมูลครบช่วยให้ QAQC และการสื่อสารภายหลังแม่นขึ้น",human:"หลีกเลี่ยงข้อมูลส่วนบุคคลที่ไม่จำเป็น และเก็บหลักฐานตามสิทธิ์ที่เหมาะสม",next:"ให้ AI ช่วยจัดรูป",view:"record",target:"recordBox"},
{sim:"Step 3 · Structure",eye:"USE CASE 3/6",title:"AI ช่วยจัดรูป Incident Report",body:"AI ช่วยสรุป Chronology, Severity, Immediate Action และ Open Questions จากข้อมูลที่มี",memory:"AI ช่วยจัดระเบียบข้อมูล ไม่ใช่ตัดสินความผิดหรือสาเหตุ",human:"ถ้าข้อมูลไม่พอ ให้ระบุว่า “ยังสรุปไม่ได้”",next:"QAQC",view:"structure",target:"structureBox"},
{sim:"Step 4 · QAQC",eye:"USE CASE 4/6",title:"ตรวจคุณภาพก่อนสื่อสารหรือส่งต่อ",body:"เช็กความครบ ความสอดคล้องของเวลา หลักฐาน ภาษา และสิ่งที่ยังต้องยืนยัน",memory:"QAQC = ตรวจความถูกต้องและความพร้อมของข้อมูลก่อนใช้จริง",human:"ห้ามแก้ข้อเท็จจริงเพื่อให้รายงานดูเรียบร้อยขึ้น",next:"Draft Communication",view:"qaqc",target:"qaqcBox"},
{sim:"Step 5 · Communication",eye:"USE CASE 5/6",title:"AI ช่วยร่างการสื่อสาร แต่คนกำหนดข้อความสุดท้าย",body:"ใช้ AI ร่างข้อความสำหรับผู้เกี่ยวข้อง โดยบอกเฉพาะสิ่งที่ยืนยันได้และสิ่งที่กำลังดำเนินการ",memory:"แยก Internal Report กับ Resident Communication ออกจากกัน",human:"ห้ามเปิดเผยข้อมูลส่วนบุคคล สาเหตุที่ยังไม่ยืนยัน หรือคำรับผิดก่อนอนุมัติ",next:"Human Decision",view:"comms",target:"commsBox"},
{sim:"Step 6 · Human Decision",eye:"USE CASE 6/6",title:"คนยังเป็นผู้ตัดสินใจ",body:"ผู้รับผิดชอบตรวจ SOP กฎหมาย ผู้อนุมัติ และแนวทางดูแลลูกบ้านก่อนดำเนินการขั้นต่อไป",memory:"Incident ใช้ AI ได้เมื่อข้อมูลครบ กรอบชัด และคนรับผิดชอบยังเป็นผู้ตัดสินใจ",human:"Safety • SOP • Law • Evidence • Approval • Communication",next:"พร้อมส่งต่อ Section 5 Safe & Responsible",view:"final",target:"finalBox"}
];
function renderStage(s){
let inner=base;
if(s.view==="record") inner+='<div class="ai" id="recordBox"><h3>Structured Incident Data</h3><table class="table"><tr><th>Field</th><th>Recorded</th></tr><tr><td>เวลา / สถานที่</td><td>09:20 · อาคาร B ชั้น 8</td></tr><tr><td>ผู้พบเหตุ</td><td>เจ้าหน้าที่อาคาร</td></tr><tr><td>Immediate Action</td><td>ปิดวาล์วเฉพาะจุด / กั้นพื้นที่</td></tr><tr><td>Evidence</td><td>ภาพถ่าย 3 ภาพ / CCTV</td></tr><tr><td>Risk</td><td>พื้นลื่น / ความเสียหายเพิ่มเติม</td></tr></table></div>';
if(s.view==="structure") inner+='<div class="ai" id="structureBox"><h3>AI Incident Summary</h3><div class="output"><b>Chronology:</b> 09:20 พบเหตุ → ปิดวาล์วเฉพาะจุด → กั้นพื้นที่ → เก็บภาพหลักฐาน<br><b>Severity:</b> <span class="status med">ต้องประเมินเพิ่ม</span><br><b>Immediate Action:</b> ควบคุมพื้นที่และหยุดการรั่วเบื้องต้น<br><b>Open Questions:</b> จุดต้นเหตุคืออะไร? มีห้องหรือระบบใดได้รับผลกระทบเพิ่มหรือไม่?<br><b>สาเหตุ:</b> ยังสรุปไม่ได้จากข้อมูลปัจจุบัน</div></div>';
if(s.view==="qaqc") inner+='<div class="ai" id="qaqcBox"><h3>QAQC Checklist</h3><div class="output">✓ เวลาและลำดับเหตุการณ์สอดคล้องกัน<br>✓ สถานที่และผู้พบเหตุชัดเจน<br>✓ มีหลักฐานอ้างอิง<br>✓ แยก Facts / Assumptions แล้ว<br>△ ต้องยืนยัน Severity<br>△ ต้องตรวจ SOP การแจ้งเหตุและ escalation<br>△ ต้องยืนยันสาเหตุก่อนสื่อสารเป็นข้อเท็จจริง</div></div>';
if(s.view==="comms") inner+='<div class="ai" id="commsBox"><h3>Draft Communication</h3><div class="prompt">ร่างข้อความแจ้งผู้เกี่ยวข้องโดยใช้เฉพาะข้อเท็จจริงที่ยืนยันแล้ว ห้ามระบุสาเหตุที่ยังไม่ทราบ และห้ามรับปากเรื่องชดเชย</div><div class="output">ขณะนี้ฝ่ายอาคารได้รับแจ้งเหตุและได้ดำเนินการควบคุมพื้นที่เบื้องต้นแล้ว ทีมที่เกี่ยวข้องกำลังตรวจสอบสาเหตุและขอบเขตผลกระทบเพิ่มเติม หากมีข้อมูลที่ยืนยันได้เพิ่มเติม จะมีการแจ้งให้ทราบตามลำดับค่ะ</div></div>';
if(s.view==="final") inner+='<div class="ai" id="finalBox"><h3>Human Decision Gate</h3><table class="table"><tr><th>ตรวจ</th><th>ผู้ตัดสินใจ</th></tr><tr><td>Safety / Escalation</td><td>ผู้จัดการอาคาร / ทีมเทคนิค</td></tr><tr><td>SOP / กฎหมาย / ประกัน</td><td>ผู้รับผิดชอบตามนโยบายองค์กร</td></tr><tr><td>ข้อความถึงลูกบ้าน</td><td>ผู้มีอำนาจอนุมัติการสื่อสาร</td></tr><tr><td>Next Action</td><td>Human Final Decision</td></tr></table></div>';
$("stage").innerHTML=shell(inner);setTimeout(()=>spotlight(s.target),80)
}
function spotlight(id){const el=$(id),stage=$("stage");if(!el)return;el.scrollIntoView({block:"center",inline:"nearest"});setTimeout(()=>{const st=stage.getBoundingClientRect(),r=el.getBoundingClientRect(),sp=$("spot"),n=$("spotnum");const left=r.left-st.left+stage.scrollLeft-5,top=r.top-st.top+stage.scrollTop-5;sp.style.left=left+"px";sp.style.top=top+"px";sp.style.width=(r.width+10)+"px";sp.style.height=(r.height+10)+"px";sp.style.display="block";n.style.left=Math.max(6,left-14)+"px";n.style.top=Math.max(6,top-14)+"px";n.style.display="grid";n.textContent=i+1},60)}
let i=0;function render(){const s=steps[i];$("simTitle").textContent=s.sim;$("eyebrow").textContent=s.eye;$("title").textContent=s.title;$("body").textContent=s.body;$("memory").textContent=s.memory;$("human").textContent=s.human;$("nextText").textContent=s.next;$("count").textContent=(i+1)+" / "+steps.length;$("fill").style.width=((i+1)/steps.length*100)+"%";$("prev").disabled=i===0;$("next").textContent=i===steps.length-1?"จบ Demo ✓":"ถัดไป →";renderStage(s)}
$("next").onclick=()=>{if(i<steps.length-1){i++;render()}};$("prev").onclick=()=>{if(i>0){i--;render()}};$("reset").onclick=()=>{i=0;render()};document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&i<steps.length-1){i++;render()}if(e.key==="ArrowLeft"&&i>0){i--;render()}});render();
</script></body></html>
