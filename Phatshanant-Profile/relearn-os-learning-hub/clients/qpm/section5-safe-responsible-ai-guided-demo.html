<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Section 5 · Safe & Responsible AI Guided Demo | RELEARN OS × QPM</title>
<style>
:root{--blue:#1767d1;--cyan:#2db8d8;--green:#35ad62;--ink:#17345b;--muted:#64748b;--line:#d9e8f1;--bg:#eef7fb;--warn:#fff5d6;--danger:#fff0f0}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}body{overflow:hidden}
.shell{height:100vh;display:grid;grid-template-rows:68px 1fr 64px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-weight:900;font-size:22px}.brand .r{color:var(--blue)}.brand .o{color:var(--green)}
.badge{margin-left:12px;padding:7px 10px;border-radius:999px;background:#eaf3ff;color:var(--blue);font-size:11px;font-weight:900}
main{display:grid;grid-template-columns:minmax(650px,1.35fr) minmax(340px,.65fr);gap:18px;padding:18px 22px;min-height:0}
.sim,.guide{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 38px rgba(30,69,110,.10);overflow:hidden}
.sim{display:grid;grid-template-rows:48px 1fr}.simhead{display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-size:12px;background:#fbfdff}
.stage{position:relative;background:linear-gradient(135deg,#f6fbff,#eef8fc);padding:18px;overflow:auto}
.window{width:min(100%,1080px);height:610px;margin:auto;background:#fff;border:1px solid #dfe7ee;border-radius:18px;overflow:hidden;box-shadow:0 18px 48px rgba(20,42,68,.14);display:grid;grid-template-columns:250px 1fr}
.sidebar{background:#f8fbfd;border-right:1px solid #e6edf2;padding:16px}.appLogo{font-weight:900;color:#1c4b77;font-size:20px;margin-bottom:18px}.new{background:#1767d1;color:#fff;padding:11px 13px;border-radius:12px;font-weight:800;font-size:12px;margin-bottom:12px}
.menu{padding:9px 10px;border-radius:10px;font-size:12px;color:#496075}.menu.active{background:#eaf3ff;color:#1767d1;font-weight:800}
.content{display:grid;grid-template-rows:58px 1fr}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e7edf2}.toolbar b{font-size:14px}.workspace{position:relative;padding:22px;overflow:auto}
.card{border:1px solid #e0e7ee;border-radius:16px;padding:16px;background:#fff}.meta{font-size:11px;color:#6b7c8e;margin-bottom:10px}.body{font-size:13px;line-height:1.65;color:#34495e}
.ai{margin-top:16px;border:1px solid #d7e4ed;border-radius:16px;padding:16px;background:#fbfdff}.ai h3{margin:0 0 10px;font-size:15px}.prompt{background:#f6f9fc;border:1px solid #dce5eb;border-radius:12px;padding:12px;font-size:12px;line-height:1.6;color:#42576c}.output{margin-top:12px;background:#fff;border:1px dashed #cbdbe7;border-radius:12px;padding:12px;font-size:12px;line-height:1.65;color:#31465d}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.risk{border:1px solid #dfe7ee;border-radius:12px;padding:12px;background:#fff}.risk b{display:block;font-size:12px;margin-bottom:5px}.risk p{font-size:10.5px;color:#65778a;line-height:1.5;margin:0}
.red{background:var(--danger);border-color:#f0caca}.yellow{background:var(--warn);border-color:#ecd98a}.green{background:#eef9f4;border-color:#cfe8d6}
.table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}.table th,.table td{border:1px solid #dfe7ee;padding:8px;text-align:left;vertical-align:top}.table th{background:#f4f8fb}
.tag{display:inline-block;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900}.stop{background:#ffe7e7;color:#b83232}.check{background:#fff4d7;color:#936400}.go{background:#e8f8ee;color:#23884a}
.spot{position:absolute;border:4px solid #27aa5f;border-radius:14px;box-shadow:0 0 0 5px rgba(39,170,95,.12);display:none;z-index:50;pointer-events:none}.spotnum{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:none;place-items:center;font-size:12px;font-weight:900;z-index:51}
.guide{padding:20px;display:flex;flex-direction:column}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--blue)}.guide h2{font-size:25px;line-height:1.25;margin:7px 0 8px}.guide p{font-size:12px;line-height:1.65;color:#5f7185;margin:0}
.info{margin-top:12px;border:1px solid var(--line);background:#f5f9fc;border-radius:15px;padding:12px}.info b{display:block;color:var(--blue);font-size:11px;margin-bottom:4px}.human{background:var(--warn);border-color:#ecd98a}.human b{color:#9b6a00}.next{background:#eef9f4;border-color:#cfe8d6}.next b{color:var(--green)}
footer{display:flex;align-items:center;justify-content:space-between;padding:9px 22px;background:#fff;border-top:1px solid var(--line)}.controls{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:12px}.primary{background:linear-gradient(90deg,var(--blue),var(--cyan));color:#fff}.secondary{background:#edf3f7;color:#35485d}.progress{font-size:11px;color:#687b8f;text-align:center}.bar{width:220px;height:7px;background:#e2ebf1;border-radius:999px;overflow:hidden;margin-top:4px}.bar>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:16.6%}.note{font-size:10px;color:#748599}
@media(max-width:980px){body{overflow:auto}.shell{height:auto;grid-template-rows:auto auto auto}main{grid-template-columns:1fr}.stage{min-height:720px}.window{transform:scale(.82);transform-origin:top center}}
</style></head><body><div class="shell">
<header><div><span class="brand"><span class="r">RELEARN</span> <span class="o">OS</span></span><span class="badge">SECTION 5 · SAFE & RESPONSIBLE AI</span></div><div><b>Safe & Responsible AI Guided Demo</b><br><small>คิดก่อนใส่ข้อมูล · ตรวจคำตอบ · คนรับผิดชอบ</small></div></header>
<main><section class="sim"><div class="simhead"><b id="simTitle"></b><span>Interactive Simulation · STOP → CHECK → USE</span></div><div class="stage" id="stage"></div></section>
<aside class="guide"><div class="eyebrow" id="eyebrow"></div><h2 id="title"></h2><p id="body"></p><div class="info"><b>สิ่งที่ต้องจำ</b><p id="memory"></p></div><div class="info human"><b>Human Check</b><p id="human"></p></div><div class="info next"><b>ถัดไปคืออะไร</b><p id="nextText"></p></div></aside></main>
<footer><div class="controls"><button class="btn secondary" id="prev">← ก่อนหน้า</button><button class="btn primary" id="next">ถัดไป →</button><button class="btn secondary" id="reset">เริ่มใหม่</button></div><div class="progress"><div id="count"></div><div class="bar"><div id="fill"></div></div></div><div class="note">RELEARN OS · STOP → CHECK → USE → HUMAN FINAL DECISION</div></footer>
</div>
<script>
const $=id=>document.getElementById(id);
function shell(inner){return '<div class="window"><aside class="sidebar"><div class="appLogo">Responsible AI Check</div><div class="new">＋ New AI Task</div><div class="menu active">Data Check</div><div class="menu">Prompt Check</div><div class="menu">Output Check</div><div class="menu">Approval</div></aside><section class="content"><div class="toolbar"><b>Property Management · AI Decision Gate</b><span>Human in the Loop</span></div><div class="workspace">'+inner+'</div></section></div><div class="spot" id="spot"></div><div class="spotnum" id="spotnum"></div>'}
const scenario='<div class="card" id="scenario"><div class="meta">Scenario</div><div class="body">ทีมต้องการให้ AI ช่วยร่างข้อความติดตามลูกบ้านที่ค้างชำระ โดยมีไฟล์ Excel ซึ่งมี <b>ชื่อ-นามสกุล, ห้อง, เบอร์โทร, ยอดค้าง และหมายเหตุภายใน</b></div></div>';
const steps=[
{sim:"Step 1 · STOP",eye:"SAFE AI 1/6",title:"ก่อนอัปโหลด — STOP",body:"อย่าเริ่มจากโยนข้อมูลทั้งหมดเข้า AI ให้ดูว่ามีข้อมูลส่วนบุคคล ข้อมูลลับ หรือข้อมูลที่ไม่จำเป็นหรือไม่",memory:"ใส่เฉพาะข้อมูลขั้นต่ำที่จำเป็นกับงาน",human:"ชื่อ เบอร์โทร ห้อง และหมายเหตุภายในอาจไม่จำเป็นต่อการร่าง Template",next:"ลดข้อมูลก่อนใช้",view:"stop",target:"scenario"},
{sim:"Step 2 · Data Minimization",eye:"SAFE AI 2/6",title:"ตัดข้อมูลที่ไม่จำเป็นออก",body:"เปลี่ยนจากข้อมูลรายบุคคลเป็นตัวอย่างหรือข้อมูลที่ถูกลดรายละเอียดก่อนส่งให้ AI",memory:"Need-to-know / Minimum necessary data",human:"ถ้างานต้องใช้ข้อมูลจริง ให้ทำตามนโยบายองค์กรและสิทธิ์การเข้าถึงข้อมูล",next:"ตรวจ Prompt",view:"minimize",target:"minBox"},
{sim:"Step 3 · Prompt Check",eye:"SAFE AI 3/6",title:"Prompt ต้องไม่สั่งให้ AI เดา",body:"กำหนดให้ใช้เฉพาะข้อมูลที่ให้ และระบุสิ่งที่ต้องให้คนตรวจ",memory:"Prompt ที่ปลอดภัยควรกำหนดขอบเขตและข้อห้าม",human:"อย่าให้ AI ตัดสินสิทธิ์ ความผิด หรือมาตรการแทนองค์กร",next:"ตรวจ Output",view:"prompt",target:"promptBox"},
{sim:"Step 4 · Output Check",eye:"SAFE AI 4/6",title:"คำตอบของ AI ยังไม่ใช่ข้อเท็จจริง",body:"ตรวจตัวเลข ชื่อกฎ เงื่อนไข วันที่ และข้อความที่ดูมั่นใจเกินข้อมูลจริง",memory:"AI อาจตอบผิดหรือเติมรายละเอียดที่ไม่มีใน Source",human:"ข้อมูลสำคัญต้องตรวจย้อนกลับที่ Source หรือเจ้าของกระบวนการ",next:"แยกระดับความเสี่ยง",view:"output",target:"outputBox"},
{sim:"Step 5 · Risk Gate",eye:"SAFE AI 5/6",title:"แยกงานเป็น GO / CHECK / STOP",body:"งานความเสี่ยงต่ำอาจใช้ AI ช่วยร่างได้ งานที่มีผลต่อสิทธิ์ ความปลอดภัย หรือข้อกฎหมายต้องมีการตรวจและอนุมัติเพิ่ม",memory:"ไม่ใช่ทุกงานที่ควรใช้ AI ด้วยระดับอิสระเท่ากัน",human:"เมื่อไม่แน่ใจ ให้หยุดและถามผู้รับผิดชอบก่อน",next:"Human Approval",view:"risk",target:"riskBox"},
{sim:"Step 6 · Human Final Decision",eye:"SAFE AI 6/6",title:"คนตรวจ คนอนุมัติ คนรับผิดชอบ",body:"ก่อนใช้จริง ต้องมีคนตรวจข้อมูล บริบท โทน ข้อกำหนด และผลกระทบต่อผู้เกี่ยวข้อง",memory:"AI = ผู้ช่วย / Human = ผู้ตัดสินใจและรับผิดชอบ",human:"Privacy • Fact • Policy • Context • Approval",next:"พร้อมใช้ Safe AI Checklist",view:"final",target:"finalBox"}
];
function renderStage(s){
let inner=scenario;
if(s.view==="minimize") inner+='<div class="ai" id="minBox"><h3>ลดข้อมูลก่อนส่งให้ AI</h3><table class="table"><tr><th>ข้อมูลเดิม</th><th>จำเป็นไหม</th><th>วิธีใช้</th></tr><tr><td>ชื่อ-นามสกุล</td><td><span class="tag stop">STOP</span></td><td>ตัดออก ถ้าแค่ร่าง Template</td></tr><tr><td>เบอร์โทร</td><td><span class="tag stop">STOP</span></td><td>ไม่ต้องใช้</td></tr><tr><td>เลขห้อง</td><td><span class="tag check">CHECK</span></td><td>แทนด้วย [เลขห้อง]</td></tr><tr><td>ยอดค้าง</td><td><span class="tag check">CHECK</span></td><td>ใช้ [ยอดค้าง] เป็น placeholder</td></tr><tr><td>หมายเหตุภายใน</td><td><span class="tag stop">STOP</span></td><td>ไม่ส่งเข้า AI หากไม่จำเป็น</td></tr></table></div>';
if(s.view==="prompt") inner+='<div class="ai" id="promptBox"><h3>Safe Prompt</h3><div class="prompt">ช่วยร่าง Template ข้อความติดตามยอดค้างสำหรับลูกบ้าน<br><br>ใช้ placeholder เท่านั้น: [ชื่อ], [เลขห้อง], [ยอดค้าง], [วันครบกำหนด]<br>ห้ามเพิ่มค่าปรับ เงื่อนไข หรือมาตรการที่ฉันไม่ได้ให้ข้อมูล<br>โทนสุภาพ กระชับ และไม่กดดัน<br>ท้ายคำตอบให้ระบุสิ่งที่เจ้าหน้าที่ต้องตรวจ ก่อนส่งจริง</div></div>';
if(s.view==="output") inner+='<div class="ai" id="outputBox"><h3>Output Review</h3><div class="output">เรียนคุณ [ชื่อ] ทางฝ่ายอาคารขอแจ้งยอดค้างชำระจำนวน [ยอดค้าง] สำหรับห้อง [เลขห้อง] โดยมีกำหนดชำระภายใน [วันครบกำหนด] ...</div><div class="cards" style="margin-top:10px"><div class="risk yellow"><b>ต้องตรวจ</b><p>ยอดเงินและวันครบกำหนดจากระบบจริง</p></div><div class="risk yellow"><b>ต้องตรวจ</b><p>ข้อความเรื่องค่าปรับหรือมาตรการต้องอิงนโยบายจริง</p></div></div></div>';
if(s.view==="risk") inner+='<div class="ai" id="riskBox"><h3>AI Risk Gate</h3><div class="cards"><div class="risk green"><b><span class="tag go">GO</span> ร่างภาษา</b><p>สรุป ปรับโทน จัดรูปแบบจากข้อมูลที่ปลอดภัย</p></div><div class="risk yellow"><b><span class="tag check">CHECK</span> ข้อมูลธุรกิจ</b><p>ตัวเลข กฎ ขั้นตอน และเอกสารที่ต้องตรวจต้นทาง</p></div><div class="risk red"><b><span class="tag stop">STOP</span> ข้อมูลส่วนบุคคลเกินจำเป็น</b><p>ไม่ใส่เพียงเพราะมีอยู่ในไฟล์</p></div><div class="risk red"><b><span class="tag stop">STOP</span> การตัดสินใจสำคัญ</b><p>ไม่ให้ AI ตัดสินสิทธิ์ ความผิด ความปลอดภัย หรือการอนุมัติแทนคน</p></div></div></div>';
if(s.view==="final") inner+='<div class="ai" id="finalBox"><h3>Safe AI Checklist</h3><div class="output">✓ ใส่ข้อมูลเท่าที่จำเป็น<br>✓ ตรวจว่าข้อมูลลับ/ข้อมูลส่วนบุคคลถูกจัดการเหมาะสม<br>✓ Prompt ไม่สั่งให้ AI เดา<br>✓ ตรวจ Facts / Numbers / Source<br>✓ ตรวจ Policy / SOP / Context<br>✓ ให้ผู้มีอำนาจอนุมัติก่อนใช้จริงเมื่อจำเป็น</div></div>';
$("stage").innerHTML=shell(inner);setTimeout(()=>spotlight(s.target),80)
}
function spotlight(id){const el=$(id),stage=$("stage");if(!el)return;el.scrollIntoView({block:"center",inline:"nearest"});setTimeout(()=>{const st=stage.getBoundingClientRect(),r=el.getBoundingClientRect(),sp=$("spot"),n=$("spotnum");const left=r.left-st.left+stage.scrollLeft-5,top=r.top-st.top+stage.scrollTop-5;sp.style.left=left+"px";sp.style.top=top+"px";sp.style.width=(r.width+10)+"px";sp.style.height=(r.height+10)+"px";sp.style.display="block";n.style.left=Math.max(6,left-14)+"px";n.style.top=Math.max(6,top-14)+"px";n.style.display="grid";n.textContent=i+1},60)}
let i=0;function render(){const s=steps[i];$("simTitle").textContent=s.sim;$("eyebrow").textContent=s.eye;$("title").textContent=s.title;$("body").textContent=s.body;$("memory").textContent=s.memory;$("human").textContent=s.human;$("nextText").textContent=s.next;$("count").textContent=(i+1)+" / "+steps.length;$("fill").style.width=((i+1)/steps.length*100)+"%";$("prev").disabled=i===0;$("next").textContent=i===steps.length-1?"จบ Demo ✓":"ถัดไป →";renderStage(s)}
$("next").onclick=()=>{if(i<steps.length-1){i++;render()}};$("prev").onclick=()=>{if(i>0){i--;render()}};$("reset").onclick=()=>{i=0;render()};document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&i<steps.length-1){i++;render()}if(e.key==="ArrowLeft"&&i>0){i--;render()}});render();
</script></body></html>
