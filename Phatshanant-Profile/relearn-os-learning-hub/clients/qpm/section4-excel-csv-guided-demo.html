<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Section 4 · Excel / CSV + AI Guided Demo | RELEARN OS × QPM</title>
<style>
:root{--blue:#1767d1;--cyan:#2db8d8;--green:#35ad62;--ink:#17345b;--muted:#64748b;--line:#d9e8f1;--bg:#eef7fb;--warn:#fff5d6}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}body{overflow:hidden}
.shell{height:100vh;display:grid;grid-template-rows:68px 1fr 64px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-weight:900;font-size:22px}.brand .r{color:var(--blue)}.brand .o{color:var(--green)}
.badge{margin-left:12px;padding:7px 10px;border-radius:999px;background:#eaf3ff;color:var(--blue);font-size:11px;font-weight:900}
main{display:grid;grid-template-columns:minmax(650px,1.35fr) minmax(340px,.65fr);gap:18px;padding:18px 22px;min-height:0}
.sim,.guide{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 38px rgba(30,69,110,.10);overflow:hidden}
.sim{display:grid;grid-template-rows:48px 1fr}.simhead{display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-size:12px;background:#fbfdff}
.stage{position:relative;background:linear-gradient(135deg,#f6fbff,#eef8fc);padding:18px;overflow:auto}
.window{width:min(100%,1080px);height:610px;margin:auto;background:#fff;border:1px solid #dfe7ee;border-radius:18px;overflow:hidden;box-shadow:0 18px 48px rgba(20,42,68,.14);display:grid;grid-template-columns:250px 1fr}
.sidebar{background:#f8fbfd;border-right:1px solid #e6edf2;padding:16px}.appLogo{font-weight:900;color:#1c4b77;font-size:20px;margin-bottom:18px}.new{background:#1767d1;color:#fff;padding:11px 13px;border-radius:12px;font-weight:800;font-size:12px;margin-bottom:12px}
.menu{padding:9px 10px;border-radius:10px;font-size:12px;color:#496075}.menu.active{background:#eaf3ff;color:#1767d1;font-weight:800}
.content{display:grid;grid-template-rows:58px 1fr}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e7edf2}.toolbar b{font-size:14px}.workspace{position:relative;padding:22px;overflow:auto}
.card{border:1px solid #e0e7ee;border-radius:16px;padding:16px;background:#fff}.meta{font-size:11px;color:#6b7c8e;margin-bottom:10px}.body{font-size:13px;line-height:1.65;color:#34495e}
.ai{margin-top:16px;border:1px solid #d7e4ed;border-radius:16px;padding:16px;background:#fbfdff}.ai h3{margin:0 0 10px;font-size:15px}.prompt{background:#f6f9fc;border:1px solid #dce5eb;border-radius:12px;padding:12px;font-size:12px;line-height:1.6;color:#42576c}.output{margin-top:12px;background:#fff;border:1px dashed #cbdbe7;border-radius:12px;padding:12px;font-size:12px;line-height:1.65;color:#31465d}
.table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}.table th,.table td{border:1px solid #dfe7ee;padding:8px;text-align:left;vertical-align:top}.table th{background:#f4f8fb}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.kpi{border:1px solid #e1e7ee;border-radius:12px;padding:12px;background:#fff}.kpi b{display:block;font-size:18px;color:#1767d1}.kpi span{font-size:10px;color:#6b7c8e}
.chart{display:flex;align-items:end;gap:18px;height:145px;padding:15px 8px 0;margin-top:12px;border-left:1px solid #d8e2ea;border-bottom:1px solid #d8e2ea}.barv{width:52px;border-radius:8px 8px 0 0;background:linear-gradient(#2db8d8,#1767d1);position:relative}.barv span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:#65778a;white-space:nowrap}.barv em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;font-weight:800;color:#17345b}
.spot{position:absolute;border:4px solid #27aa5f;border-radius:14px;box-shadow:0 0 0 5px rgba(39,170,95,.12);display:none;z-index:50;pointer-events:none}.spotnum{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:none;place-items:center;font-size:12px;font-weight:900;z-index:51}
.guide{padding:20px;display:flex;flex-direction:column}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--blue)}.guide h2{font-size:25px;line-height:1.25;margin:7px 0 8px}.guide p{font-size:12px;line-height:1.65;color:#5f7185;margin:0}
.info{margin-top:12px;border:1px solid var(--line);background:#f5f9fc;border-radius:15px;padding:12px}.info b{display:block;color:var(--blue);font-size:11px;margin-bottom:4px}.human{background:var(--warn);border-color:#ecd98a}.human b{color:#9b6a00}.next{background:#eef9f4;border-color:#cfe8d6}.next b{color:var(--green)}
footer{display:flex;align-items:center;justify-content:space-between;padding:9px 22px;background:#fff;border-top:1px solid var(--line)}.controls{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:12px}.primary{background:linear-gradient(90deg,var(--blue),var(--cyan));color:#fff}.secondary{background:#edf3f7;color:#35485d}.progress{font-size:11px;color:#687b8f;text-align:center}.bar{width:220px;height:7px;background:#e2ebf1;border-radius:999px;overflow:hidden;margin-top:4px}.bar>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:16.6%}.note{font-size:10px;color:#748599}
@media(max-width:980px){body{overflow:auto}.shell{height:auto;grid-template-rows:auto auto auto}main{grid-template-columns:1fr}.stage{min-height:720px}.window{transform:scale(.82);transform-origin:top center}}
</style></head><body><div class="shell">
<header><div><span class="brand"><span class="r">RELEARN</span> <span class="o">OS</span></span><span class="badge">SECTION 4 · REAL WORK USE CASE</span></div><div><b>Excel / CSV + AI Guided Demo</b><br><small>จากข้อมูลดิบ → คำถามธุรกิจ → Insight → มุมมองช่วยตัดสินใจ</small></div></header>
<main><section class="sim"><div class="simhead"><b id="simTitle"></b><span>Interactive Simulation · Dashboard Thinking</span></div><div class="stage" id="stage"></div></section>
<aside class="guide"><div class="eyebrow" id="eyebrow"></div><h2 id="title"></h2><p id="body"></p><div class="info"><b>สิ่งที่ต้องจำ</b><p id="memory"></p></div><div class="info human"><b>Human Check</b><p id="human"></p></div><div class="info next"><b>ถัดไปคืออะไร</b><p id="nextText"></p></div></aside></main>
<footer><div class="controls"><button class="btn secondary" id="prev">← ก่อนหน้า</button><button class="btn primary" id="next">ถัดไป →</button><button class="btn secondary" id="reset">เริ่มใหม่</button></div><div class="progress"><div id="count"></div><div class="bar"><div id="fill"></div></div></div><div class="note">RELEARN OS · Data → Question → Insight → Visual → Decision → Human Check</div></footer>
</div>
<script>
const $=id=>document.getElementById(id);
function shell(inner){return '<div class="window"><aside class="sidebar"><div class="appLogo">Data Workspace</div><div class="new">＋ Upload Excel / CSV</div><div class="menu active">Property Data</div><div class="menu">Analysis</div><div class="menu">Charts</div><div class="menu">Dashboard</div></aside><section class="content"><div class="toolbar"><b>Property Operations · Monthly Snapshot</b><span>CSV uploaded</span></div><div class="workspace">'+inner+'</div></section></div><div class="spot" id="spot"></div><div class="spotnum" id="spotnum"></div>'}
const raw='<div class="card" id="rawData"><div class="meta">ไฟล์: property_ops_aug.csv · 4 อาคาร</div><table class="table"><tr><th>อาคาร</th><th>รายรับ (บาท)</th><th>ค้างชำระ</th><th>งานซ่อมค้าง</th><th>Complaint</th></tr><tr><td>A</td><td>1,250,000</td><td>4.2%</td><td>18</td><td>12</td></tr><tr><td>B</td><td>1,180,000</td><td>8.9%</td><td>31</td><td>26</td></tr><tr><td>C</td><td>1,320,000</td><td>3.8%</td><td>15</td><td>9</td></tr><tr><td>D</td><td>1,110,000</td><td>6.1%</td><td>22</td><td>15</td></tr></table></div>';
const steps=[
{sim:"Step 1 · Data",eye:"USE CASE 1/6",title:"เริ่มจากข้อมูลดิบ ไม่ใช่เริ่มจากกราฟ",body:"ดูให้รู้ก่อนว่าไฟล์มีคอลัมน์อะไร หน่วยอะไร และข้อมูลพอสำหรับคำถามธุรกิจหรือไม่",memory:"ข้อมูลที่ยังไม่เข้าใจไม่ควรรีบทำ Dashboard",human:"ตรวจชื่อคอลัมน์ หน่วย วันที่ missing data และข้อมูลอ่อนไหว",next:"ตั้งคำถามธุรกิจ",view:"data",target:"rawData"},
{sim:"Step 2 · Question",eye:"USE CASE 2/6",title:"ถาม AI ด้วยคำถามทางธุรกิจ",body:"อย่าถามกว้าง ๆ ว่า “ช่วยวิเคราะห์” ให้บอกว่าต้องการหาแนวโน้ม จุดผิดปกติ และประเด็นที่ควรถามต่อ",memory:"Dashboard ที่ดีเริ่มจากคำถาม ไม่ได้เริ่มจากเลือกกราฟ",human:"คำถามต้องสัมพันธ์กับข้อมูลจริงในไฟล์",next:"ดู Insight",view:"question",target:"promptBox"},
{sim:"Step 3 · Insight",eye:"USE CASE 3/6",title:"AI ช่วยหา Pattern และ Outlier",body:"AI สรุปสิ่งที่ข้อมูลกำลังบอก เช่น อาคาร B มีค้างชำระและ Complaint สูงกว่ากลุ่ม",memory:"Insight ต้องอิงตัวเลขที่ตรวจย้อนกลับได้",human:"ตรวจการคำนวณและเทียบกับข้อมูลต้นฉบับทุกครั้ง",next:"เลือกมุมมองตาราง/กราฟ",view:"insight",target:"insightBox"},
{sim:"Step 4 · Visual",eye:"USE CASE 4/6",title:"ออกแบบตาราง/กราฟตามคำถาม",body:"เลือก visual ที่ช่วยตอบโจทย์ ไม่ใช่ทำกราฟเพื่อความสวย",memory:"ใช้ตารางเมื่อต้องเทียบรายละเอียด ใช้กราฟเมื่อต้องเห็นแนวโน้มหรือความแตกต่างเร็ว",human:"อย่าตัดแกนหรือใช้ visual ที่ทำให้ความต่างดูเกินจริง",next:"สรุปมุมมอง Dashboard",view:"visual",target:"visualBox"},
{sim:"Step 5 · Decision",eye:"USE CASE 5/6",title:"เปลี่ยน Insight เป็นมุมมองช่วยตัดสินใจ",body:"Dashboard Thinking คือทำให้หัวหน้างานเห็นสิ่งที่ต้องจับตาและถามต่อ ไม่ใช่แค่ดูตัวเลข",memory:"Insight → Implication → Next Question / Action",human:"AI ไม่ควรตัดสินใจแทนเมื่อบริบทธุรกิจยังไม่ครบ",next:"Human Check ก่อนใช้",view:"decision",target:"decisionBox"},
{sim:"Step 6 · Human Check",eye:"USE CASE 6/6",title:"ตรวจตัวเลขก่อนนำเสนอ",body:"ตรวจสูตร ตัวเลข หน่วย กราฟ และข้อสรุป ก่อนใช้ประชุมหรือส่งต่อ",memory:"AI ช่วยอ่านข้อมูลเร็วขึ้น แต่เจ้าของข้อมูลต้องรับรองความถูกต้อง",human:"Data • Formula • Unit • Source • Context • Decision",next:"พร้อมใช้เป็น Dashboard Thinking",view:"final",target:"finalBox"}
];
function renderStage(s){
let inner=raw;
if(s.view==="question") inner+='<div class="ai" id="promptBox"><h3>Business Question Prompt</h3><div class="prompt">จากไฟล์นี้ ช่วยวิเคราะห์โดยใช้เฉพาะข้อมูลที่มี:<br>1) หา 3 ประเด็นผิดปกติหรือควรจับตา<br>2) ระบุว่ามาจากตัวเลขใด<br>3) เสนอคำถามที่ควรถามต่อ<br>4) ห้ามสรุปสาเหตุถ้าข้อมูลยังไม่รองรับ</div></div>';
if(s.view==="insight") inner+='<div class="ai" id="insightBox"><h3>AI Insight</h3><div class="kpis"><div class="kpi"><b>8.9%</b><span>ค้างชำระสูงสุด · อาคาร B</span></div><div class="kpi"><b>31</b><span>งานซ่อมค้างสูงสุด · อาคาร B</span></div><div class="kpi"><b>26</b><span>Complaint สูงสุด · อาคาร B</span></div></div><div class="output"><b>ข้อสังเกต:</b> อาคาร B สูงกว่ากลุ่มใน 3 ตัวชี้วัดพร้อมกัน จึงควรตรวจรายละเอียดเชิงสาเหตุเพิ่มเติม แต่จากข้อมูลชุดนี้ยังสรุปไม่ได้ว่าเกิดจากปัจจัยเดียวกัน</div></div>';
if(s.view==="visual") inner+='<div class="ai" id="visualBox"><h3>Visual ที่เหมาะกับคำถาม</h3><div class="chart"><div class="barv" style="height:47%"><em>4.2%</em><span>A</span></div><div class="barv" style="height:100%"><em>8.9%</em><span>B</span></div><div class="barv" style="height:43%"><em>3.8%</em><span>C</span></div><div class="barv" style="height:69%"><em>6.1%</em><span>D</span></div></div><div class="output"><b>เลือกกราฟแท่ง:</b> เหมาะกับการเทียบ % ค้างชำระระหว่าง 4 อาคารในช่วงเดียวกัน</div></div>';
if(s.view==="decision") inner+='<div class="ai" id="decisionBox"><h3>Dashboard Thinking</h3><table class="table"><tr><th>Insight</th><th>Implication</th><th>Next Question / Action</th></tr><tr><td>อาคาร B ค้างชำระ 8.9%</td><td>สูงกว่ากลุ่มชัดเจน</td><td>ตรวจ ageing ลูกหนี้และสาเหตุการค้าง</td></tr><tr><td>งานซ่อมค้าง 31 งาน</td><td>ภาระงานสูงสุดในกลุ่ม</td><td>แยกประเภทงาน/อายุงาน/ผู้รับผิดชอบ</td></tr><tr><td>Complaint 26 เคส</td><td>ควรจับตาประสบการณ์ลูกบ้าน</td><td>จัดหมวด complaint และหาประเด็นซ้ำ</td></tr></table></div>';
if(s.view==="final") inner+='<div class="ai" id="finalBox"><h3>Human Check ก่อนใช้ Dashboard</h3><div class="output">✓ ตรวจไฟล์ต้นฉบับและช่วงเวลา<br>✓ ตรวจสูตร / % / หน่วย<br>✓ ตรวจว่าไม่มีข้อมูลหายหรือซ้ำ<br>✓ ตรวจว่า Insight ไม่เกินหลักฐาน<br>✓ แยก “ข้อเท็จจริง” ออกจาก “สาเหตุที่คาด”<br>✓ ให้ผู้รับผิดชอบข้อมูลยืนยันก่อนนำเสนอ</div></div>';
$("stage").innerHTML=shell(inner);setTimeout(()=>spotlight(s.target),80)
}
function spotlight(id){
  const el=$(id),stage=$("stage"); if(!el)return;
  el.scrollIntoView({block:"center",inline:"nearest"});
  setTimeout(()=>{const st=stage.getBoundingClientRect(),r=el.getBoundingClientRect(),sp=$("spot"),n=$("spotnum");const left=r.left-st.left+stage.scrollLeft-5,top=r.top-st.top+stage.scrollTop-5;sp.style.left=left+"px";sp.style.top=top+"px";sp.style.width=(r.width+10)+"px";sp.style.height=(r.height+10)+"px";sp.style.display="block";n.style.left=Math.max(6,left-14)+"px";n.style.top=Math.max(6,top-14)+"px";n.style.display="grid";n.textContent=i+1},60)
}
let i=0;function render(){const s=steps[i];$("simTitle").textContent=s.sim;$("eyebrow").textContent=s.eye;$("title").textContent=s.title;$("body").textContent=s.body;$("memory").textContent=s.memory;$("human").textContent=s.human;$("nextText").textContent=s.next;$("count").textContent=(i+1)+" / "+steps.length;$("fill").style.width=((i+1)/steps.length*100)+"%";$("prev").disabled=i===0;$("next").textContent=i===steps.length-1?"จบ Demo ✓":"ถัดไป →";renderStage(s)}
$("next").onclick=()=>{if(i<steps.length-1){i++;render()}};$("prev").onclick=()=>{if(i>0){i--;render()}};$("reset").onclick=()=>{i=0;render()};document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&i<steps.length-1){i++;render()}if(e.key==="ArrowLeft"&&i>0){i--;render()}});render();
</script></body></html>
