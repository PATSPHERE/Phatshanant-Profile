name: Fix Thai contact labels
on:
  push:
    paths:
      - '.github/workflows/fix-thai-contact-labels.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Thai contact labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ai-business-transformation-academy/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            "lineLabel:'ADD LINE OA'": "lineLabel:'เพิ่ม LINE OA'",
            "contactOpt2Title:'Strategic Consultation'": "contactOpt2Title:'การปรึกษาเชิงกลยุทธ์'",
            "contactOpt2Link:'ดูตัวเลือก Consulting →'": "contactOpt2Link:'ดูตัวเลือกการปรึกษา →'",
            "contactOpt3Title:'Project Enquiry'": "contactOpt3Title:'สอบถามโครงการ'",
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'PATSPHERE Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ai-business-transformation-academy/index.html
          git commit -m 'Translate Thai contact labels' || exit 0
          git push
