name: Finalize RELEARNOS Framework Image

on:
  push:
    paths:
      - '.github/workflows/finalize-framework-image.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build locked framework image and update production
        shell: bash
        run: |
          set -euo pipefail
          IMG_DIR='ai-business-transformation-academy/.framework-image'
          ASSET='ai-business-transformation-academy/assets/relearnos-framework-final.webp'
          PAGE='ai-business-transformation-academy/index.html'

          cat "$IMG_DIR"/chunk01.txt "$IMG_DIR"/chunk02.txt "$IMG_DIR"/chunk03.txt "$IMG_DIR"/chunk04.txt "$IMG_DIR"/chunk05.txt "$IMG_DIR"/chunk06.txt "$IMG_DIR"/chunk07.txt | base64 -d > "$ASSET"
          test -s "$ASSET"
          test "$(wc -c < "$ASSET")" -eq 45226

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ai-business-transformation-academy/index.html')
          s = p.read_text(encoding='utf-8')
          new = """<section id='framework' style='padding:0;background:#fff;border-bottom:1px solid var(--line)'><img src='assets/relearnos-framework-final.webp?v=locked-final' alt='RELEARNOS Framework: Diagnose, Learn, Re-Learn, Re-Act and Measure' width='640' height='960' loading='lazy' style='display:block;width:min(100%,760px);height:auto;margin:0 auto;background:#fff'></section>"""
          updated, n = re.subn(r"<section id='framework'\b.*?</section>", new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one framework section, replaced {n}')
          p.write_text(updated, encoding='utf-8')
          PY

          rm -rf "$IMG_DIR"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ASSET" "$PAGE" "$IMG_DIR"
          git commit -m 'Use locked framework image on production'
          git push
