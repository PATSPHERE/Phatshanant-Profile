name: Deploy RELEARNOS Framework

on:
  push:
    paths:
      - '.github/workflows/deploy-relearnos-framework.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace framework section only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('ai-business-transformation-academy/index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r"<section id='framework' class='dark'>.*?</section>"
          replacement = """<section id='framework' style='padding:0;background:#fff;border-bottom:1px solid var(--line)'><iframe src='framework-approved.html?v=36196a0' title='RELEARNOS Framework' loading='lazy' style='display:block;width:100%;height:1580px;border:0;background:#fff' onload=\"try{this.style.height=this.contentWindow.document.documentElement.scrollHeight+'px'}catch(e){}\"></iframe></section>"""
          out, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected exactly one framework section, found {n}')
          p.write_text(out, encoding='utf-8')
          PY
      - name: Commit production framework
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-business-transformation-academy/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy approved RELEARNOS framework to production'
          git push
