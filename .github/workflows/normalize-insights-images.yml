name: Normalize Insights image assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-insights-images.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Use the same local asset method for all Insights images
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ai-business-transformation-academy/insights/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("https://raw.githubusercontent.com/PATSPHERE/Phatshanant-Profile/main/ai-business-transformation-academy/assets/insights/accounting-v2.webp", "../assets/insights/hq/accounting.webp")
          s = s.replace("https://raw.githubusercontent.com/PATSPHERE/Phatshanant-Profile/main/ai-business-transformation-academy/assets/insights/healthcare-v2.webp", "../assets/insights/hq/healthcare.webp")
          p.write_text(s, encoding='utf-8')
          PY
          rm -rf .tmp-insights || true
          rm -f ai-business-transformation-academy/assets/insights/hq/accounting-hq.webp || true
      - name: Commit normalized image paths
        run: |
          git config user.name "PATSPHERE Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Normalize Accounting and Healthcare image assets"
            git push origin main
          fi
