name: Attach Thai Closeout
on:
  push:
    paths:
      - '.github/workflows/attach-th-closeout.yml'
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach runtime fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai-business-transformation-academy/index.html')
          s=p.read_text(encoding='utf-8')
          tag="<script src='relearnos-th-closeout.js?v=th-closeout-1'></script>"
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-business-transformation-academy/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Attach Thai closeout fixes'
          git push