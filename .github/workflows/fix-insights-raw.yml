name: Fix Insights raw image paths
on:
  push:
    paths:
      - '.github/workflows/fix-insights-raw.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace image URLs with GitHub raw URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ai-business-transformation-academy/insights/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("../assets/insights/accounting-v2.webp", "https://raw.githubusercontent.com/PATSPHERE/Phatshanant-Profile/main/ai-business-transformation-academy/assets/insights/accounting-v2.webp")
          s = s.replace("../assets/insights/healthcare-v2.webp", "https://raw.githubusercontent.com/PATSPHERE/Phatshanant-Profile/main/ai-business-transformation-academy/assets/insights/healthcare-v2.webp")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-business-transformation-academy/insights/index.html
          git diff --cached --quiet || git commit -m "Use GitHub raw URLs for Insights images"
          git push origin main
