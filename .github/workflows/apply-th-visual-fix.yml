name: Apply Thai Visual Fix

on:
  push:
    paths:
      - '.github/workflows/apply-th-visual-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach Thai visual correction runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai-business-transformation-academy/index.html')
          s=p.read_text(encoding='utf-8')
          tag="<script src='relearnos-th-visual-fix.js?v=th-visual-2'></script>"
          if tag not in s:
              anchor="<script src='relearnos-th-restore.js?v=th-final-1'></script>"
              if anchor in s:
                  s=s.replace(anchor,anchor+'\n'+tag,1)
              else:
                  s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-business-transformation-academy/index.html
          git commit -m 'Apply Thai visual framing corrections'
          git push
