name: Final RELEARNOS Review Cleanup

on:
  push:
    paths:
      - '.github/workflows/final-review-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate diagnostic block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('ai-business-transformation-academy/index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"\n?<section id='diagnostic'.*?</section>",'',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'Expected one diagnostic section, removed {n}')
          if "id='framework'" not in s or "relearnos-framework-final.webp" not in s:
              raise SystemExit('Locked framework image section missing after cleanup')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-business-transformation-academy/index.html
          git commit -m 'Remove duplicate diagnostic block for final review'
          git push
