name: Install Accounting Workflow image

on:
  push:
    paths:
      - '.github/workflows/install-accounting-image.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add approved Accounting Workflow image
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          chunks = [
          '' ,
          ]
          asset = Path('ai-business-transformation-academy/assets/accounting-workflow-final.webp')
          asset.parent.mkdir(parents=True, exist_ok=True)
          asset.write_bytes(base64.b64decode(''.join(chunks)))
          p = Path('ai-business-transformation-academy/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/insights/hq/accounting.avif'
          new = 'assets/accounting-workflow-final.webp?v=accounting-final'
          if old not in s:
              raise SystemExit('Accounting image source not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit production update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-business-transformation-academy/index.html ai-business-transformation-academy/assets/accounting-workflow-final.webp
          git diff --cached --quiet && exit 0
          git commit -m 'Restore Accounting Workflow case image'
          git push
