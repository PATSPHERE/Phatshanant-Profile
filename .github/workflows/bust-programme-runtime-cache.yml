name: Bust programme runtime cache
on:
  push:
    paths:
      - '.github/workflows/bust-programme-runtime-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust script cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-business-transformation-academy/index.html')
          s=p.read_text()
          import re
          s=re.sub(r"programme-cards-restore\.js(?:\?v=[^'\"]*)?", "programme-cards-restore.js?v=ac28fde2", s)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-business-transformation-academy/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Bust programme runtime cache for Thai copy'
          git push