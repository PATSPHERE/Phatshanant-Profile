name: Insights image hotfix
on:
  push:
    paths:
      - .github/workflows/insights-image-hotfix.yml
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point blank image slots to known-good local HQ assets
        shell: bash
        run: |
          FILE="ai-business-transformation-academy/insights/index.html"
          sed -i "s#../assets/insights/hq/accounting.webp#../assets/insights/hq/knowledge.avif#g" "$FILE"
          sed -i "s#../assets/insights/hq/healthcare.webp#../assets/insights/hq/lifescience.avif#g" "$FILE"
          rm -f .github/workflows/replace-insights-hq-images.yml
          rm -f .github/workflows/insights-image-hotfix.yml
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "PATSPHERE Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Restore visible Insights images with known-good HQ assets"
          git push
