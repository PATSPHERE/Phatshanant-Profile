name: Build 3A Prompt Playbook PDF

on:
  push:
    paths:
      - 'tmp/3a-build/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact 3A master PDF
        run: |
          set -eux
          cat tmp/3a-build/parts/part_*.bin > relearn-os-learning-hub/clients/qpm/RELEARN_OS_QPM_Section3A_Prompt_Playbook_4Pages_LEARNER.pdf
          echo "a8d3f8d21caabb76d1f67f573c2b290939734a65c8e80df8c07b2a4e05edbf3e  relearn-os-learning-hub/clients/qpm/RELEARN_OS_QPM_Section3A_Prompt_Playbook_4Pages_LEARNER.pdf" | sha256sum -c -
          file relearn-os-learning-hub/clients/qpm/RELEARN_OS_QPM_Section3A_Prompt_Playbook_4Pages_LEARNER.pdf
      - name: Commit exact PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relearn-os-learning-hub/clients/qpm/RELEARN_OS_QPM_Section3A_Prompt_Playbook_4Pages_LEARNER.pdf
          git rm -r tmp/3a-build
          git commit -m "Upload exact Section 3A Prompt Playbook learner PDF"
          git push
