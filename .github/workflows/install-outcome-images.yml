name: Install RELEARNOS outcome images
on:
  push:
    paths:
      - '.github/workflows/install-outcome-images.yml'
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Outcome image sources
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-business-transformation-academy/index.html')
          s=p.read_text()
          replacements={
            "assets/insights/hq/bakery.avif":"assets/outcome-smarter-work.webp",
            "assets/insights/hq/governance.avif":"assets/outcome-better-decisions.webp",
            "assets/insights/hq/healthcare.webp":"assets/outcome-best-service.webp",
            "assets/insights/hq/knowledge.avif":"assets/outcome-future-ready.webp",
          }
          for a,b in replacements.items():
              s=s.replace(a,b,1)
          p.write_text(s)
          PY
          rm .github/workflows/install-outcome-images.yml
      - name: Commit production update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-business-transformation-academy/index.html .github/workflows/install-outcome-images.yml
          git commit -m 'Use client-approved Outcome images on production'
          git push
