name: Patch Accounting image and export latest HTML

on:
  push:
    paths:
      - '.github/workflows/patch-accounting-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch production HTML and export copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ai-business-transformation-academy/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/insights/hq/accounting.avif', 'assets/accounting-workflow-final.webp?v=accounting-final')
          p.write_text(s, encoding='utf-8')
          Path('RELEARNOS-latest.html').write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-business-transformation-academy/index.html RELEARNOS-latest.html
          git commit -m "Use final Accounting image and export latest HTML" || exit 0
          git push
