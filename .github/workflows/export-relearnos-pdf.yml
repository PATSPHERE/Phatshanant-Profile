name: Export RELEARNOS PDF
on:
  push:
    paths:
      - '.github/workflows/export-relearnos-pdf.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    env:
      PW_TEST_SCREENSHOT_NO_FONTS_READY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --break-system-packages pillow
      - name: Capture webpage
        run: |
          python3 -m http.server 8000 >/tmp/relearnos-http.log 2>&1 &
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 }, deviceScaleFactor: 1 });
          page.setDefaultTimeout(20000);
          await page.route('**/*', async route => {
            const u = route.request().url();
            if (u.includes('fonts.googleapis.com') || u.includes('fonts.gstatic.com')) return route.abort();
            return route.continue();
          });
          await page.goto('http://127.0.0.1:8000/ai-business-transformation-academy/index.html#programs', { waitUntil: 'commit', timeout: 15000 });
          await page.waitForTimeout(8000);
          await page.evaluate(() => {
            document.querySelectorAll('link[href*="fonts.googleapis.com"],link[href*="fonts.gstatic.com"]').forEach(e=>e.remove());
            document.documentElement.style.fontFamily='Arial, sans-serif';
            document.body.style.fontFamily='Arial, sans-serif';
            window.scrollTo(0,0);
          });
          await page.screenshot({ path: 'relearnos-full.png', fullPage: true, animations: 'disabled', timeout: 20000 });
          await browser.close();
          JS
          node capture.mjs
      - name: Build multipage PDF
        run: |
          python3 - <<'PY'
          from PIL import Image
          src=Image.open('relearnos-full.png').convert('RGB')
          w,h=src.size
          page_h=round(w*1.4142)
          pages=[]
          y=0
          while y<h:
              crop=src.crop((0,y,w,min(y+page_h,h)))
              if crop.height < page_h:
                  canvas=Image.new('RGB',(w,page_h),'white')
                  canvas.paste(crop,(0,0))
                  crop=canvas
              pages.append(crop)
              y += page_h
          out='ai-business-transformation-academy/RELEARNOS-Final-Thai-Web.pdf'
          pages[0].save(out, save_all=True, append_images=pages[1:], resolution=144.0)
          print(out, len(pages), 'pages')
          PY
      - name: Commit PDF
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-business-transformation-academy/RELEARNOS-Final-Thai-Web.pdf
          git diff --cached --quiet && exit 0
          git commit -m 'Export RELEARNOS Final Thai webpage PDF'
          git push