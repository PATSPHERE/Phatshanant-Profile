<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F3FAFE">
<title>3A Prompt Playbook | RELEARN OS × QPM</title>
<style>
*{box-sizing:border-box}
:root{--blue:#1767D1;--ink:#17345B;--line:#D9E8F1;--bg:#F3FAFE}
html,body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans Thai",sans-serif;color:var(--ink)}
.shell{max-width:920px;margin:0 auto;padding:16px}
.toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(243,250,254,.96);backdrop-filter:blur(10px);padding:10px 0 14px}
.back{color:var(--blue);text-decoration:none;font-weight:800;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--blue);border-radius:11px;padding:9px 12px;font-weight:800;font-size:12px;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.intro{padding:8px 2px 14px}
.intro h1{font-size:22px;margin:0 0 5px}
.intro p{font-size:13px;color:#64778D;line-height:1.55;margin:0}
.pages{display:grid;gap:18px}
.page{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 12px 30px rgba(28,75,113,.09);border:1px solid var(--line)}
.page img{display:block;width:100%;height:auto}
.caption{padding:9px 12px;border-top:1px solid var(--line);font-size:11px;color:#73869A;text-align:right}
.footer{padding:24px 0 32px;font-size:11px;color:#7A8A9A;text-align:center}
@media(max-width:720px){.shell{padding:10px}.toolbar{padding-top:7px}.intro h1{font-size:19px}.pages{gap:12px}.page{border-radius:13px}}
@page{size:A4 portrait;margin:8mm}
@media print{
  body{background:#fff}
  .toolbar,.intro,.caption,.footer{display:none!important}
  .shell{max-width:none;padding:0}
  .pages{display:block}
  .page{border:0;border-radius:0;box-shadow:none;margin:0;break-after:page;page-break-after:always;height:281mm;display:flex;align-items:center;justify-content:center}
  .page:last-child{break-after:auto;page-break-after:auto}
  .page img{max-width:194mm;max-height:281mm;width:auto;height:auto}
}
</style>
</head>
<body>
<div class="shell">
  <div class="toolbar">
    <a class="back" href="prompt-template.html">← Section 3A</a>
    <div class="actions">
      <button class="btn primary" onclick="window.print()">บันทึก 4 หน้าเป็น PDF</button>
      <a class="btn" href="prompt-starter-library.html">Prompt Starter Library</a>
    </div>
  </div>
  <div class="intro">
    <h1>3A Prompt Playbook</h1>
    <p>เวอร์ชันที่อนุมัติสำหรับผู้เรียน • แสดงภาพต้นฉบับ 4 หน้าตาม Master โดยไม่ปรับ Layout ใหม่</p>
  </div>
  <main class="pages">
    <section class="page"><img src="assets/3a-playbook-01.jpg" alt="3A Prompt Playbook page 1"><div class="caption">01 / 04</div></section>
    <section class="page"><img src="assets/3a-playbook-02.jpg" alt="3A Prompt Playbook page 2"><div class="caption">02 / 04</div></section>
    <section class="page"><img src="assets/3a-playbook-03.jpg" alt="3A Prompt Playbook page 3"><div class="caption">03 / 04</div></section>
    <section class="page"><img src="assets/3a-playbook-04.jpg" alt="3A Prompt Playbook page 4"><div class="caption">04 / 04</div></section>
  </main>
  <div class="footer">RELEARN OS × QPM • PREPARE • TRANSFORM • PERFORM</div>
</div>
</body>
</html>
