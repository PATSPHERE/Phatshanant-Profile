<script>
function saveDataUrl(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function downloadImages(){
 for(let i=1;i<=4;i++){saveDataUrl(document.getElementById('p'+i).src,'RELEARN_OS_QPM_3A_Playbook_'+String(i).padStart(2,'0')+'.jpg');await new Promise(r=>setTimeout(r,350))}
}
async function downloadPDF(){
 if(!window.jspdf){alert('กำลังโหลดระบบ PDF กรุณาลองอีกครั้ง');return}
 const {jsPDF}=window.jspdf;
 let pdf=null;
 for(let i=1;i<=4;i++){
   const img=document.getElementById('p'+i);
   if(!img.complete) await new Promise(r=>img.addEventListener('load',r,{once:true}));
   const w=img.naturalWidth,h=img.naturalHeight;
   const orient=w>h?'landscape':'portrait';
   if(!pdf) pdf=new jsPDF({orientation:orient,unit:'px',format:[w,h],hotfixes:['px_scaling']});
   else pdf.addPage([w,h],orient);
   pdf.addImage(img.src,'JPEG',0,0,w,h,undefined,'FAST');
 }
 pdf.save('RELEARN_OS_QPM_Section3A_Prompt_Playbook.pdf');
}
</script>
