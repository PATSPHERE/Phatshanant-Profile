<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Section 4 · Email + AI Guided Demo | RELEARN OS × QPM</title>
<style>
:root{--blue:#1767d1;--cyan:#2db8d8;--green:#35ad62;--ink:#17345b;--muted:#64748b;--line:#d9e8f1;--bg:#eef7fb;--warn:#fff5d6}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}body{overflow:hidden}
.shell{height:100vh;display:grid;grid-template-rows:68px 1fr 64px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-weight:900;font-size:22px}.brand .r{color:var(--blue)}.brand .o{color:var(--green)}
.badge{margin-left:12px;padding:7px 10px;border-radius:999px;background:#eaf3ff;color:var(--blue);font-size:11px;font-weight:900}
main{display:grid;grid-template-columns:minmax(650px,1.35fr) minmax(340px,.65fr);gap:18px;padding:18px 22px;min-height:0}
.sim,.guide{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 38px rgba(30,69,110,.10);overflow:hidden}
.sim{display:grid;grid-template-rows:48px 1fr}.simhead{display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-size:12px;background:#fbfdff}
.stage{position:relative;background:linear-gradient(135deg,#f6fbff,#eef8fc);padding:18px;overflow:auto}
.window{width:min(100%,1080px);height:610px;margin:auto;background:#fff;border:1px solid #dfe7ee;border-radius:18px;overflow:hidden;box-shadow:0 18px 48px rgba(20,42,68,.14);display:grid;grid-template-columns:250px 1fr}
.sidebar{background:#f8fbfd;border-right:1px solid #e6edf2;padding:16px}
.mailLogo{font-weight:900;color:#1c4b77;font-size:20px;margin-bottom:18px}.compose{background:#1767d1;color:#fff;padding:11px 13px;border-radius:12px;font-weight:800;font-size:12px;margin-bottom:12px}
.menu{padding:9px 10px;border-radius:10px;font-size:12px;color:#496075}.menu.active{background:#eaf3ff;color:#1767d1;font-weight:800}
.content{display:grid;grid-template-rows:58px 1fr}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e7edf2}.toolbar b{font-size:14px}.workspace{position:relative;padding:22px;overflow:auto}
.card{border:1px solid #e0e7ee;border-radius:16px;padding:16px;background:#fff}.emailmeta{font-size:11px;color:#6b7c8e;margin-bottom:10px}.emailbody{font-size:13px;line-height:1.65;color:#34495e}
.ai{margin-top:16px;border:1px solid #d7e4ed;border-radius:16px;padding:16px;background:#fbfdff}.ai h3{margin:0 0 10px;font-size:15px}.prompt{background:#f6f9fc;border:1px solid #dce5eb;border-radius:12px;padding:12px;font-size:12px;line-height:1.6;color:#42576c}
.output{margin-top:12px;background:#fff;border:1px dashed #cbdbe7;border-radius:12px;padding:12px;font-size:12px;line-height:1.65;color:#31465d}
.table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}.table th,.table td{border:1px solid #dfe7ee;padding:8px;text-align:left;vertical-align:top}.table th{background:#f4f8fb}
.spot{position:absolute;border:4px solid #27aa5f;border-radius:14px;box-shadow:0 0 0 5px rgba(39,170,95,.12),0 8px 24px rgba(23,52,91,.10);display:none;z-index:50;pointer-events:none;transition:left .22s ease,top .22s ease,width .22s ease,height .22s ease}.spotnum{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:none;place-items:center;font-size:12px;font-weight:900;z-index:51}
.guide{padding:20px;display:flex;flex-direction:column}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--blue)}.guide h2{font-size:25px;line-height:1.25;margin:7px 0 8px}.guide p{font-size:12px;line-height:1.65;color:#5f7185;margin:0}
.info{margin-top:12px;border:1px solid var(--line);background:#f5f9fc;border-radius:15px;padding:12px}.info b{display:block;color:var(--blue);font-size:11px;margin-bottom:4px}.human{background:var(--warn);border-color:#ecd98a}.human b{color:#9b6a00}.next{background:#eef9f4;border-color:#cfe8d6}.next b{color:var(--green)}
footer{display:flex;align-items:center;justify-content:space-between;padding:9px 22px;background:#fff;border-top:1px solid var(--line)}.controls{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:12px}.primary{background:linear-gradient(90deg,var(--blue),var(--cyan));color:#fff}.secondary{background:#edf3f7;color:#35485d}.progress{font-size:11px;color:#687b8f;text-align:center}.bar{width:220px;height:7px;background:#e2ebf1;border-radius:999px;overflow:hidden;margin-top:4px}.bar>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:16.6%}.note{font-size:10px;color:#748599}
@media(max-width:980px){body{overflow:auto}.shell{height:auto;grid-template-rows:auto auto auto}main{grid-template-columns:1fr}.stage{min-height:720px}.window{transform:scale(.82);transform-origin:top center}}
</style></head><body><div class="shell">
<header><div><span class="brand"><span class="r">RELEARN</span> <span class="o">OS</span></span><span class="badge">SECTION 4 · REAL WORK USE CASE</span></div><div><b>Email + AI Guided Demo</b><br><small>จากอีเมล 1 ฉบับ → คำตอบที่ใช้ได้</small></div></header>
<main><section class="sim"><div class="simhead"><b id="simTitle"></b><span>Interactive Simulation · ChatGPT-style workflow</span></div><div class="stage" id="stage"></div></section>
<aside class="guide"><div class="eyebrow" id="eyebrow"></div><h2 id="title"></h2><p id="body"></p><div class="info"><b>สิ่งที่ต้องจำ</b><p id="memory"></p></div><div class="info human"><b>Human Check</b><p id="human"></p></div><div class="info next"><b>ถัดไปคืออะไร</b><p id="nextText"></p></div></aside></main>
<footer><div class="controls"><button class="btn secondary" id="prev">← ก่อนหน้า</button><button class="btn primary" id="next">ถัดไป →</button><button class="btn secondary" id="reset">เริ่มใหม่</button></div><div class="progress"><div id="count"></div><div class="bar"><div id="fill"></div></div></div><div class="note">RELEARN OS · Input → Prompt → Output → Refine → Human Check → Use</div></footer>
</div>
<script>
const $=id=>document.getElementById(id);
function shell(inner){return '<div class="window"><aside class="sidebar"><div class="mailLogo">Property Mail</div><div class="compose">＋ New message</div><div class="menu active">Inbox</div><div class="menu">Sent</div><div class="menu">Residents</div><div class="menu">Incident</div></aside><section class="content"><div class="toolbar"><b>Inbox · Resident Request</b><span>09:42</span></div><div class="workspace">'+inner+'</div></section></div><div class="spot" id="spot"></div><div class="spotnum" id="spotnum"></div>'}
const email='<div class="card"><div id="inputMail"><div class="emailmeta">From: resident@example.com · Subject: ขอแจ้งปัญหาเสียงดังช่วงกลางคืน</div><div class="emailbody">เรียนฝ่ายอาคาร<br><br>ช่วง 3 คืนที่ผ่านมา ห้องข้าง ๆ มีเสียงดังหลัง 23:30 น. ทำให้นอนไม่ได้ รบกวนช่วยตรวจสอบให้หน่อยค่ะ ถ้าเป็นไปได้อยากให้แจ้งกลับด้วยว่าจะดำเนินการอย่างไร<br><br>ขอบคุณค่ะ<br>ลูกบ้าน</div></div></div>';
const steps=[
{sim:"Step 1 · Input",eye:"USE CASE 1/6",title:"เริ่มจากอีเมลจริง 1 ฉบับ",body:"อ่านข้อความก่อนว่าใครส่งมา ต้องการอะไร มีข้อมูลอะไรชัด และอะไรยังขาด",memory:"ยังไม่ต้องรีบตอบ ให้แยก Context และข้อมูลสำคัญก่อน",human:"ตรวจว่ามีข้อมูลส่วนบุคคลหรือข้อมูลที่ไม่ควรส่งเข้า AI หรือไม่",next:"สร้าง Prompt ที่ชัด",view:"input",target:"inputMail"},
{sim:"Step 2 · Prompt",eye:"USE CASE 2/6",title:"ใช้ Prompt บอกบริบท งาน และรูปแบบผลลัพธ์",body:"ไม่สั่งแค่ “ช่วยตอบอีเมลนี้” แต่กำหนดโทน สิ่งที่ต้องทำ และข้อห้าม",memory:"Prompt ที่ดีช่วยลดการเดาและทำให้คำตอบพร้อมใช้มากขึ้น",human:"ห้ามให้ AI รับปากสิ่งที่องค์กรยังไม่ได้ยืนยัน",next:"ดู Draft แรก",view:"prompt",target:"promptBox"},
{sim:"Step 3 · AI Draft",eye:"USE CASE 3/6",title:"AI ร่างคำตอบแรกให้",body:"AI ช่วยจัดภาษาและโครงคำตอบ แต่ Draft แรกยังไม่ใช่คำตอบสุดท้าย",memory:"ดูว่าครบ 3 เรื่องหรือไม่: รับทราบ / บอกสิ่งที่จะตรวจ / บอกการติดตามผล",human:"ตรวจว่ามีคำสัญญาเกินจริง วันเวลา หรือขั้นตอนที่ไม่ได้รับรองหรือไม่",next:"Refine ให้เหมาะกับบริบทจริง",view:"draft",target:"draftBox"},
{sim:"Step 4 · Refine",eye:"USE CASE 4/6",title:"Refine ให้สุภาพ กระชับ และไม่รับปากเกินจริง",body:"เพิ่มคำสั่งให้ AI ปรับเฉพาะจุด เช่น ลดความแข็ง ตัดคำฟุ่มเฟือย และระบุว่า “ฝ่ายอาคารจะตรวจสอบ” แทนการรับรองผล",memory:"Refine = แก้ Prompt เพื่อให้ Output ใกล้งานจริงขึ้น",human:"อย่าแก้แค่ภาษา ต้องตรวจสาระและขอบเขตอำนาจด้วย",next:"แยก Next Step ภายใน",view:"refine",target:"refineBox"},
{sim:"Step 5 · Action",eye:"USE CASE 5/6",title:"จากอีเมล → Action ภายใน",body:"นอกจากตอบลูกบ้าน AI ช่วยแยกสิ่งที่ทีมต้องทำต่อได้ เช่น ตรวจ CCTV / แจ้ง รปภ. / บันทึก Incident / Follow-up",memory:"คำตอบลูกค้าและงานหลังบ้านควรถูกแยกออกจากกัน",human:"Owner และเวลาที่ใช้จริงต้องให้ทีมกำหนด ไม่ควรให้ AI เดา",next:"Human Check ก่อนส่ง",view:"action",target:"actionTable"},
{sim:"Step 6 · Human Check",eye:"USE CASE 6/6",title:"ตรวจแล้วค่อยส่ง",body:"ก่อนส่ง ให้คนตรวจข้อเท็จจริง โทน ข้อมูลส่วนบุคคล และสิ่งที่องค์กรยืนยันได้",memory:"AI ช่วยร่าง แต่ผู้รับผิดชอบเป็นคนอนุมัติคำตอบสุดท้าย",human:"Fact • Privacy • Tone • Commitment • Next Step",next:"พร้อมนำไปใช้จริง",view:"final",target:"humanCheckBox"}
];
function renderStage(s){
let inner=email;
if(s.view==="prompt") inner+= '<div class="ai" id="promptBox"><h3>Prompt</h3><div class="prompt">บริบท: คุณเป็นผู้ช่วยฝ่ายอาคารของคอนโด<br>งาน: ร่างคำตอบอีเมลลูกบ้านฉบับนี้<br>โทน: สุภาพ เป็นมืออาชีพ กระชับ<br>ข้อจำกัด: ห้ามรับปากผลการดำเนินการที่ยังไม่ได้ตรวจสอบ<br>Output: 1) คำตอบพร้อมส่ง 2) สิ่งที่ทีมต้องทำต่อ 3 ข้อ</div></div>';
if(s.view==="draft") inner+= '<div class="ai" id="draftBox"><h3>AI Draft</h3><div class="output">เรียนคุณลูกบ้าน<br><br>ขอบคุณที่แจ้งข้อมูลเข้ามา ทางฝ่ายอาคารได้รับทราบเรื่องเสียงรบกวนช่วงกลางคืนแล้ว และจะดำเนินการตรวจสอบข้อมูลที่เกี่ยวข้อง รวมถึงประสานทีมที่รับผิดชอบเพื่อพิจารณาขั้นตอนที่เหมาะสม<br><br>เมื่อมีข้อมูลเพิ่มเติม ทางฝ่ายอาคารจะติดต่อกลับอีกครั้งค่ะ</div></div>';
if(s.view==="refine") inner+= '<div class="ai" id="refineBox"><h3>Refine Prompt</h3><div class="prompt">ปรับ Draft ให้สั้นลง 20% และเป็นมิตรขึ้น แต่คงสาระเดิม ห้ามใช้คำว่า “จะดำเนินการทันที” หรือระบุเวลาตอบกลับถ้ายังไม่มีข้อมูลยืนยัน</div><div class="output"><b>Refined Draft</b><br>เรียนคุณลูกบ้าน<br><br>ขอบคุณที่แจ้งข้อมูลเข้ามาค่ะ ฝ่ายอาคารได้รับทราบเรื่องเสียงรบกวนช่วงกลางคืนแล้ว และจะตรวจสอบข้อมูลที่เกี่ยวข้อง รวมถึงประสานทีมที่รับผิดชอบต่อไป<br><br>หากมีความคืบหน้า ฝ่ายอาคารจะแจ้งให้ทราบอีกครั้งค่ะ</div></div>';
if(s.view==="action") inner+= '<div class="ai" id="actionTable"><h3>Internal Action Items</h3><table class="table"><tr><th>Action</th><th>Owner</th><th>Status</th></tr><tr><td>ตรวจข้อมูลเหตุการณ์/พื้นที่</td><td>ต้องกำหนด</td><td>Open</td></tr><tr><td>ประสาน รปภ. / ทีมอาคาร</td><td>ต้องกำหนด</td><td>Open</td></tr><tr><td>บันทึก Incident และติดตามผล</td><td>ต้องกำหนด</td><td>Open</td></tr></table></div>';
if(s.view==="final") inner+= '<div class="ai" id="finalBox"><h3>Final Ready-to-Send</h3><div class="output">เรียนคุณลูกบ้าน<br><br>ขอบคุณที่แจ้งข้อมูลเข้ามาค่ะ ฝ่ายอาคารได้รับทราบเรื่องเสียงรบกวนช่วงกลางคืนแล้ว และจะตรวจสอบข้อมูลที่เกี่ยวข้อง รวมถึงประสานทีมที่รับผิดชอบต่อไป<br><br>หากมีความคืบหน้า ฝ่ายอาคารจะแจ้งให้ทราบอีกครั้งค่ะ<br><br>ขอแสดงความนับถือ<br>ฝ่ายอาคาร</div><div class="prompt" id="humanCheckBox" style="margin-top:10px"><b>Human Check:</b> ตรวจชื่อผู้รับ / ข้อเท็จจริง / นโยบายอาคาร / ผู้รับผิดชอบ / ช่องทางติดตาม</div></div>';
$("stage").innerHTML=shell(inner); setTimeout(()=>spotlight(s.target),120)
}
function spotlight(id){
  const el=$(id),stage=$("stage"),sp=$("spot"),n=$("spotnum");
  if(!el||!stage||!sp||!n)return;

  const workspace=el.closest(".workspace");
  if(workspace){
    const er=el.getBoundingClientRect(), wr=workspace.getBoundingClientRect();
    const desired=workspace.scrollTop+(er.top-wr.top)-Math.max(20,(workspace.clientHeight-er.height)/2);
    workspace.scrollTo({top:Math.max(0,desired),behavior:"smooth"});
  }

  setTimeout(()=>{
    const st=stage.getBoundingClientRect();
    const r=el.getBoundingClientRect();
    const pad=10;
    const left=r.left-st.left+stage.scrollLeft-pad;
    const top=r.top-st.top+stage.scrollTop-pad;
    sp.style.left=left+"px";
    sp.style.top=top+"px";
    sp.style.width=(r.width+pad*2)+"px";
    sp.style.height=(r.height+pad*2)+"px";
    sp.style.display="block";
    n.style.left=Math.max(6,left-10)+"px";
    n.style.top=Math.max(6,top-10)+"px";
    n.style.display="grid";
    n.textContent=i+1;
  },260);
}
let i=0;function render(){const s=steps[i];$("simTitle").textContent=s.sim;$("eyebrow").textContent=s.eye;$("title").textContent=s.title;$("body").textContent=s.body;$("memory").textContent=s.memory;$("human").textContent=s.human;$("nextText").textContent=s.next;$("count").textContent=(i+1)+" / "+steps.length;$("fill").style.width=((i+1)/steps.length*100)+"%";$("prev").disabled=i===0;$("next").textContent=i===steps.length-1?"จบ Demo ✓":"ถัดไป →";renderStage(s)}
$("next").onclick=()=>{if(i<steps.length-1){i++;render()}};$("prev").onclick=()=>{if(i>0){i--;render()}};$("reset").onclick=()=>{i=0;render()};document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&i<steps.length-1){i++;render()}if(e.key==="ArrowLeft"&&i>0){i--;render()}});window.addEventListener("resize",()=>setTimeout(()=>spotlight(steps[i].target),120));render();
</script></body></html>
