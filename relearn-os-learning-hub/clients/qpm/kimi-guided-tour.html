<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RELEARN OS × QPM · Kimi Bonus Guided Tour</title>
<style>
:root{--blue:#1767d1;--cyan:#2bb7da;--green:#36ad67;--ink:#20334b;--muted:#64748b;--line:#dbe7ef;--soft:#f5f9fc;--yellow:#fff5d6;--kimi:#111827;--purple:#6d5dfc}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Tahoma,"Noto Sans Thai",sans-serif;background:#edf6fb;color:var(--ink)}body{overflow:hidden}
.shell{height:100vh;display:grid;grid-template-rows:68px 1fr 64px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}.wordmark{font-weight:900;font-size:22px}.wordmark .r{color:var(--blue)}.wordmark .o{color:var(--green)}
.badge{padding:7px 12px;border-radius:999px;background:#efeefe;color:#5747e7;font-size:12px;font-weight:900}
main{display:grid;grid-template-columns:minmax(620px,1.35fr) minmax(340px,.65fr);gap:18px;padding:18px 22px;min-height:0}
.sim,.guide{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 38px rgba(30,69,110,.10);overflow:hidden}
.sim{display:grid;grid-template-rows:48px 1fr}.simhead{display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);font-size:12px;background:#fbfdff}
.stage{position:relative;background:linear-gradient(135deg,#f6f8ff,#f5fbff);display:grid;place-items:center;padding:18px;overflow:auto}
.desktop{width:min(100%,1080px);height:610px;background:#fff;border:1px solid #e3e7ee;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:245px 1fr;box-shadow:0 18px 48px rgba(20,42,68,.14);position:relative}
.sidebar{border-right:1px solid #eceff3;background:#fbfbfd;padding:18px 14px;display:flex;flex-direction:column}
.klogo{font-weight:900;font-size:26px;color:#111827;margin:3px 8px 20px}.new{background:#111827;color:#fff;border-radius:14px;padding:11px 13px;font-weight:800;font-size:13px;margin-bottom:10px}
.mitem{padding:10px 12px;border-radius:12px;font-size:12px;margin:2px 0;color:#374151}.mitem.active{background:#efefff;color:#5548df;font-weight:800}
.profile{margin-top:auto;padding:10px 8px;border-top:1px solid #e7e9ee;font-size:11px;color:#687386}
.workspace{position:relative;background:radial-gradient(circle at 65% 5%,#f0efff 0,#fafbff 28%,#fff 60%);overflow:hidden}
.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:76%;text-align:center}.hello{font-size:31px;font-weight:800;color:#1f2937}.sub{font-size:14px;color:#697386;margin-top:8px}
.prompt{margin-top:54px;border:1px solid #d9dee8;border-radius:22px;background:#fff;text-align:left;padding:15px 16px;box-shadow:0 5px 18px rgba(40,50,80,.06)}
.ph{font-size:13px;color:#9aa3af;margin-bottom:18px}.row{display:flex;align-items:center;gap:10px}.pill{padding:8px 11px;border-radius:999px;background:#f3f4f6;font-size:11px;font-weight:700}.send{margin-left:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#111827;color:#fff}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}.chip{padding:8px 10px;border:1px solid #e1e5eb;border-radius:999px;background:#fff;font-size:10.5px}
.overlay{position:absolute;left:24px;right:24px;top:24px;bottom:24px;background:#fff;border:1px solid #e0e5ec;border-radius:18px;box-shadow:0 16px 40px rgba(30,50,80,.18);padding:22px;display:none;overflow:auto}
.overlay h2{margin:0 0 12px;font-size:21px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{border:1px solid #e1e6ed;border-radius:15px;padding:14px;background:#fbfdff}.tile b{display:block;color:#5e50e5;margin-bottom:6px}.tile p{font-size:11px;line-height:1.55;color:#66778b;margin:0}.notice{margin-top:14px;padding:11px;border-radius:13px;background:#fff7dc;border:1px solid #efd88a;font-size:10.5px;line-height:1.55;color:#745600}
.spot{position:absolute;border:4px solid #25a65b;border-radius:15px;box-shadow:0 0 0 5px rgba(37,166,91,.12);display:none;z-index:50;pointer-events:none}.spotnum{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:none;place-items:center;font-size:12px;font-weight:900;z-index:51}
.guide{padding:20px;display:flex;flex-direction:column}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.1em;color:#5e50e5}.guide h2{font-size:25px;line-height:1.25;color:#17345b;margin:7px 0 8px}.guide p{font-size:12px;line-height:1.65;color:#5f7185;margin:0}.info{margin-top:12px;border:1px solid var(--line);background:var(--soft);border-radius:15px;padding:12px}.info b{display:block;color:var(--blue);font-size:11px;margin-bottom:4px}.human{background:var(--yellow);border-color:#ecd98a}.human b{color:#9b6a00}.next{background:#eef9f4;border-color:#cfe8d6}.next b{color:var(--green)}
footer{display:flex;align-items:center;justify-content:space-between;padding:9px 22px;background:#fff;border-top:1px solid var(--line)}.controls{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:12px}.primary{background:linear-gradient(90deg,var(--blue),var(--cyan));color:#fff}.secondary{background:#edf3f7;color:#35485d}.progress{font-size:11px;color:#687b8f;text-align:center}.bar{width:220px;height:7px;background:#e2ebf1;border-radius:999px;overflow:hidden;margin-top:4px}.bar>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:14.28%}.note{font-size:10px;color:#748599;text-align:right}
@media(max-width:980px){body{overflow:auto}.shell{height:auto}.shell{grid-template-rows:auto auto auto}main{grid-template-columns:1fr}.desktop{transform:scale(.82);transform-origin:center}.stage{min-height:720px}}
</style></head>
<body><div class="shell">
<header><div class="brand"><div class="wordmark"><span class="r">RELEARN</span> <span class="o">OS</span></div><span class="badge">BONUS · Kimi Guided Tour</span></div><div><b>Kimi · Bonus AI Tool</b><br><small>Chat · Files · Search · Agent · Office Work</small></div></header>
<main><section class="sim"><div class="simhead"><b id="simTitle"></b><span>Kimi Desktop Simulator</span></div><div class="stage" id="stage"></div></section>
<aside class="guide"><div class="eyebrow" id="eyebrow"></div><h2 id="title"></h2><p id="body"></p><div class="info"><b>สิ่งที่ต้องจำ</b><p id="memory"></p></div><div class="info human"><b>Human Check</b><p id="human"></p></div><div class="info next"><b>ถัดไปคืออะไร</b><p id="nextText"></p></div></aside></main>
<footer><div class="controls"><button class="btn secondary" id="prev">← ก่อนหน้า</button><button class="btn primary" id="next">ถัดไป →</button><button class="btn secondary" id="reset">เริ่มใหม่</button></div><div class="progress"><div id="count"></div><div class="bar"><div id="fill"></div></div></div><div class="note">RELEARN OS · Bonus Tool · Human Check Always</div></footer></div>
<script>
const $=id=>document.getElementById(id);
function base(){
return `<div class="desktop"><aside class="sidebar"><div class="klogo">Kimi</div><div class="new" id="newChat">＋ New session</div><div class="mitem active">Chat</div><div class="mitem" id="agentMenu">Agent</div><div class="mitem" id="researchMenu">Deep Research</div><div class="mitem" id="docsMenu">Docs & Sheets</div><div class="mitem" id="pptMenu">PPT</div><div class="mitem">Memory Space</div><div class="profile">Account · Settings</div></aside><section class="workspace"><div class="center" id="homeCenter"><div class="hello">How can Kimi help?</div><div class="sub">Ask, upload files, search, research, and create work outputs</div><div class="prompt" id="promptBox"><div class="ph">Ask Kimi anything…</div><div class="row"><span class="pill" id="upload">＋ File</span><span class="pill" id="modelPicker">K3 ▾</span><span class="pill" id="searchToggle">🌐 Search</span><span class="send">↑</span></div></div><div class="quick"><span class="chip">Analyze documents</span><span class="chip">Deep Research</span><span class="chip">Create PPT</span><span class="chip">Data analysis</span></div></div><div class="overlay" id="overlay"></div></section></div><div class="spot" id="spot"></div><div class="spotnum" id="spotnum"></div>`;}
const steps=[
{sim:"Kimi · Home",eye:"BONUS 1/7",title:"Kimi คือ AI Assistant ที่ไปไกลกว่า Chat",body:"Kimi ใช้คุย ถามคำถาม อัปโหลดไฟล์ ค้นเว็บ ทำ Research และทำงานเอกสารแบบ Agent ได้ในที่เดียว",memory:"จุดที่น่าสนใจสำหรับผู้เรียนคือ งานไฟล์ยาว Research และงาน Office แบบ end-to-end",human:"เลือกใช้เมื่อเหมาะกับงาน ไม่จำเป็นต้องใช้ทุกเครื่องมือ",next:"ดูการเลือกโมเดล",view:"home",target:"homeCenter"},
{sim:"Kimi · Model Selection",eye:"BONUS 2/7",title:"เลือกโมเดลตามงาน",body:"Kimi มีหลายโมเดล เช่น K2.6 สำหรับงานเร็ว และ K3 สำหรับงานสนทนา/Agent ที่ซับซ้อนกว่า",memory:"งานง่ายใช้รุ่นเร็ว งานซับซ้อนค่อยขยับไปโมเดลที่เก่งกว่า",human:"ชื่อโมเดลและสิทธิ์อาจเปลี่ยนตามการอัปเดตและแพ็กเกจ",next:"ลองงานไฟล์",view:"models",target:"modelPicker"},
{sim:"Kimi · Files",eye:"BONUS 3/7",title:"อัปโหลดไฟล์แล้วถามต่อได้",body:"Kimi รองรับเอกสารหลายประเภท เช่น PDF, Word, Excel, PPT, รูปภาพ และไฟล์ข้อความ",memory:"เหมาะกับการสรุปเอกสาร วิเคราะห์ไฟล์ และถามต่อจากข้อมูลชุดเดียวกัน",human:"ก่อนอัปโหลด ให้ตรวจข้อมูลส่วนบุคคล ข้อมูลลับ และสิทธิ์ในการนำไฟล์เข้า AI",next:"ดู Search",view:"files",target:"upload"},
{sim:"Kimi · Search",eye:"BONUS 4/7",title:"Search ช่วยดึงข้อมูลปัจจุบันพร้อมแหล่งอ้างอิง",body:"Kimi สามารถใช้ Web Search เพื่อหาข้อมูลล่าสุด และแสดงลิงก์ต้นทางให้ตรวจสอบได้",memory:"ใช้เมื่อคำถามต้องการข้อมูลสด เช่น ข่าว ตลาด งานวิจัย หรือประกาศล่าสุด",human:"เปิดแหล่งต้นทางตรวจวันที่ ผู้เผยแพร่ และบริบทก่อนนำไปใช้",next:"ดู Agent",view:"search",target:"searchToggle"},
{sim:"Kimi · Agent",eye:"BONUS 5/7",title:"Agent = ให้เป้าหมาย แล้วให้ Kimi วางแผนหลายขั้นตอน",body:"Agent สามารถทำงานต่อเนื่อง เช่น Research → สรุป → สร้างเอกสาร → วิเคราะห์ข้อมูล โดยผู้ใช้กำหนดเป้าหมายปลายทาง",memory:"เหมาะกับงานหลายขั้น ไม่ใช่แค่ถาม-ตอบหนึ่งครั้ง",human:"งาน Agent อาจใช้เวลานานและใช้เครดิตมากกว่า Chat ปกติ ควรระบุขอบเขตและ Output ให้ชัด",next:"ดูงาน Office",view:"agent",target:"agentMenu"},
{sim:"Kimi · Office Work",eye:"BONUS 6/7",title:"Docs · Sheets · PPT คือจุดเด่นสำหรับงานสำนักงาน",body:"Kimi Agent รองรับงานเอกสาร Word/PDF, วิเคราะห์ Excel/CSV และสร้าง PPT แบบ end-to-end",memory:"ถ้าต้องการไฟล์ที่นำไปแก้ต่อได้ ให้ระบุชนิดไฟล์ โครงสร้าง และข้อจำกัดตั้งแต่ต้น",human:"ตรวจตัวเลข สูตร ตาราง รูปแบบ และเนื้อหาก่อนส่งต่อหรือใช้งานจริง",next:"ปิดด้วย Prompt → Verify",view:"office",target:"docsMenu"},
{sim:"Kimi · Prompt → Verify",eye:"BONUS 7/7",title:"ใช้ Kimi แบบ RELEARN OS: Goal → Context → Output → Check",body:"เริ่มจากบอกเป้าหมาย ใส่ข้อมูลที่จำเป็น ระบุ Output ที่ต้องการ แล้วตรวจผลลัพธ์ก่อนใช้งาน",memory:"Kimi เหมาะเป็น Bonus Tool สำหรับ Long Context, Research, Files และ Agentic Office Work",human:"AI ช่วยทำงานได้มากขึ้น แต่ความรับผิดชอบต่อข้อมูลและการตัดสินใจยังเป็นของมนุษย์",next:"จบ Kimi Bonus Guided Tour",view:"prompt",target:"promptBox"}
];
let i=0;
function spotlight(id){const el=$(id),st=$("stage").getBoundingClientRect();if(!el)return;const r=el.getBoundingClientRect(),s=$("spot"),n=$("spotnum");s.style.left=(r.left-st.left-5)+"px";s.style.top=(r.top-st.top-5)+"px";s.style.width=(r.width+10)+"px";s.style.height=(r.height+10)+"px";s.style.display="block";n.style.left=Math.max(6,r.left-st.left-14)+"px";n.style.top=Math.max(6,r.top-st.top-14)+"px";n.style.display="grid";n.textContent=i+1}
function renderStage(s){$("stage").innerHTML=base();const o=$("overlay");
if(s.view==="models"){o.innerHTML='<h2>เลือกโมเดลตามงาน</h2><div class="grid3"><div class="tile"><b>K2.6</b><p>เหมาะกับคำถามทั่วไปและงานที่ต้องการความเร็ว</p></div><div class="tile"><b>K3</b><p>เหมาะกับงานสนทนาและ Agent ที่ซับซ้อนกว่า</p></div><div class="tile"><b>K3 Swarm</b><p>เหมาะกับงานค้นหาและประมวลผลขนาดใหญ่แบบหลายงานพร้อมกัน</p></div></div>';o.style.display="block"}
else if(s.view==="files"){o.innerHTML='<h2>File Processing</h2><div class="grid3"><div class="tile"><b>PDF / Word</b><p>สรุป เปรียบเทียบ และถามต่อจากเอกสาร</p></div><div class="tile"><b>Excel / CSV</b><p>วิเคราะห์ข้อมูล สูตร และโครงสร้างตาราง</p></div><div class="tile"><b>PPT / Images / Video</b><p>เข้าใจเนื้อหาและนำไปต่อยอดงานได้</p></div></div>';o.style.display="block"}
else if(s.view==="search"){o.innerHTML='<h2>Web Search</h2><div class="grid3"><div class="tile"><b>ข้อมูลปัจจุบัน</b><p>ค้นข้อมูลใหม่กว่าความรู้ในโมเดล</p></div><div class="tile"><b>แหล่งอ้างอิง</b><p>เปิดลิงก์ต้นทางเพื่อตรวจสอบได้</p></div><div class="tile"><b>หลายภาษา</b><p>ค้นและสรุปข้อมูลข้ามภาษาได้</p></div></div>';o.style.display="block"}
else if(s.view==="agent"){o.innerHTML='<h2>Kimi Agent</h2><div class="grid3"><div class="tile"><b>Plan</b><p>แตกเป้าหมายเป็นหลายขั้นตอน</p></div><div class="tile"><b>Use Tools</b><p>ค้นเว็บ วิเคราะห์ไฟล์ เขียนโค้ด หรือสร้างเอกสาร</p></div><div class="tile"><b>Deliver</b><p>ส่งผลลัพธ์ปลายทาง เช่น รายงาน เว็บไซต์ หรือ PPT</p></div></div><div class="notice">งาน Agent อาจใช้เวลาหลายนาทีและใช้เครดิตมากกว่า Chat ปกติ</div>';o.style.display="block"}
else if(s.view==="office"){o.innerHTML='<h2>Office Work</h2><div class="grid3"><div class="tile"><b>Docs</b><p>เขียน แก้ จัดรูปแบบ และส่งออกเอกสาร</p></div><div class="tile"><b>Sheets</b><p>วิเคราะห์ Excel/CSV และสร้างรายงาน</p></div><div class="tile"><b>PPT</b><p>สร้าง Presentation ตั้งแต่โครงถึงไฟล์ใช้งาน</p></div></div>';o.style.display="block"}
else if(s.view==="prompt"){$("promptBox").innerHTML='<div class="ph" style="color:#475569">เป้าหมาย: วิเคราะห์รายงานนี้และสร้าง Executive Summary 1 หน้า<br>ข้อจำกัด: ห้ามเดาข้อมูลที่ไม่มีในไฟล์<br>Output: Key Findings / Risks / Next Actions</div><div class="row"><span class="pill">＋ File</span><span class="pill">K3 ▾</span><span class="send">↑</span></div>'}
setTimeout(()=>spotlight(s.target),80)}
function render(){const s=steps[i];$("simTitle").textContent=s.sim;$("eyebrow").textContent=s.eye;$("title").textContent=s.title;$("body").textContent=s.body;$("memory").textContent=s.memory;$("human").textContent=s.human;$("nextText").textContent=s.next;$("count").textContent=(i+1)+" / "+steps.length;$("fill").style.width=((i+1)/steps.length*100)+"%";$("prev").disabled=i===0;$("next").textContent=i===steps.length-1?"จบ Tour ✓":"ถัดไป →";renderStage(s)}
$("next").onclick=()=>{if(i<steps.length-1){i++;render()}};$("prev").onclick=()=>{if(i>0){i--;render()}};$("reset").onclick=()=>{i=0;render()};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&i<steps.length-1){i++;render()}if(e.key==="ArrowLeft"&&i>0){i--;render()}});
render();
</script></body></html>
