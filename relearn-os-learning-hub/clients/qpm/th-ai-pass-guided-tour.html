let i=0;const $=id=>document.getElementById(id);
function renderMobile(s){$("stage").innerHTML=mobilePages[s.page]+'<div class="spot" id="spot"></div><div class="spotnum" id="spotnum"></div>';setTimeout(()=>spotlight(s.target),80)}
function renderDesktop(s){
  $("stage").innerHTML=workspace(s.view)+'<div class="spot" id="spot"></div><div class="spotnum" id="spotnum"></div>';
  const p=$("overlayPanel");
  if(s.view==="compare"){
    p.innerHTML='<h2>เปรียบเทียบโมเดล — ทำไมถึงมีประโยชน์</h2><div class="grid3"><div class="tile"><b>โจทย์เดียว หลายโมเดล</b><p>เห็นความต่างของคำตอบจากโจทย์เดียวกันโดยไม่ต้องเดาเองว่าโมเดลไหนเหมาะ</p></div><div class="tile"><b>เทียบคุณภาพและสไตล์</b><p>ดูความละเอียด ความเร็ว วิธีอธิบาย และความเหมาะกับงานของแต่ละโมเดล</p></div><div class="tile"><b>เลือกก่อนใช้จริง</b><p>ช่วยให้ผู้เริ่มต้นเรียนรู้ข้อเด่นของแต่ละโมเดล แล้วเลือกให้เหมาะกับงาน</p></div></div>';
    p.style.display="block";
  }else if(s.view==="model"){
    p.innerHTML='<h2>Model Picker</h2><div class="grid3"><div class="tile"><b>General</b><p>งานทั่วไปและสนทนา</p></div><div class="tile"><b>Reasoning</b><p>โจทย์ที่ต้องคิดหลายขั้นตอน</p></div><div class="tile"><b>Creative / Media</b><p>งานภาพ วิดีโอ หรือสื่อ</p></div></div>';
    p.style.display="block";
  }else if(s.view==="chatmenu"){
    p.innerHTML='<h2>เมนูจัดการบทสนทนา</h2><div class="grid3"><div class="tile"><b>แชทใหม่</b><p>เริ่มบริบทใหม่ ช่วยไม่ให้งานคนละเรื่องปะปนกัน</p></div><div class="tile"><b>ค้นหาแชท</b><p>ย้อนกลับไปหางานเก่าได้เร็ว ไม่ต้องเริ่มต้นใหม่ทุกครั้ง</p></div><div class="tile"><b>ผลลัพธ์</b><p>จัดงานเป็นเรื่อง ๆ แล้วค้นย้อนหลังง่ายขึ้นเมื่อมีหลายโครงการ</p></div></div>';
    p.style.display="block";
  }else if(s.view==="promptlib"){
    p.innerHTML='<h2>Prompt Library</h2><div class="grid3"><div class="tile"><b>พร็อมต์</b><p>เลือก Prompt สำเร็จรูปตามงาน</p></div><div class="tile"><b>ชุดคำสั่งที่บันทึกไว้</b><p>บันทึกคำสั่งที่ใช้ซ้ำ</p></div><div class="tile"><b>Reuse</b><p>ลดเวลาพิมพ์ซ้ำและช่วยให้ทีมใช้รูปแบบเดียวกัน</p></div></div>';
    p.style.display="block";
  }else if(s.view==="learning"){
    p.innerHTML='<h2>Learning & Library</h2><div class="grid3"><div class="tile"><b>คลัง</b><p>รวมทรัพยากรหรือเนื้อหาที่บันทึกไว้</p></div><div class="tile"><b>เรียนรู้เกี่ยวกับ AI</b><p>ทบทวนความรู้และวิธีใช้ AI</p></div><div class="tile"><b>Apply</b><p>เรียนแล้วกลับมาลองใน Workspace</p></div></div>';
    p.style.display="block";
  }else if(s.view==="assist"){
    p.innerHTML='<h2>ผู้ช่วยอัจฉริยะ + โฟลเดอร์</h2><div class="grid3"><div class="tile"><b>ผู้ช่วยอัจฉริยะ</b><p>ผู้ช่วยเฉพาะงานหรือบริบท</p></div><div class="tile"><b>โฟลเดอร์</b><p>จัดกลุ่มบทสนทนาและงาน</p></div><div class="tile"><b>Governance</b><p>แยกบริบทและลดการปะปนของข้อมูล</p></div></div>';
    p.style.display="block";
  }else if(s.view==="prompt"){
    $("promptBox").innerHTML='<div class="ph" style="color:#475569">ช่วยสรุปรายงานนี้เป็น 5 ประเด็นสำคัญ พร้อม Action Items และสิ่งที่ต้องตรวจสอบเพิ่มเติม</div><div class="promptrow"><div class="plus">＋</div><div class="model">◉ GPT-5.6 Terra⌄</div><div class="senddot">➤</div></div>';
  }
  setTimeout(()=>spotlight(s.target),100);
}
function spotlight(id){const el=$(id),st=$("stage").getBoundingClientRect();if(!el)return;const r=el.getBoundingClientRect(),s=$("spot"),n=$("spotnum");s.style.left=(r.left-st.left-5)+"px";s.style.top=(r.top-st.top-5)+"px";s.style.width=(r.width+10)+"px";s.style.height=(r.height+10)+"px";s.style.display="block";n.style.left=Math.max(6,r.left-st.left-14)+"px";n.style.top=Math.max(6,r.top-st.top-14)+"px";n.style.display="grid";n.textContent=i+1}
function render(){const s=steps[i];$("simTitle").textContent=s.sim;$("modeText").textContent=s.mode==="mobile"?"Mobile Registration Simulator":"AiPASS Workspace Simulator";$("eyebrow").textContent=s.eye;$("tourTitle").textContent=s.title;$("tourBody").textContent=s.body;$("memory").textContent=s.memory;$("human").textContent=s.human;$("nextText").textContent=s.next;const isReg=s.mode==="mobile";$("regTab").classList.toggle("active",isReg);$("wsTab").classList.toggle("active",!isReg);$("count").textContent=(i+1)+" / "+steps.length;$("fill").style.width=((i+1)/steps.length*100)+"%";$("prev").disabled=i===0;$("next").textContent=i===steps.length-1?"จบ Tour ✓":"ถัดไป →";if(s.mode==="mobile")renderMobile(s);else renderDesktop(s)}
$("next").onclick=()=>{if(i<steps.length-1){i++;render()}};$("prev").onclick=()=>{if(i>0){i--;render()}};$("reset").onclick=()=>{i=0;render()};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&i<steps.length-1){i++;render()}if(e.key==="ArrowLeft"&&i>0){i--;render()}});
window.addEventListener("resize",()=>setTimeout(()=>spotlight(steps[i].target),100));render();
</script></body></html>
