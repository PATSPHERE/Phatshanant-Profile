<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Section 4 · Meeting Note + AI Guided Demo | RELEARN OS × QPM</title>
<style>
:root{--blue:#1767d1;--cyan:#2db8d8;--green:#35ad62;--ink:#17345b;--muted:#64748b;--line:#d9e8f1;--bg:#eef7fb;--warn:#fff5d6}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}body{overflow:hidden}
.shell{height:100vh;display:grid;grid-template-rows:68px 1fr 64px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-weight:900;font-size:22px}.brand .r{color:var(--blue)}.brand .o{color:var(--green)}
.badge{margin-left:12px;padding:7px 10px;border-radius:999px;background:#eaf3ff;color:var(--blue);font-size:11px;font-weight:900}
main{display:grid;grid-template-columns:minmax(650px,1.35fr) minmax(340px,.65fr);gap:18px;padding:18px 22px;min-height:0}
.sim,.guide{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 38px rgba(30,69,110,.10);overflow:hidden}
.sim{display:grid;grid-template-rows:48px 1fr}.simhead{display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-size:12px;background:#fbfdff}
.stage{position:relative;background:linear-gradient(135deg,#f6fbff,#eef8fc);padding:18px;overflow:auto}
.window{width:min(100%,1080px);height:610px;margin:auto;background:#fff;border:1px solid #dfe7ee;border-radius:18px;overflow:hidden;box-shadow:0 18px 48px rgba(20,42,68,.14);display:grid;grid-template-columns:250px 1fr}
.sidebar{background:#f8fbfd;border-right:1px solid #e6edf2;padding:16px}.appLogo{font-weight:900;color:#1c4b77;font-size:20px;margin-bottom:18px}.new{background:#1767d1;color:#fff;padding:11px 13px;border-radius:12px;font-weight:800;font-size:12px;margin-bottom:12px}
.menu{padding:9px 10px;border-radius:10px;font-size:12px;color:#496075}.menu.active{background:#eaf3ff;color:#1767d1;font-weight:800}
.content{display:grid;grid-template-rows:58px 1fr}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e7edf2}.toolbar b{font-size:14px}.workspace{position:relative;padding:22px;overflow:auto}
.card{border:1px solid #e0e7ee;border-radius:16px;padding:16px;background:#fff}.meta{font-size:11px;color:#6b7c8e;margin-bottom:10px}.body{font-size:13px;line-height:1.65;color:#34495e}
.ai{margin-top:16px;border:1px solid #d7e4ed;border-radius:16px;padding:16px;background:#fbfdff}.ai h3{margin:0 0 10px;font-size:15px}.prompt{background:#f6f9fc;border:1px solid #dce5eb;border-radius:12px;padding:12px;font-size:12px;line-height:1.6;color:#42576c}.output{margin-top:12px;background:#fff;border:1px dashed #cbdbe7;border-radius:12px;padding:12px;font-size:12px;line-height:1.65;color:#31465d}
.table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}.table th,.table td{border:1px solid #dfe7ee;padding:8px;text-align:left;vertical-align:top}.table th{background:#f4f8fb}
.spot{position:absolute;border:4px solid #27aa5f;border-radius:14px;box-shadow:0 0 0 5px rgba(39,170,95,.12);display:none;z-index:50;pointer-events:none}.spotnum{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:none;place-items:center;font-size:12px;font-weight:900;z-index:51}
.guide{padding:20px;display:flex;flex-direction:column}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--blue)}.guide h2{font-size:25px;line-height:1.25;margin:7px 0 8px}.guide p{font-size:12px;line-height:1.65;color:#5f7185;margin:0}
.info{margin-top:12px;border:1px solid var(--line);background:#f5f9fc;border-radius:15px;padding:12px}.info b{display:block;color:var(--blue);font-size:11px;margin-bottom:4px}.human{background:var(--warn);border-color:#ecd98a}.human b{color:#9b6a00}.next{background:#eef9f4;border-color:#cfe8d6}.next b{color:var(--green)}
footer{display:flex;align-items:center;justify-content:space-between;padding:9px 22px;background:#fff;border-top:1px solid var(--line)}.controls{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:12px}.primary{background:linear-gradient(90deg,var(--blue),var(--cyan));color:#fff}.secondary{background:#edf3f7;color:#35485d}.progress{font-size:11px;color:#687b8f;text-align:center}.bar{width:220px;height:7px;background:#e2ebf1;border-radius:999px;overflow:hidden;margin-top:4px}.bar>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:16.6%}.note{font-size:10px;color:#748599}
@media(max-width:980px){body{overflow:auto}.shell{height:auto;grid-template-rows:auto auto auto}main{grid-template-columns:1fr}.stage{min-height:720px}.window{transform:scale(.82);transform-origin:top center}}
</style></head><body><div class="shell">
<header><div><span class="brand"><span class="r">RELEARN</span> <span class="o">OS</span></span><span class="badge">SECTION 4 · REAL WORK USE CASE</span></div><div><b>Meeting Note + AI Guided Demo</b><br><small>จากบันทึกประชุม → Action ที่ชัดเจน</small></div></header>
<main><section class="sim"><div class="simhead"><b id="simTitle"></b><span>Interactive Simulation · ChatGPT-style workflow</span></div><div class="stage" id="stage"></div></section>
<aside class="guide"><div class="eyebrow" id="eyebrow"></div><h2 id="title"></h2><p id="body"></p><div class="info"><b>สิ่งที่ต้องจำ</b><p id="memory"></p></div><div class="info human"><b>Human Check</b><p id="human"></p></div><div class="info next"><b>ถัดไปคืออะไร</b><p id="nextText"></p></div></aside></main>
<footer><div class="controls"><button class="btn secondary" id="prev">← ก่อนหน้า</button><button class="btn primary" id="next">ถัดไป →</button><button class="btn secondary" id="reset">เริ่มใหม่</button></div><div class="progress"><div id="count"></div><div class="bar"><div id="fill"></div></div></div><div class="note">RELEARN OS · Input → Prompt → Output → Refine → Action → Human Check</div></footer>
</div>
<script>
const $=id=>document.getElementById(id);
function shell(inner){return '<div class="window"><aside class="sidebar"><div class="appLogo">Meeting Workspace</div><div class="new">＋ New meeting note</div><div class="menu active">Meeting Notes</div><div class="menu">Action Items</div><div class="menu">Follow-up</div><div class="menu">Archive</div></aside><section class="content"><div class="toolbar"><b>Weekly Operations Meeting</b><span>10:30–11:15</span></div><div class="workspace">'+inner+'</div></section></div><div class="spot" id="spot"></div><div class="spotnum" id="spotnum"></div>'}
const raw='<div class="card" id="rawNote"><div class="meta">Meeting: Weekly Operations · Property Management</div><div class="body">- ลูกบ้านแจ้งลิฟต์อาคาร B รอนานช่วง 07:30–09:00<br>- ฝ่ายอาคารจะเช็ก log การใช้งานลิฟต์และประสานช่าง<br>- เรื่องป้ายที่จอดรถใหม่ยังรอราคา Vendor<br>- คุณนิดจะตามราคาและส่งในกลุ่มภายในวันศุกร์<br>- มีข้อเสนอให้ทดลองสรุปรายงานประจำสัปดาห์จาก Excel เป็น dashboard<br>- ยังไม่ได้กำหนดว่าใครเป็น owner เรื่อง dashboard</div></div>';
const steps=[
{sim:"Step 1 · Input",eye:"USE CASE 1/6",title:"เริ่มจาก Meeting Note ดิบ",body:"เอาบันทึกประชุมจริงที่ยังไม่เป็นระบบมาเป็น Input ก่อน",memory:"แยกให้ออกว่าอะไรคือ Fact, Decision, Action และเรื่องที่ยังไม่ตัดสินใจ",human:"ตรวจข้อมูลส่วนบุคคลและข้อมูลภายในก่อนส่งเข้า AI",next:"สร้าง Prompt",view:"input",target:"rawNote"},
{sim:"Step 2 · Prompt",eye:"USE CASE 2/6",title:"สั่ง AI ให้จัดโครง ไม่ใช่แค่สรุป",body:"กำหนด Output ชัดว่าอยากได้ Decision / Action / Owner / Due Date / Open Question",memory:"Prompt ที่ดีต้องบอกทั้งโครงและข้อห้าม เช่น ห้ามเดา Owner หรือ Deadline",human:"ถ้า Meeting Note ไม่มีข้อมูล ให้ใช้คำว่า “ต้องกำหนด” แทนการเดา",next:"ดู AI Output",view:"prompt",target:"promptBox"},
{sim:"Step 3 · AI Output",eye:"USE CASE 3/6",title:"AI แปลงบันทึกประชุมเป็นโครงสร้าง",body:"จากข้อความกระจัดกระจาย กลายเป็นข้อมูลที่อ่านและติดตามได้",memory:"เป้าหมายคือทำให้สิ่งที่ต้องทำต่อมองเห็นทันที",human:"ตรวจว่า AI แยก Decision กับ Suggestion ถูกหรือไม่",next:"Refine จุดที่ยังคลุมเครือ",view:"output",target:"outputBox"},
{sim:"Step 4 · Refine",eye:"USE CASE 4/6",title:"Refine เฉพาะสิ่งที่ยังไม่ชัด",body:"สั่ง AI ให้แยก Open Questions และรายการที่ Owner/Deadline ยังไม่ถูกกำหนด",memory:"อย่าให้คำตอบดูสมบูรณ์เกินข้อมูลจริง",human:"รายการที่ไม่มี Owner หรือวันครบกำหนดต้องให้ทีมตัดสินใจเอง",next:"สร้าง Action Tracker",view:"refine",target:"refineBox"},
{sim:"Step 5 · Action",eye:"USE CASE 5/6",title:"เปลี่ยน Meeting Note เป็น Action Tracker",body:"ทำให้ทีมเห็นใครต้องทำอะไร เมื่อไร และสถานะคืออะไร",memory:"Meeting Summary มีไว้เข้าใจ / Action Tracker มีไว้ทำงานต่อ",human:"Owner และ Due Date สุดท้ายต้องได้รับการยืนยันจากคนที่รับผิดชอบ",next:"Human Check ก่อนแจกจ่าย",view:"action",target:"actionTable"},
{sim:"Step 6 · Human Check",eye:"USE CASE 6/6",title:"ตรวจแล้วค่อยแชร์",body:"ก่อนส่งสรุปประชุม ตรวจข้อเท็จจริง ผู้รับผิดชอบ วันกำหนด และเรื่องที่ยังไม่ตัดสินใจ",memory:"AI ช่วยจัดระบบ แต่คนในประชุมเป็นผู้รับรองสิ่งที่ตกลงจริง",human:"Fact • Decision • Owner • Deadline • Open Question",next:"พร้อมนำไปใช้จริง",view:"final",target:"finalBox"}
];
function renderStage(s){
let inner=raw;
if(s.view==="prompt") inner+='<div class="ai" id="promptBox"><h3>Prompt</h3><div class="prompt">จาก Meeting Note นี้ ช่วยจัดเป็น 5 ส่วน:<br>1) Key Decisions<br>2) Action Items<br>3) Owner<br>4) Due Date<br>5) Open Questions<br><br>ข้อจำกัด: ใช้เฉพาะข้อมูลที่มีในบันทึก ถ้าไม่มี Owner หรือ Due Date ให้เขียนว่า “ต้องกำหนด” ห้ามเดา</div></div>';
if(s.view==="output") inner+='<div class="ai" id="outputBox"><h3>AI Structured Output</h3><table class="table"><tr><th>ประเภท</th><th>รายละเอียด</th></tr><tr><td>Action</td><td>ตรวจ log ลิฟต์อาคาร B และประสานช่าง</td></tr><tr><td>Action</td><td>ติดตามราคา Vendor ป้ายที่จอดรถ — Owner: คุณนิด — Due: วันศุกร์</td></tr><tr><td>Open Question</td><td>Dashboard รายงานประจำสัปดาห์ยังไม่ได้กำหนด Owner</td></tr></table></div>';
if(s.view==="refine") inner+='<div class="ai" id="refineBox"><h3>Refine Prompt</h3><div class="prompt">แยกรายการที่ “ตัดสินใจแล้ว” ออกจาก “ข้อเสนอ/ยังไม่ตัดสินใจ” และทำเครื่องหมายรายการที่ Owner หรือ Due Date ยังไม่มีข้อมูล</div><div class="output"><b>Refined:</b><br>• ตัดสินใจแล้ว: ตรวจ log ลิฟต์และประสานช่าง<br>• Action: คุณนิดติดตามราคา Vendor ภายในวันศุกร์<br>• ยังไม่ตัดสินใจ: ทดลองทำ dashboard จาก Excel<br>• ต้องกำหนด: Owner และ Due Date ของ dashboard</div></div>';
if(s.view==="action") inner+='<div class="ai" id="actionTable"><h3>Action Tracker</h3><table class="table"><tr><th>Action</th><th>Owner</th><th>Due</th><th>Status</th></tr><tr><td>ตรวจ log ลิฟต์ + ประสานช่าง</td><td>ต้องกำหนด</td><td>ต้องกำหนด</td><td>Open</td></tr><tr><td>ติดตามราคา Vendor ป้ายจอดรถ</td><td>คุณนิด</td><td>วันศุกร์</td><td>Open</td></tr><tr><td>ทดลอง Dashboard จาก Excel</td><td>ต้องกำหนด</td><td>ต้องกำหนด</td><td>Pending decision</td></tr></table></div>';
if(s.view==="final") inner+='<div class="ai" id="finalBox"><h3>Ready to Share</h3><div class="output"><b>Key Decisions</b><br>• ตรวจข้อมูลการใช้งานลิฟต์อาคาร B และประสานช่าง<br><br><b>Action Items</b><br>• คุณนิดติดตามราคา Vendor ป้ายจอดรถภายในวันศุกร์<br><br><b>Open Questions</b><br>• Dashboard รายงานประจำสัปดาห์: ต้องกำหนด Owner / Due Date / ขอบเขตทดลอง</div><div class="prompt" style="margin-top:10px"><b>Human Check:</b> ยืนยัน Owner, Due Date และสิ่งที่เป็น Decision จริงก่อนแชร์</div></div>';
$("stage").innerHTML=shell(inner);setTimeout(()=>spotlight(s.target),80)
}
function spotlight(id){
  const el=$(id),stage=$("stage");
  if(!el)return;
  el.scrollIntoView({block:"center",inline:"nearest"});
  setTimeout(()=>{
    const st=stage.getBoundingClientRect(),r=el.getBoundingClientRect(),sp=$("spot"),n=$("spotnum");
    const left=(r.left-st.left+stage.scrollLeft-5);
    const top=(r.top-st.top+stage.scrollTop-5);
    sp.style.left=left+"px";
    sp.style.top=top+"px";
    sp.style.width=(r.width+10)+"px";
    sp.style.height=(r.height+10)+"px";
    sp.style.display="block";
    n.style.left=Math.max(6,left-14)+"px";
    n.style.top=Math.max(6,top-14)+"px";
    n.style.display="grid";
    n.textContent=i+1;
  },60);
}
let i=0;function render(){const s=steps[i];$("simTitle").textContent=s.sim;$("eyebrow").textContent=s.eye;$("title").textContent=s.title;$("body").textContent=s.body;$("memory").textContent=s.memory;$("human").textContent=s.human;$("nextText").textContent=s.next;$("count").textContent=(i+1)+" / "+steps.length;$("fill").style.width=((i+1)/steps.length*100)+"%";$("prev").disabled=i===0;$("next").textContent=i===steps.length-1?"จบ Demo ✓":"ถัดไป →";renderStage(s)}
$("next").onclick=()=>{if(i<steps.length-1){i++;render()}};$("prev").onclick=()=>{if(i>0){i--;render()}};$("reset").onclick=()=>{i=0;render()};document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&i<steps.length-1){i++;render()}if(e.key==="ArrowLeft"&&i>0){i--;render()}});render();
</script></body></html>
